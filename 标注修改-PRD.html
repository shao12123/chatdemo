# 标注修改 PRD

| 项目 | 内容 |
|---|---|
| 文档状态 | 按现有 Demo 场景整理 · 仅「多条标注的执行顺序」待确认 |
| 版本 | v0.1 · 2026-11-17 |
| 交互 Demo | [标注修改.html](标注修改.html)（左侧四个历史对话覆盖成功修改、全部失败、部分失败、发送后暂停；右上角「说明」是逐项标注，本文是给开发的交互说明） |
| 适用读者 | 前端、后端、测试，以及接手开发的 AGENT |

> 给 AGENT：请按「第 3 节场景 → 第 4 节交互流程 → 第 6 节状态 → 第 8 节验收」实现。本文只写 **PPT 生成完成后的标注修改**。生成过程中的分页失败、断线重试沿用《生成异常与恢复》，不要和本需求混成一套恢复按钮。第 9 节标成「已确认」的按结论开发；「待确认」的先不要自作主张改执行顺序。

---

## 1. 背景与目标

### 1.1 现状
PPT 已经生成并打开预览后，用户常常要改封面标题、某一页的要点、某一块配图说明。线上如果每改一处就发一条消息，对话会被拆碎，预览上也分不清改的是哪一块。

### 1.2 目标
- 生成完成后，在预览上框选多处，先入队，再一次发给 Agent。
- 未发送的标注只活在标注模式里；发出去之后，预览上的选区让位给修改结果或失败说明。
- 全部失败、部分失败、中途暂停，都不另开版本，也不把已发出的选区留在预览上。
- 成功修改才另存新版本，旧版本留在历史里，当前窗口换成新版。

### 1.3 成功标准
- 用户不离开预览，就能框选、改写、排队、一次发送。
- 关掉标注模式后，页上和队列里都不再有未发送的标注；已经出现在对话里的标注标签还在。
- 失败和暂停后，缩略图、大图、队列都没有这些序号；对话里仍能看出发过哪些标注。

---

## 2. 范围

### 2.1 本期做
1. 标注模式开关：只由预览顶栏的「标注修改」进入和退出。
2. 跨页框选、入队、整稿连续编号、单页不限数量。
3. 顶部刘海：查看、展开、编辑、删除未发送队列，并从刘海右侧一次发出。
4. 输入框发送：队列非空时，输入的文字和附件跟全部标注一起发出。
5. 四个结果：修改成功并另存新版、全部失败、部分失败、发送后暂停。
6. 失败用全站错误卡片，按钮文案是「重试」。暂停的继续 / 暂停放在输入框右侧，不放进对话。
7. 深浅色：对话、预览底、顶栏、历史抽屉、标注卡片跟随《行程对比 PRD》5.6 的 token。幻灯片画面和刘海配色不跟着主题变。

---

## 3. 场景

**要识别的场景是「PPT 标注修改」**：一份 PPT 已经生成结束，用户要按预览上的位置提出修改，并一次交给 Agent。

Demo 左侧四个历史对话是验收样例，不是功能白名单。规则对所有已生成完成的 PPT 预览生效。

| Demo 历史对话 | 进入时看到什么 | 用来验收的结果 |
|---|---|---|
| 标注修改演示 | 《红楼梦》10 页已生成，预览打开，标注关着 | 框选入队、一次发送、成功后另存新版 |
| 多标注修改-修改失败 | 已发送 3 条标注，3 条都失败 | 不另开版本；预览无序号；错误卡片 +「重试」 |
| 部分标注生成失败 | 3 条里后 2 条失败 | 不另开版本；成功和失败的选区都不留在预览；对话里保留失败标签 |
| 发送标注修改后暂停修改 | 3 条已发出，修改被暂停 | 不另开版本；预览无序号；输入框右侧是「继续修改」 |

说明面板里还记了这些边界，演示已按此处理：

| 编号 | 场景 | 结论 |
|---|---|---|
| s7 | 标注框开着，还没点发送就关掉或换页 | 这条草稿丢掉。已经入队的保留。正在改一条已入队标注时，没再发送就关掉，回到入队时的那一版 |
| s23 | 关闭标注模式 | 草稿和队列全部删除。再打开时页上没有序号。对话里已经发出的标签还在 |
| s8 | 只点一下，或只拖动一点点 | 不产生标注，不出现空序号 |
| s10 | 页面上已经有标注，再拉一个框 | 是新的一条。只有点开原序号、改完再发送，才更新原来那一条 |
| s11 | 标注框里上传附件 | 最多 5 个文档、5 张图片。图片超过 5MB、文档超过 10MB，提示并拒绝 |
| s12 | PPT 还在生成、检查或组装 | 标注入口不可用 |
| s15 | 标注框还开着，队列里已经有标注，此时发送 | 只发已经入队的。正在写、还没入队的那一条不发 |
| s16 | 删掉队列中间的一条 | 页上和队列一起去掉，后面的序号重排，保持连续 |
| s17 | 在已经生成完的旧版本上标注并发送 | 基于旧版生成新版。旧版留在历史。当前窗口换成新版，不另开窗口 |
| s19 | 序号很密，或贴着预览上沿、左沿 | 太近的序号互相遮挡；贴边的序号会被裁掉一截。悬停，或从队列点序号定位时，这一条露到最前。点队列里的文字会打开这条来编辑 |
| s18 / s21 / s22 | 暂停、全部失败、部分失败 | 见第 4.5–4.7 节 |
| s20 | 前后两条框中同一处内容，一起发送 | **待确认**。期望按标注序号依次执行。Demo 不证明模型是否真的按序改 |

## 4. 交互流程

### 4.1 打开和关闭标注
1. PPT 生成结束、预览已打开时，「标注修改」可点。生成中按钮禁用，文案为「生成完成后再标注」。
2. 点一次进入标注模式，再点一次退出。没有第二个开关。
3. 进入后：演讲者备注隐藏；预览上沿出现刘海；幻灯片内容下移，避免被刘海盖住（演示为上内边距 44px）；预览框描边变为 `#548BF9`。
4. 退出后：备注恢复；刘海消失；本份预览上的草稿和未发送队列全部清除（s23）。

### 4.2 框选、入队、编辑
1. 在幻灯片上按下并拉出一块足够大的选区，才出现标注框。选区描边为 `#3370FF`。
2. 标注框里写修改要求，可以加文档或图片。点框上的发送，只把这一条放进队列，并在页上留下序号。这一步不进对话。
3. 序号整稿连续，从 1 起，不按页重新从 1 编号。换页不丢队列。
4. 点页上的序号，展开这一条来改。再发送，更新队列里的同一条，不新增。
5. 点刘海列表里某一行的文字，跳到对应页并打开这一条。点行内删除，按 s16 重排序号。
6. 新拉出一个框，永远是新标注（s10）。

### 4.3 刘海
刘海是未发送队列的唯一收纳，不是对话消息。

| 位置 | 规则 |
|---|---|
| 尺寸 | 宽 280，高 36，贴住预览框上沿。顶部两角是反向圆角，不盖住幻灯片 |
| 颜色 | 描边和底都是 `#548BF9`，字是白色。深色模式下也不改这组颜色 |
| 左侧 | 数量圆标：浅蓝底、品牌色数字。新标注入队时数字向上滚到新数量，圆标本身不跳动 |
| 中间 | 「N 个标注」 |
| 箭头 | 在分割线左侧。没有标注时不可用。有标注时展开 / 收起队列 |
| 右侧 | 白底圆按钮，里面是朝右的箭头，文案是「修改」。悬停时在白底上叠一层 4% 的 `#090B0E`。禁用时仍是白底 |
| 列表 | 和刘海同宽 280。每行是序号 + 修改要求。未悬停时左右留白一致；悬停出现编辑和删除，按钮下用渐变盖住被挡住的文字 |

方案切换不展示。

### 4.4 一次发送
两条路，效果相同，都把**当前队列里的全部标注**一次发出：

1. 点刘海右侧「修改」。
2. 在输入框写下要求（例如「修改标注内容」）后发送。输入框里的文字和已选附件一并带上。

发送瞬间：

- 队列清空，页上序号去掉，刘海回到「0 个标注」且箭头不可用。
- 对话新增一条用户消息：每条标注一张圆角 12 的截图，按选区本身的比例完整显示框内内容，不包含整页其余部分。截图下面是对话气泡，写出每条修改要求。不显示页码标签。用户另写的文字和附件也在这个气泡里。
- 还开着、尚未入队的草稿不进入这条消息（s15）。退出标注时这条草稿会被删掉。
- 标注模式可以保持开着，方便继续框下一批。失败场景的演示在结果出现后仍停留在标注模式，但队列是空的。

成功时（「标注修改演示」）：

1. 思考过程按全站时间线展示：MoreAI 头像和名称、已完成与用时、展开后是「已执行 N 个步骤」。
2. 回复说明已按这些批注重出一份，原来的文件保留、不覆盖。
3. 另存一个新版本，历史里能看到旧版。当前预览窗口换成新版，不另开一个预览标签（s17）。

### 4.5 全部失败
前置：一次发出的多条标注全部没有生成成功。

- 不生成新版本，窗口仍停在当前版本。
- 标注模式不退出。
- 预览大图、缩略图、队列里都没有这些序号。
- 对话先写「这次修改失败了。原来的文件还在，没有生成新版本。」
- 下面是全站错误卡片：浅灰底、无描边、圆角 14、圆形叉号，主按钮文案是「重试」。不要做成白底描边的「重新生成」。
- 点「重试」不会把失败标注画回预览，也不会另开版本。

### 4.6 部分失败
前置：一次发出多条，其中一部分生成成功，一部分失败。Demo 用 3 条里的后 2 条失败。

- 不另开版本，窗口仍停在当前版本。
- 成功的选区和失败的选区都不留在预览和队列里。
- 对话说明哪些标注失败，并列出失败标签（序号、页、要求）。
- 同样使用错误卡片和「重试」。重试不把失败标注画回预览，不另开版本。
- 思考过程要能看出：收到了几条、哪一条已写入当前版本、哪几条没有生成成功。

### 4.7 发送后暂停
前置：标注已经发出，修改还在进行，用户暂停。

- 不另开版本。
- 已发送的标注不留在预览、缩略图和队列里。
- 对话写「修改已暂停。预览里不再保留这些标注。」思考过程说明是在修改未完成时暂停的。
- 对话里不放继续按钮。
- 输入框右侧：修改进行中是「暂停修改」；暂停之后是「继续修改」。输入框为空、也没有新的排队标注时，点它才继续或再次暂停。
- 若暂停后用户又排了新标注，或在输入框写了字，点发送走的是第 4.4 节的一次发送，而不是「继续刚才那次」。

### 4.8 其他交互
| 交互 | 规则 |
|---|---|
| 换页 | 未发送队列保留，序号不重置。未入队的草稿不保留 |
| 删除中间一条 | 序号立刻重排为连续整数 |
| 序号遮挡 | 默认后来的可以盖住先前的；悬停或从队列定位时，目标序号到最前。贴上沿、左沿的序号允许被裁切 |
| 附件超限 | 提示后拒绝加入这一条，不截断、不替换已有附件 |
| 历史版本 | 打开旧版再标注、再发送，新版本成为当前窗口，旧版只留在历史列表 |
| 思考过程 | 每一条 AI 输出都有 MoreAI 头像和名称。展开体是步骤时间线，不用灰胶囊标签 |
| 深浅色 | 右上角切换，并记住选择。刘海的蓝底白按钮、选区的 `#3370FF`、幻灯片画面保持原色 |

## 5. 组件

| 组件 | 出现条件 | 形态 |
|---|---|---|
| 标注修改按钮 | 预览顶栏始终在 | 选中时浅色为 `#F3F7FF` 底、`#0A59F7` 图标；深色为品牌浅底 + 品牌色图标 |
| 刘海 | 仅标注模式 | 见 4.3。一层条，展开后下面接列表，列表不再套卡 |
| 选区与序号 | 已入队，或正在编辑 | 选区 `#3370FF`；序号是浅蓝底、品牌色数字的圆标 |
| 标注框 | 拉开选区，或点开已有序号 | 修改要求、附件、发送。发送的含义是入队或更新队列，不是发给 Agent |
| 用户标注消息 | 一次发送之后 | 右侧气泡 + 一组标注标签。标签是序号圆标加「页 · 要求」 |
| 成功回复 | 修改完成 | 思考过程 + 一句结果 + 新版本文件卡 |
| 错误卡片 | 全部失败、部分失败 | 全站错误卡片 +「重试」。部分失败时卡片上方保留失败标签 |
| 暂停回复 | 修改被暂停 | 思考过程 + 一句暂停说明。继续控制在输入框，不在这条消息里 |
| 演讲者备注 | 标注模式关闭时 | 标注模式中隐藏，退出后恢复 |

层级最多两层：刘海展开后的列表、标注框，都不要再套一层卡。强调靠字重，不靠额外颜色。

---

## 6. 一条标注的状态

同一条标注在任一时刻只处于下面一种状态。

| 状态 | 页上序号 | 队列 | 对话 | 怎么离开 |
|---|---|---|---|---|
| 草稿 | 无 | 无 | 无 | 点框上的发送 → 入队；关掉框、换页、退出标注 → 删除 |
| 已入队 | 有 | 有 | 无 | 刘海「修改」或输入框发送 → 已发出；删除 → 消失并重排序号；退出标注 → 删除 |
| 已发出 · 修改中 | 无 | 无 | 有截图 | 成功 → 新版本；失败 / 部分失败 / 暂停 → 停在当前版本，预览保持无序号 |
| 已发出 · 结束 | 无 | 无 | 有截图，并有成功、失败或暂停说明 | 不自动回到预览。用户要改，必须重新框选 |

发给 Agent 的一次请求至少包含：

- 有序标注列表：序号、页码、选区位置、修改要求、该条附件。
- 用户在输入框另写的文字，和输入框附件。可以为空。
- 当前所基于的版本。在旧版本上发送时，新版本从那个旧版本长出来，而不是从最新版长出来。

序号以发送瞬间的队列顺序为准，从 1 连续编号。s20 要求模型按这个顺序执行；该条仍待确认，接口可以带上序号，但不要在前端再排一次「冲突合并」。

---

## 7. 前端职责

1. 标注模式、草稿、队列、序号重排，都在前端完成，不逐条请求。
2. 只有第 4.4 节的一次发送才把队列交给 Agent。
3. 发送后立刻清空预览上的选区和队列，不等待生成结果再清。失败和暂停的演示就是这个终态，不要在结果回来时把选区画回去。
4. 成功结果回来时才写入新版本，并把预览切到新版。
5. 输入框：Enter 发送，Shift+Enter 换行。队列非空时，发送键走一次发送。暂停场景且输入框为空、队列也为空时，发送键变成继续或暂停。
6. 深浅色只切换界面 token。不要把幻灯片图片、刘海、选区描边做成跟随主题的颜色。

---

## 8. 验收

- [ ] 生成中不能进入标注；生成结束后可以进入，再点一次退出。
- [ ] 只点击或极小拖动不产生序号；拉开选区后才出现标注框。
- [ ] 框上的发送只入队。换页后队列还在，编号整稿连续。
- [ ] 点已有序号改完再发送，队列条数不变。再拉一个新框，条数加一。
- [ ] 未入队就关框、换页或退出标注，这条草稿消失。
- [ ] 退出标注模式后，队列和页上序号都没了；对话里已发出的截图还在。
- [ ] 刘海宽 280，蓝底 `#548BF9`，右侧白圆按钮朝右，悬停为白底加 4% `#090B0E`。无标注时箭头不可用。
- [ ] 数量增加时数字滚动，圆标不跳动。
- [ ] 删除中间一条后，序号连续且与页上一致。
- [ ] 刘海「修改」和输入框发送，都会一次发出全部已入队标注；未入队草稿不在消息里。
- [ ] 输入框的额外文字和附件出现在同一条用户消息中。
- [ ] 成功：新版本出现在历史，当前窗口是新版，旧版仍可打开。
- [ ] 在旧版本上发送：新版基于该旧版，当前窗口切换过去。
- [ ] 全部失败：无新版本，预览无序号，错误卡片按钮是「重试」。
- [ ] 部分失败：无新版本，成功与失败的选区都不在预览上，对话能看到失败标签和「重试」。
- [ ] 重试后预览仍无这些序号，仍无新版本。
- [ ] 暂停：无新版本，预览无序号，对话里没有继续按钮；输入框在暂停与修改中之间切换「继续修改 / 暂停修改」。
- [ ] 附件超过 5 个文档、5 张图片、图片 5MB 或文档 10MB 时被拒绝。
- [ ] 深色下对话、预览底、备注、历史抽屉、标注框为深色；幻灯片画面、刘海蓝底和白色箭头按钮不变。
- [ ] 每条 AI 回复都有 MoreAI 头像；思考展开是步骤时间线。

  </script>
  <script>
    const source = document.getElementById("prdSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);
    document.getElementById("doc").innerHTML = html;
    document.getElementById("toc").innerHTML = toc.map(t => `<a class="l${t.level}" href="#${t.id}">${esc(t.text)}</a>`).join("");
    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    function downloadText(text, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    }
    document.getElementById("copyMd").addEventListener("click", () => {
      const done = () => notify("已复制 Markdown，可直接发给 AGENT");
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = source;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用「下载 PRD.md」"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(source).then(done).catch(fallback);
      else fallback();
    });
    document.getElementById("downloadMd").addEventListener("click", () => {
      downloadText(source, "标注修改-PRD.md");
      notify("已开始下载 PRD.md");
    });
    document.getElementById("downloadDemo").addEventListener("click", async () => {
      const name = "标注修改.html";
      try {
        const res = await fetch(name);
        if (!res.ok) throw new Error(String(res.status));
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
        notify("已开始下载 Demo.html");
      } catch (e) {
        const link = document.createElement("a");
        link.href = name;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        notify("已尝试下载 Demo.html");
      }
    });
    const links = [...document.querySelectorAll("nav.toc a")];
    const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1)));
    window.addEventListener("scroll", () => {
      let on = 0;
      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
      links.forEach((a, k) => a.classList.toggle("on", k === on));
    }, { passive: true });
  </script>
