> 给 AGENT：请按「第 6 节数据契约 → 第 7 节后端 → 第 8 节前端 → 第 11 节验收」的顺序实现。第 12 节已确认的按结论开发；写「沿用线上」的不改现有逻辑。

---

## 1. 背景与目标

### 1.1 现状
停止、重试、断网、文件读取失败这些处理，最早做在「论文对比」Demo 的单个场景里，存在这些问题：
- 只覆盖「写课程论文」一个场景，其他生成任务没有统一的处理；
- 断网一发生就判定失败，没有自动恢复；
- 「用户停止」「达到上限」和「出错」在提示和按钮上区分不清；
- 服务繁忙、检索超时等错误类型没有定义；
- 错误提示的样式在各个 Demo 里不一致：有卡片也有纯文字，图标有三角也有圆形。

### 1.2 目标
- 把「生成过程中出问题」做成一个独立的通用能力：除 PPT 以外的所有 AI 生成任务都接入同一套规则、组件和接口（Q1）。
- 用户任何时候都能知道三件事：发生了什么、已有内容在不在、下一步怎么做。
- 能自动恢复的不打扰用户；需要用户操作时，只给一个明确的恢复按钮。
- 已经生成的内容不丢、不重复。

### 1.3 成功标准
- 网络短暂断开（5 次重连以内恢复）时，用户不需要任何操作，文档最终完整、不重复。
- 任何一次中断后点「重试 / 继续生成」，结果和一次性生成完的内容一致（章节齐全、不重复）。
- 全站错误提示只有两种样式：错误卡片、普通错误提示（见 5.2、5.3）。
- 页面上不出现错误码和技术词（如 timeout、502、ECONNRESET）。

---

## 2. 范围

### 2.1 本期做
1. **统一的异常分级与恢复规则**（第 4 节）：自动处理 / 可恢复中断 / 不可恢复三级。
2. **异常类型**：用户停止（写入前、写入中）、检索超时自动重试、检索 3 次都失败、断网自动重连（恢复 / 5 次失败）、网络慢、服务繁忙（写入前、写入中）、超出单次生成上限、文件读取失败（4 类）。
3. **全站错误卡片**（5.2）：所有「生成中断 + 重试」都用这一个组件；其他 Demo 一并统一（论文对比、行程对比已改）。
4. **断线续传**：断网时后端继续生成，前端重连后按事件编号补收漏掉的内容（Q2）。
5. **续写与重试接口**：写入中断后从中断的那一节接着写；写入前失败从头重跑（Q12）。
6. **重连中 / 中断后发新消息**：当前任务按中断处理，新消息正常发送（Q8）。
7. 深浅模式：错误卡片的颜色走 token（5.2）。

### 2.2 本期不做
- **PPT 生成**：PPT 有自己的分页恢复逻辑（见「标注修改」Demo 的「PPT 生成失败」），本期不接入（Q1）。
- **额度不足**：本期不做处理，沿用线上逻辑和文案（Q5）。Demo 里的「额度不足」场景只作参考。
- **错误详情 / 请求编号复制**：卡片里不展示，只在埋点里记录（Q11）。
- **「检查网络」入口**、网络诊断工具。
- 服务繁忙时的自动重试（Q3）。
- 超出单次上限后的自动续写（Q6）。
- 离线编辑、离线排队发送。

## 4. 交互流程

### 4.1 统一规则
**分级**
1. **自动处理**：检索超时自动重试、网络慢、断网后自动重连。用户不用操作，只在思考区或错误卡片里看到进度，不弹错误。
2. **可恢复中断**：用户停止（写入中）、断网重连失败、服务繁忙、检索 3 次失败、超出单次上限。保留已有内容，只给一个恢复按钮。
3. **不可恢复**：文件读不了。说明原因和用户能做什么，不给按钮。

**按钮命名**
- 用户主动停止、达到单次上限：「继续生成」。这两种不算出错，不用红色图标。
- 出错（断网、服务繁忙、检索失败）：「重试」，用错误卡片。

**从哪里接着做**
- 还没写入文档就失败：不生成文档卡片，「重试」从头重跑整轮（Q12）。
- 写入过程中失败：已写好的节保留，从中断的那一节接着写，不重写、不重复。
- 普通回复（不写文档）：已输出的文字保留，从已输出的位置接着输出（Q1）。

**一次中断只给一个恢复入口**：按钮用过就消失；错误卡片关闭后，不再保留重试入口。

### 4.2 状态机（一次生成任务）
```
idle ─发送→ thinking ─开始写入→ writing ─完成→ done
  thinking / writing ─用户停止→ stopped（写入前：撤回回填，回到 idle；写入中：可「继续生成」）
  thinking / writing ─工具超时→ 自动重试（≤3 次）→ 成功继续 / 失败 → failed（写入前，「重试」从头）
  thinking / writing ─服务繁忙→ failed（写入前「重试」从头；写入中「重试」续写）
  writing ─达到单次上限→ paused（「继续生成」续写）
  thinking / writing ─连接断开→ reconnecting ─重连成功→ recovered（约 1 秒后回到原状态，补收内容）
                                    └─5 次失败 / 用户发新消息→ failed（「重试」重新接上）
```
- `reconnecting` 期间：不能停止；输入框可输入、可发送（发送即按中断处理，见 4.5）。
- 任何 `failed` / `paused` / `stopped` 状态下，用户都可以直接发新消息。

### 4.3 断网（重连中 → 恢复 / 失败）
1. 前端判定连接断开（8.1）→ 思考区标题「连接中断，正在重连」，写入文档那一步显示「网络中断，已写好 N 节，正在重连（第 k 次）」，头像晕眩。
2. 文档卡片下方出现错误卡片（重连中）：「网络连接中断。已写好的 N 节保留在文档里，网络恢复后会自动接着写。」右下「立即重试」+ ×；卡片下方 8px 灰字「正在检查网络… 5 秒后重试」→「正在重连（第 k 次）…」。
3. 重连成功：卡片变成「网络已恢复，从第 N+1 节接着写。」（绿色勾），约 1 秒后自动收起；补收断线期间的内容，继续写。思考区这一轮结果为「已重新连接」，下面接一轮新的思考「重新连接 → 写入文档」。
4. 5 次都失败：卡片变成「多次重连没有成功。已写好的 N 节保留在文档里。」+「重试」；思考区「生成中断」。点「重试」= 再接一次（7.1），成功后同第 3 步。

### 4.4 写入前失败（检索 3 次超时 / 服务繁忙）
1. 检索超时：步骤下显示「检索超时，正在重试（1/3）」，标题「正在重试检索文献」；3 次都失败，该步骤标失败「检索文献连续 3 次超时，没有拿到文献。」。
2. 服务繁忙：当前步骤标失败「服务繁忙，请求没有被处理。」。
3. 思考区「生成中断」，下方出现错误卡片 +「重试」；不生成文档卡片。
4. 点「重试」：原来失败的那一轮保留，下面接一轮新的思考，从头重跑。

### 4.5 用户停止与发新消息
- **写入前停止**：这一轮（用户消息 + 思考）撤回，原文回填输入框；带文件或引用的消息，文件 / 引用也一起回填（Q9）。
- **写入中停止**：思考区「已停止」，写入步骤「已停止，已写好 N 节。」；消息「已停止生成。已写好的 N 节保留在文档里，可以继续生成。」+「继续生成」。
- **重连中发新消息**（Q8）：当前任务立即按中断处理，卡片直接变成失败状态（保留「重试」），写入步骤「网络中断，用户发了新消息，本次生成按中断处理。」；新消息正常发送。
- **中断后发新消息**：已有的「重试 / 继续生成」保留，仍可点；同一时间只能有一个任务在跑，跑的过程中旧按钮暂时不可点。

### 4.6 超出单次生成上限
- 写入步骤「超出单次生成上限，已写好 N 节。」；思考区「已达单次上限」（暂停图标，不是错误图标）。
- 消息「内容超出单次生成上限。已写好的 N 节保留在文档里，点「继续生成」从第 N+1 节接着写。」+「继续生成」。不自动续写（Q6）。

### 4.7 网络慢（Q10）
- 任意一步超过 8 秒没有新内容：思考区标题换成「网络较慢，仍在××…」（××为当前阶段，如「检索文献」），收起时也能看到；步骤下显示「响应较慢，仍在处理…」。
- 有新内容到达后，标题还原为原阶段名。不出现错误卡片，不重试。

### 4.8 文件读取
- 发送后，思考区逐个显示「读取「文件名」」：有文字层直接读取，显示约多少字；PDF 读不到文字时改用 OCR，再显示识别结果。
- 失败的文件每个一条普通错误提示（文案见 5.5）；成功的照常可用；全部失败时只有失败提示，没有结论。
- 格式不支持、超过 20 MB：前端发送前就判定，不进入读取步骤，但仍在对话里提示。

## 5. 组件与样式规范

### 5.1 组件清单
| 组件 | 用在哪里 | 说明 |
|---|---|---|
| 输入框发送 / 停止按钮 | 输入框右下 | 思考或写入中显示停止（实心方块）；重连中不可停止 |
| 思考区标题与步骤状态 | 回复顶部 | 标题文案见 5.4；步骤状态：进行中 / 完成 / 失败 / 停止 |
| **错误卡片**（全站） | 回复内，文档卡片之后 | 所有「生成中断 + 重试」，含重连中 / 已恢复 / 失败三种状态（5.2） |
| 普通错误提示 | 回复内 | 红色圆形叉号 + 一段文字，不套卡片，没有按钮（文件失败） |
| 恢复提示 | 回复内 | 一段文字 + 下方「继续生成」，不用红色图标（停止、达到上限） |

### 5.2 全站错误卡片（Error Card）
**定位**：全站一致的设计。任何生成任务出错、需要用户「重试」时都用它；和「出行提示」等提示块是同一族（同样的底色、圆角），靠图标区分。

**结构**：左侧图标 + 文案；右下操作区：主按钮（「重试」或「立即重试」）+ ×；卡片下方 8px 可选一行灰字状态（倒计时）。

| 属性 | 取值 |
|---|---|
| 底色 | `--err-card`：浅色 #EEF0F3（次要容器），深色 #191A1D；无描边 |
| 圆角 / 内边距 | 14px；12px 16px；卡内行间距 8px |
| 宽度 | 最宽 680px，窄屏 100% |
| 图标 | 16px 圆形叉号，`--err-icon` #E84026，是卡内唯一的颜色；已恢复时换成绿色实心勾 `--err-ok`（浅 #64BB5C / 深 #5BA854） |
| 文案 | 14/22，`--err-text`（浅 #000 / 深 #FFF） |
| 主按钮 | 现有蓝色渐变主按钮（30px 高、圆角 8）；「立即重试」用次按钮（白底描边） |
| × | 22px，`--err-text-2`（60%），悬停底 6% 黑 / 8% 白；无悬停气泡 |
| 状态灰字 | 13/20，`--err-text-2`，在卡片下方 8px |

**规则**
- 文案只写「发生了什么 + 已有内容在不在」，不写「点「重试」…」，也不加「生成中断：」前缀（思考区标题已说明）。
- × 只关卡片；关闭后不再保留重试入口。按钮用过后消失，卡片保留文字。
- 一条回复里同一时间最多一张错误卡片。

**不用于**：用户停止、达到单次上限（用恢复提示）；文件读取失败（用普通错误提示）。

### 5.3 普通错误提示与恢复提示
- 普通错误提示：16px 圆形叉号 #E84026 + 14/22 文字，图标和首行文字垂直对齐（图标上边距 3px），不套卡片。
- 恢复提示：14/22 文字，下方 12px 是「继续生成」主按钮；不出现红色图标。

### 5.4 思考区文案
| 状态 | 标题（进行中为流光） | 结束结果 |
|---|---|---|
| 正常 | 正在××（如「正在检索文献」） | 已完成 N 秒 |
| 工具自动重试 | 正在重试××（步骤下「××超时，正在重试（k/3）」） | — |
| 网络慢 | 网络较慢，仍在××… | — |
| 断网重连中 | 连接中断，正在重连 | — |
| 重连成功 | — | 已重新连接 N 秒 |
| 出错 | — | 生成中断 N 秒 |
| 用户停止 | — | 已停止 N 秒 |
| 达到上限 | — | 已达单次上限 N 秒（暂停图标） |

### 5.5 文案清单
| 场景 | 位置 | 文案 | 按钮 |
|---|---|---|---|
| 断网重连中 | 错误卡片 | 网络连接中断。已写好的 N 节保留在文档里，网络恢复后会自动接着写。 | 立即重试 |
| 断网重连中 | 卡片下灰字 | 正在检查网络… S 秒后重试 / 正在重连（第 k 次）… | — |
| 断网已恢复 | 错误卡片 | 网络已恢复，从第 N+1 节接着写。 | — |
| 断网 5 次失败 | 错误卡片 | 多次重连没有成功。已写好的 N 节保留在文档里。 | 重试 |
| 检索 3 次失败 | 错误卡片 | 检索文献连续 3 次超时，还没有写入文档。 | 重试 |
| 服务繁忙（写入前） | 错误卡片 | MoreAI 当前使用人数较多，暂时无法生成，还没有写入文档。 | 重试 |
| 服务繁忙（写入中） | 错误卡片 | 服务繁忙，生成中断。已写好的 N 节保留在文档里。 | 重试 |
| 写入中停止 | 恢复提示 | 已停止生成。已写好的 N 节保留在文档里，可以继续生成。 | 继续生成 |
| 超出单次上限 | 恢复提示 | 内容超出单次生成上限。已写好的 N 节保留在文档里，点「继续生成」从第 N+1 节接着写。 | 继续生成 |
| 格式不支持 | 普通错误提示 | 「x」暂不支持读取。目前支持 Word（.docx）、PDF、TXT 和 Markdown，转换格式后再上传。 | — |
| 超过 20 MB | 普通错误提示 | 「x」超过 20 MB，暂时读不了。压缩或拆分后再上传。 | — |
| 文件损坏或加密 | 普通错误提示 | 「x」打不开，可能已损坏或设了密码。检查后重新上传。 | — |
| OCR 无结果 | 普通错误提示 | 「x」没能读出文字：文件里没有文本，图片识别也没有结果。换一份更清晰的文件再试。 | — |

- 一节都没写完时，「已写好的 N 节」改为「写好的部分」。
- 普通回复（不写文档）：「已写好的 N 节保留在文档里」改为「已输出的内容会保留」，「从第 N+1 节接着写」改为「接着往下写」。
- 文案由前端按 `code` + 进度字段拼接（6.3），后端不下发展示文案。

## 6. 数据契约（后端 → 前端）

### 6.1 任务模型
- 每次生成是一个 **run**（`run_id`），属于某条 assistant 消息（`message_id`）。续写、重新接上都沿用同一条消息；「重试」从头重跑时新建一条 assistant 消息（原来失败的那条保留）。
- run 的事件流每个事件带递增的 `seq`（SSE `id` 字段）。后端缓存每个 run 的全部事件，**run 结束后保留 30 分钟**，用于断线补发。
- 文档类任务按「节」记录检查点：`checkpoint = { doc_id, written_sections, cursor }`，`cursor` 指向下一节开头（续写从这里开始）。普通回复的检查点是已输出的字符数。

### 6.2 流式事件（SSE）
| 事件 | 载荷 | 前端行为 |
|---|---|---|
| `run_start` | `{ run_id, message_id, kind: "doc" / "reply", resume_of? }` | 创建 / 接上回复容器 |
| `thinking_step` | `{ step_id, key, title, note }` | 追加思考步骤（进行中） |
| `step_update` | `{ step_id, state: "running" / "done" / "fail" / "stop", note?, progress? }` | 更新步骤；`progress` 如「检索超时，正在重试（1/3）」 |
| `doc_open` | `{ doc_id, title, total_sections }` | 出现文档卡片「编写中」，打开右侧文档 |
| `doc_section` | `{ doc_id, index, heading }` | 开始写第 index 节 |
| `doc_delta` | `{ doc_id, index, text }` | 追加正文 |
| `text_delta` | `{ text }` | 普通回复追加文字 |
| `file_result` | `{ file_id, name, ok, chars?, ocr?, error_code? }` | 读取步骤显示结果；失败时出普通错误提示 |
| `heartbeat` | `{}` | 每 5 秒一次（没有其他事件时），用于判断连接是否还在 |
| `interrupted` | `{ reason: "user_stop" / "output_limit", checkpoint }` | 恢复提示 +「继续生成」 |
| `error` | `{ code, stage: "before_write" / "writing", checkpoint?, retry: "restart" / "resume" / "none", request_id }` | 按 6.3 渲染 |
| `done` | `{ message_id, checkpoint }` | 结束，显示操作栏 |

### 6.3 错误码
| `code` | 分级 | 触发 | `retry` | 前端展示 |
|---|---|---|---|---|
| `TOOL_TIMEOUT` | 可恢复中断 | 工具（如检索）自动重试 3 次仍超时 | `restart` | 错误卡片 +「重试」 |
| `SERVICE_BUSY` | 可恢复中断 | 模型 / 服务限流、过载（429 / 503） | 写入前 `restart`，写入中 `resume` | 错误卡片 +「重试」 |
| `FILE_UNSUPPORTED` | 不可恢复 | 格式不在支持列表 | `none` | 普通错误提示 |
| `FILE_TOO_LARGE` | 不可恢复 | 超过 20 MB | `none` | 普通错误提示 |
| `FILE_BROKEN` | 不可恢复 | 文件损坏或加密 | `none` | 普通错误提示 |
| `FILE_OCR_EMPTY` | 不可恢复 | 无文字层且 OCR 无结果 | `none` | 普通错误提示 |
| `QUOTA_EXCEEDED` | — | 额度用完 | — | **沿用线上**（Q5） |
| `INTERNAL` | 可恢复中断 | 其他未分类错误 | 写入前 `restart`，写入中 `resume` | 错误卡片，文案同服务繁忙（写入中）的结构：「生成中断。已写好的 N 节保留在文档里。」 |

- 断网不是后端错误码，由前端判定（8.1）。
- 用户停止、达到上限走 `interrupted`，不走 `error`。
- 未知 `code` 一律按 `INTERNAL` 处理。

### 6.4 接口
| 接口 | 说明 |
|---|---|
| `POST /chat/messages` | 发送消息，返回 SSE（`run_start` 起） |
| `GET /runs/{run_id}/events`，头 `Last-Event-ID: <seq>` | 断线重连：补发 `seq` 之后的事件，run 仍在跑则继续推送；run 已结束则补发到 `done` / `error` / `interrupted` 后关闭；事件已过期返回 `410` |
| `POST /runs/{run_id}/stop` | 用户停止；返回 `{ phase: "before_write" / "writing", checkpoint? }`。`before_write` 时后端撤回这一轮（不落库） |
| `POST /runs/{run_id}/resume` | 从检查点续写（继续生成、写入中的重试、补发过期后的重试）；返回新 run 的 SSE，`run_start.resume_of = 原 run_id` |
| `POST /messages/{message_id}/restart` | 写入前失败的重试：从头重跑，新建 assistant 消息 |

## 7. 后端职责

### 7.1 断线续传（Q2）
- 客户端断开**不取消** run，继续生成到结束；事件写入缓存（按 run 保存，带 `seq`）。
- 重连请求带 `Last-Event-ID`：从下一条开始补发。补发完若 run 仍在跑，继续实时推送。
- run 结束 30 分钟后事件过期，重连返回 `410`；前端改调 `resume`（从检查点续写）。
- 「重试」（5 次失败后）走的也是重连接口；只有 `410` 时才续写。

### 7.2 工具自动重试
- 工具调用（检索等）超时自动重试，最多 3 次；每次重试推 `step_update.progress = "××超时，正在重试（k/3）"`。
- 3 次都失败：该步骤 `state = fail`，推 `error { code: TOOL_TIMEOUT, stage: before_write, retry: restart }`。
- 写入阶段的工具超时同理；如已开始写入，`stage = writing`、`retry = resume`。

### 7.3 服务繁忙（Q3）
- 不自动重试。收到限流 / 过载时，当前步骤 `fail`，推 `error { code: SERVICE_BUSY }`；`stage` 按是否已开始写入判定，写入中附 `checkpoint`。

### 7.4 停止
- `stop` 时立即停止模型输出。还没开始写入（没有 `doc_open` / `text_delta`）：返回 `before_write`，撤回这一轮，不落库。已开始写入：返回 `writing` 和 `checkpoint`，并推 `interrupted { reason: user_stop }`。
- 断网重连期间前端不会发 `stop`。

### 7.5 单次生成上限（Q6）
- 模型输出达到单次上限（上限值为后端配置）时，在最近的完整节末尾截断，推 `interrupted { reason: output_limit, checkpoint }`；未写完的半节丢弃，续写时从这一节开头重新写。不自动续写。

### 7.6 续写
- `resume` 读取检查点：文档类从 `cursor`（下一节开头）接着写，提示词带上已写章节的标题和摘要，保证衔接、不重复；普通回复带上已输出文本接着写。
- 续写的事件沿用同一条消息、同一个 `doc_id`。

### 7.7 从头重跑（Q12）
- `restart` 新建一条 assistant 消息，从头执行整轮（不复用已完成步骤）；原来失败的那条保留。

### 7.8 文件解析
- 支持 Word（.docx）、PDF、TXT、Markdown；单个文件 ≤ 20 MB。
- PDF 无文字层时自动 OCR；OCR 也没有结果返回 `FILE_OCR_EMPTY`。
- 每个文件推一次 `file_result`；部分失败不影响其他文件和后续步骤；全部失败时不进入后续生成。

### 7.9 心跳
- 没有其他事件时每 5 秒推一次 `heartbeat`，便于前端区分「慢」和「断」。

### 7.10 额度
- 沿用线上（Q5），本需求不改。

### 7.11 埋点
| 事件 | 字段 |
|---|---|
| `gen_error` | `code`、`stage`、`request_id`、`run_id`、场景类型 |
| `gen_reconnect` | 次数、结果（recovered / failed / interrupted_by_send）、断线时长 |
| `gen_resume` / `gen_restart` | 触发来源（继续生成 / 重试）、原 `run_id` |
| `gen_stop` | `phase`（before_write / writing） |
| `gen_slow` | 步骤、等待时长 |

`request_id` 只进埋点和日志，不在界面展示（Q11）。

## 8. 前端职责

### 8.1 连接管理
- **判定断开**：SSE 连接报错 / 被关闭且没有收到 `done` / `error` / `interrupted`；或 15 秒内没有任何事件（含心跳）；或浏览器 `offline` 事件。
- **自动重连**：最多 5 次（Q7，配置项 `reconnect.tries = 5`），每次前倒计时 5 秒（`reconnect.wait = 5`）；「立即重试」跳过当前倒计时。
- 重连调用 `GET /runs/{run_id}/events` 并带最后收到的 `seq`；成功后卡片切「已恢复」，约 1 秒后收起，按补发事件继续渲染。
- 5 次都失败：卡片切失败状态 +「重试」；点「重试」再走一次重连，`410` 时改调 `resume`。
- 去重：按 `seq` 丢弃已渲染过的事件，保证不重复。

### 8.2 网络慢提示（Q10）
- 当前步骤在 8 秒内没有收到任何内容事件（心跳不算）：标题换成「网络较慢，仍在××…」，步骤下显示「响应较慢，仍在处理…」；收到内容后还原。阈值做成配置项。

### 8.3 状态与按钮
- 按 4.2 状态机维护每个 run 的状态；输入框按钮：`thinking` / `writing` 显示停止，`reconnecting` 显示普通发送。
- 恢复按钮（重试 / 继续生成）点击后立即标记已用并隐藏，防止重复点击；同一时间只允许一个 run，跑的过程中其他恢复按钮不可点。

### 8.4 停止与回填（Q9）
- 调 `stop`，返回 `before_write`：移除这一轮的用户消息和思考，把原文、文件、引用放回输入框，光标放到末尾。
- 返回 `writing`：按 `interrupted` 渲染恢复提示。

### 8.5 重连中发新消息（Q8）
- 发送时如有 run 处于 `reconnecting`：停止重连，卡片切失败状态（保留「重试」），写入步骤备注改为「网络中断，用户发了新消息，本次生成按中断处理。」，再发送新消息。

### 8.6 渲染
- 错误卡片、普通错误提示、恢复提示按第 5 节实现；文案按 `code`、`stage`、`checkpoint.written_sections` 拼接（5.5）。
- 文件：发送前校验格式和大小，不合格的不上传，直接在对话里提示；其余上传后按 `file_result` 渲染。

### 8.7 无障碍与适配
- 错误卡片 `role="alert"`；重连倒计时 `aria-live="polite"`；× 带 `aria-label="关闭"`。
- 开启「减少动态效果」时关闭头像晕眩动画和流光。
- 深浅模式：颜色取自 5.2 token，跟随产品主题。
- 窄屏：卡片 100% 宽，按钮不换行。

## 9. 接口与时序

```
正常：POST /chat/messages → run_start → thinking_step… → doc_open → doc_section/doc_delta… → done

断网恢复：
  … doc_delta(seq=120) ✕ 连接断开
  → 前端：重连中卡片，倒计时 5 秒
  → GET /runs/{id}/events  Last-Event-ID: 120
  → 补发 seq 121… → 卡片「已恢复」→ 1 秒后收起 → 继续 … → done

断网 5 次失败 → 卡片失败 +「重试」
  → 用户点「重试」→ GET /runs/{id}/events（同上）
     └─ 410（事件已过期）→ POST /runs/{id}/resume → 新 run，从 checkpoint 续写

写入前失败（检索 3 次超时 / 服务繁忙）：
  … step_update(fail) → error{ stage: before_write, retry: restart }
  → 用户点「重试」→ POST /messages/{id}/restart → 新消息从头跑

写入中服务繁忙：error{ stage: writing, retry: resume, checkpoint } → 「重试」→ POST /runs/{id}/resume

停止：POST /runs/{id}/stop
  ├─ before_write → 前端撤回并回填
  └─ writing → interrupted{ user_stop } → 「继续生成」→ POST /runs/{id}/resume

达到上限：interrupted{ output_limit } → 「继续生成」→ POST /runs/{id}/resume
```

---

## 10. 边界与异常
| 情况 | 处理 |
|---|---|
| 重连期间用户点 × 关闭卡片 | 只关卡片，自动重连照常进行；5 次失败后不再出现重试入口 |
| 重连期间用户切换会话 | run 在后端继续；回到会话时按 `Last-Event-ID` 补收 |
| 生成中刷新页面 | 重新加载会话后，对未结束的 run 发起重连补收；run 已结束则直接显示结果 |
| 补发事件已过期（410） | 改调 `resume` 从检查点续写 |
| 续写时文档已被用户手动编辑 | 只在文档末尾追加新的节，不覆盖用户的编辑 |
| 重连成功时 run 已因其他错误结束 | 补发到 `error` 后按该错误渲染 |
| 同一回复连续多次中断 | 每次只保留最新一张错误卡片的按钮，旧卡片的按钮置为已用 |
| 写入第 1 节时就中断 | 文案用「写好的部分」 |
| 普通回复（无文档）中断 | 已输出文字保留，按 5.5 普通回复文案 |
| 多个文件部分失败 | 成功的继续使用，失败的逐条提示 |
| 网络慢后又断开 | 进入断网流程，慢提示消失 |
| 未知错误码 | 按 `INTERNAL` 处理 |

## 11. 验收标准

### 11.1 功能
- [ ] Demo 左侧 11 个场景（额度不足除外）逐个对照，行为和文案一致。
- [ ] 断网后 5 次以内恢复：用户无需操作，文档章节齐全、不重复。
- [ ] 断网 5 次失败后点「重试」：能接上；补发过期时能从检查点续写。
- [ ] 写入前失败的「重试」新建一轮从头跑，原失败轮保留。
- [ ] 写入前停止：用户消息和思考撤回，文字、文件、引用回填。
- [ ] 写入中停止、达到上限：「继续生成」从中断的那一节接着写。
- [ ] 重连中发新消息：卡片变失败状态并保留「重试」，新消息正常发出。
- [ ] 任意一步超过 8 秒无内容：标题出现「网络较慢，仍在××…」，收起状态也能看到。
- [ ] 4 类文件失败文案正确；格式不支持、超过 20 MB 的不上传。
- [ ] 恢复按钮用过即消失；× 关闭后不再出现重试入口。

## 12. 模拟开发走查：问题与待确认

按「后端检测异常 → 推送事件 → 前端渲染 → 用户恢复」走了一遍，下列问题已全部确认，按结论开发。

| # | 问题 | 为什么会卡住开发 | 结论 | 状态 |
|---|---|---|---|---|
| Q1 | 适用范围：接入哪些生成任务？ | 决定接口和组件放在公共层还是业务层 | 除 PPT 以外的所有 AI 生成任务统一接入；文档类按「节」续写，普通回复按已输出位置续写 | 已确认 |
| Q2 | 断网时后端任务停止还是继续？ | 决定是否要做事件缓存和断线补发 | 后端继续生成；前端重连后按事件编号补收；「重试」也是重新接上，事件过期时才续写 | 已确认 |
| Q3 | 服务繁忙是否自动重试？ | 影响后端重试策略和用户等待时长 | 不自动重试，直接给错误卡片 +「重试」 | 已确认 |
| Q4 | 服务繁忙、额度不足的文案用哪套？ | 线上可能已有文案 | 服务繁忙用 Demo 文案；额度不足见 Q5 | 已确认 |

| Q7 | 自动重连的次数和间隔？ | 前端重连策略 | 5 次，每次倒计时 5 秒，做成配置项 | 已确认 |
| Q8 | 重连中或中断后用户发新消息怎么办？ | 并发任务的处理 | 当前任务按中断处理，保留「重试」，新消息正常发送 | 已确认 |

## 13. 给 AGENT 的开发指引

### 13.1 任务拆分（建议顺序）
1. **数据契约**：按 6.2–6.4 定义事件、错误码、检查点的 TypeScript 类型 / JSON Schema，前后端共用；录制 6 份事件序列 fixture（正常、断网恢复、断网失败、写入前失败、写入中服务繁忙、达到上限）。
2. **后端**：run 与事件缓存（`seq`、30 分钟保留）→ 重连补发接口（7.1）→ 停止（7.4）→ 工具重试（7.2）→ 服务繁忙（7.3）→ 单次上限截断（7.5）→ 续写 / 从头重跑（7.6、7.7）→ 文件解析（7.8）→ 心跳（7.9）→ 埋点（7.11）。
3. **前端公共层**：连接管理与重连（8.1，先写单测：断开判定、倒计时、`seq` 去重）→ 状态机（4.2、8.3）→ 慢提示（8.2）→ 停止回填（8.4）→ 发新消息打断（8.5）。
4. **组件**：在公共组件库实现 `ErrorCard`（5.2，含重连中 / 已恢复 / 失败三种状态）、`ErrorNotice`、`ResumeNotice`；替换各业务里的旧错误提示。独立提交，影响全站。
5. **接入**：文档生成 → 普通回复 → 其他生成任务；PPT 不接入。
6. **联调与验收**：用 fixture 回放 + 弱网 / 断网工具（如浏览器 Network 面板 offline）按第 11 节逐条验收，用 Demo 做视觉对照。

### 13.2 实现约束
- 不新增颜色和字号；错误卡片只用 5.2 的 token，浅色 / 深色都要实现。
- 文案由前端按 `code` 和进度字段拼接，后端不下发展示文案；页面上不出现错误码。
- 恢复按钮必须幂等：重复点击、重连与续写并发时，只会产生一个 run。
- 续写结果按 `seq` / 节号去重，任何情况下不重复写入同一节。
- 重连次数、间隔、慢提示阈值、事件保留时长都做成配置项。

</script>
  <script>
    const source = document.getElementById("prdSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const ordered = /^\s*\d+\./.test(line);
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);
    document.getElementById("doc").innerHTML = html;
    document.getElementById("toc").innerHTML = toc.map(t => `<a class="l${t.level}" href="#${t.id}">${esc(t.text)}</a>`).join("");
    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    document.getElementById("copyMd").addEventListener("click", () => {
      const done = () => notify("已复制 Markdown，可直接发给 AGENT");
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = source;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用「下载 .md」"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(source).then(done).catch(fallback);
      else fallback();
    });
    document.getElementById("downloadMd").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([source], { type: "text/markdown;charset=utf-8" }));
      link.download = "生成异常与恢复-PRD.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    });
    const links = [...document.querySelectorAll("nav.toc a")];
    const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1)));
    window.addEventListener("scroll", () => {
      let on = 0;
      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
      links.forEach((a, k) => a.classList.toggle("on", k === on));
    }, { passive: true });
  </script>
