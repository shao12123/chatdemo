# 建议与计划识别 · 计划清单触发（Agent TOOL）

| 项目 | 内容 |
|---|---|
| 工具名 | `present_plan_list` |
| 用途 | 先分别识别本轮是不是**建议**、是不是**计划**。只有识别到计划，且主答案里有一张拿掉钟点还在的清单时，才调用本工具走 Intelligent UI。只识别到建议时用普通文字给结论，不调用 |
| 版本 | v0.4 · 2026-11-19 |
| 配套 | [生成计划清单场景.html](生成计划清单场景.html)（交互 Demo）。组件、字段、渲染、多轮修改待 PRD，不在本文件 |
| 口径 | **建议与计划分别判定，可同时成立** · 计划清单严触发 · **首轮判定**（不含确认、沿用、改某一项） |

> 把下面的 **description** 和 **系统提示增补** 贴进 Agent 的 tools / system prompt。本文件**不写** JSON Schema、校验、兜底、多轮引用。计划 HTML 有章节时必须带目录，写在本文件；其余渲染待 PRD。

---

## 1. 两次判定

每一轮做两次判定，互不影响。可以只识别到建议，只识别到计划，或两个都识别到。

不要靠「建议」「计划」「推荐」「清单」这些词。

事情已经清楚，只缺钟点、日期、人数或预算：按常理补全。缺这些信息不影响两次判定。

### 建议

同时满足即识别为建议：

1. 有一个具体处境：谁、什么场合，或一个已经说清的目标；
2. 里面有一个还没定的选择或做法；
3. 用户要的是这个选择的结论和理由。

识别到建议之后，答案里给出结论。二选一、三选一时，结论就是选项本身。问法开放时，结论后面加短理由；需要比较时给 2～3 个选项。

本轮没有同时识别到计划时，不追加清单、步骤或时间表，也不调用本工具。

### 计划

同时满足即识别为计划：

1. 有一件即将发生的具体的事，或一个已经说清、即将去做的目标；
2. 用户要的是可以照着做的安排；
3. 安排里有条目：要做的事、要备的东西，或先后顺序；
4. 拿掉钟点后，这些条目还在。

识别到计划之后，清单是主体。时间可以写在条目旁边。没写具体钟点或日期，按常理假设后仍出这份安排。半天、一天、跨天都算。条目按天分开写，仍然是清单。

条目是要做的事或要备的东西时，调用 `present_plan_list`。时间格用普通文字。交通行程走 `present_route_compare`。

计划以 HTML 交付，且正文里有章节时：HTML 中加入目录。章节是可以单独定位的标题，例如概览、菜单、采购、时间。目录项与章节标题一致，点击跳到对应章节。正文没有章节时，不加目录。

周日烤羊肉只是 Demo 示例，不是白名单。

### 两个都识别到

建议的结论和计划的清单都要交付。结论用普通文字。清单调用 `present_plan_list`。

---

## 2. 何时调用 / 何时不调用

### 要调用（走 Intelligent UI）

计划判定为是，且本轮主答案里有一张清单，拿掉钟点后条目还在。

同一轮若同时识别到建议：结论用普通文字，清单仍调用本工具。

说明：

- 缺具体钟点、日期、人数或预算：按常理假设后仍可调用。
- 同一轮还要把活动排进时间格：清单仍调用本工具；时间格用普通文字另答。
- 同一轮还夹了无关问题：计划部分仍调用本工具；无关部分用普通文字另答。
- 同一轮还要排交通行程（从哪到哪、怎么走）：交通部分走 `present_route_compare`；计划清单仍调用本工具。

### 不调用（普通文字）

任一成立即不调用：

- 只识别到建议：用普通文字给结论；
- 两次判定都为否。见下一节。

### 两者都不识别

建议判定为否，计划判定也为否：

- **模糊需求**：只有笼统愿望，看不出具体处境、待定的选择，或即将要办的事。只丢出一个选项，看不出这个选择发生在什么场合，同样算。本轮先追问，不交付结论，也不交付清单。
- **知识或做法**：要的是事实、原理、做法解释，没有要他做选择，也没有一件要办的事。
- **排期**：主交付是时间格。拿掉钟点，内容就不成立。
- **行程**：主交付是从哪到哪、怎么走。有序交通行程段走 `present_route_compare`。
- **攻略或菜谱**：推荐景点、美食、玩法，或写做法，没有一件他即将要办的具体的事。
- **已给出的条目**：用户已经点明要买什么、做什么，没有要求为这件事再做安排。
- **执行**：订位、下单、付款、发消息、建群，以及其他替他完成动作的请求。
- **加工已有内容**：翻译、总结、改写、换格式。对象是已经存在的计划或文本。
- **工作管理**：项目排期、OKR、周报，以及其他岗位或团队管理安排。

### 本 TOOL 不覆盖（不要写进触发规则）

以下不识别为新的建议，也不识别为新的计划。是否继续用结构化 UI、怎么传参，由产品多轮逻辑 / PRD 处理，不在本 TOOL 里判定：

- 确认或沿用：同意、收到、就按已有方案继续；
- 局部修改：改人数、改时间、替换已有计划中的某一项。

## 2.1 场景边界（验收清单）

开发验收时按本表，不另扩口径。

| 边界 | 口径 |
|---|---|
| **建议** | 具体处境里有还没定的选择，用户要结论。识别为建议。没有同时识别到计划时，不调用本工具 |
| **计划** | 即将发生的事，要可照做的条目，拿掉钟点后条目还在。识别为计划，调用本工具 |
| **两个都有** | 两次判定都为是。结论用普通文字，清单调用本工具 |
| **清单内容** | 要做的事、要备的东西都算清单。没有要买的东西，只要这张清单还在，仍调用 |
| **计划 vs 排期** | 拿掉钟点后还剩可勾选清单 → 计划，调用；主交付只是时间格 → 两者都不识别，不调用。同一句里两样都要 → 清单调用本工具，时间格用普通文字 |
| **时间跨度** | 半天 / 一天 / 跨天，只要清单还在，都调用 |
| **计划 vs 行程** | 有拿掉钟点还在的清单 → 调用；有序交通行程段 → 不调用，走 `present_route_compare`；两样都要 → 各走各的工具 |
| **建议 vs 攻略 / 菜谱** | 具体处境里的选择 → 建议；没有一件即将要办的事，只推荐景点、美食、玩法或写做法 → 两者都不识别 |
| **缺信息** | 事情清楚，只缺钟点、日期、人数或预算 → 按常理补全后照常识别。事情本身不清楚 → 模糊需求，先追问 |
| **HTML 目录** | 计划 HTML 的正文有章节 → 页面内加入目录，条目与章节标题一致，点击跳到对应章节。没有章节 → 不加目录 |

### English（平台 description 要求英文时用）

```text
Each turn, judge two things separately. Either, both, or neither may apply. Do not rely on the words "suggestion", "plan", "recommend", or "list". If the occasion is already clear and only the clock, date, headcount, or budget is missing, fill those in by common sense before judging.

SUGGESTION: a concrete situation (who, what occasion, or a stated goal) contains an undecided choice, and the user wants a conclusion and the reason. Deliver the conclusion. For a closed choice, the conclusion is the option itself. For an open question, add a short reason; when comparison helps, give 2–3 options. If this turn is not also a plan, do not add a checklist, steps, or a timetable, and do not call this tool.

PLAN: there is a concrete upcoming occasion or a stated goal about to be done; the user wants an arrangement they can follow; the arrangement has items (actions, things to prepare, or an order); the items still hold after the clock is removed. Then call this tool so the checklist uses Intelligent UI. Times may sit beside items. Half-day through multi-day all count. Items grouped by day are still a checklist. If the main deliverable becomes time slots for the day, the plan judgment is no. Put time slots in plain text. Transport goes to present_route_compare. When both judgments are yes, put the conclusion in plain text and still call this tool for the checklist. When the plan is delivered as HTML and the body has chapters, include a table of contents in the HTML: each entry matches a chapter title and jumps to that chapter. If the body has no chapters, do not add a table of contents. The Sunday roast demo is an example only, not a whitelist.

DO NOT CALL when only the suggestion judgment is yes, or when both judgments are no. Both are no for: vague requests (a bare wish, or a bare option with no occasion — ask first); facts, principles, or how-to explanations; schedules whose main deliverable is time slots; trips whose main deliverable is from/to and how to get there; guides or recipes with no concrete occasion the user is about to host; items the user already named, with no request to arrange the occasion; booking, ordering, paying, sending, or creating a group; translating, summarizing, or rewriting existing content; project schedules, OKRs, or weekly reports. Confirmations and local edits (change the headcount, change a time, swap one item) are out of scope for this trigger.
```

## 5. 正例 / 反例（评测用）

反例按类型覆盖，不是句子白名单。

### 只识别为建议（不调用，普通文字给结论）

| 用户说法 | 说明 |
|---|---|
| 周末在家请 6 个朋友，人均 80，火锅还是烤肉？ | 场合清楚，选择未定。不要追加采购清单 |
| 下周四面资深前端，要不要提前把题目发出去？ | 要的是结论 |
| 5 岁生日在家办还是去室内乐园？ | 二选一，结论就是选项本身 |
| 一周跑步三次，早晨跑还是晚上跑？ | 目标清楚，选择未定 |
| 12 人聚餐，有人吃素，餐厅选哪种？ | 开放建议，结论加短理由 |
| 入职第一周，先熟悉业务还是先搭开发环境？ | 具体处境里的做法选择 |

|---|---|

| 下周露营两天，列装备和出发前要做的事 | 要备的东西也是清单 |
| 周四要面 4 个人，列面试前要准备的东西，以及每个人要确认的问题 | 拿掉钟点，清单还在 |
| 周六搬家，列前一天和当天分别要做的事 | 按天分开写仍然是清单 |
| 20 人小型分享会，列场地、物料和当天要确认的事项 | 当天要确认的事项不是时间格 |
| 下周五带爸妈去体检，列出发前要准备的材料和当天要办的事 | 材料和要办的事拿掉钟点还在 |

## 6. 和 PRD / Demo 的分工

| 文档 | 负责 |
|---|---|
| **本文件** | 首轮如何分别识别建议与计划；识别到计划且清单拿掉钟点还在时才改 UI；计划 HTML 有章节时必须带目录；description + 系统提示 + 正反例 |
| **PRD** | 日程卡和计划文档长什么样、字段、目录以外的渲染、校验、兜底、多轮改某一项 |
| **Demo** | 周日烤羊肉这一个示例的交互与视觉；不是触发白名单 |

</script>
  <script>
    const source = document.getElementById("toolSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const ordered = /^\s*\d+\./.test(line);
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);
    document.getElementById("doc").innerHTML = html;
    document.getElementById("toc").innerHTML = toc.map(t => `<a class="l${t.level}" href="#${t.id}">${esc(t.text)}</a>`).join("");
    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    function downloadText(text, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    }
    function copyText(text, okMsg) {
      const done = () => notify(okMsg);
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用下载按钮"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
      else fallback();
    }
    document.getElementById("downloadTool").addEventListener("click", () => {
      downloadText(source, "计划清单-TOOL.md");
      notify("已开始下载 TOOL.md");
    });
    document.getElementById("copyTool").addEventListener("click", () => {
      copyText(source, "已复制 TOOL，可直接贴进 Agent");
    });
    document.getElementById("downloadDemo").addEventListener("click", async () => {
      const name = "生成计划清单场景.html";
      try {
        const res = await fetch(name);
        if (!res.ok) throw new Error(String(res.status));
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
        notify("已开始下载 Demo.html");
      } catch (e) {
        const link = document.createElement("a");
        link.href = name;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        notify("已尝试下载 Demo.html");
      }
    });
    const links = [...document.querySelectorAll("nav.toc a")];
    const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1)));
    window.addEventListener("scroll", () => {
      let on = 0;
      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
      links.forEach((a, k) => a.classList.toggle("on", k === on));
    }, { passive: true });
  
  </script>
