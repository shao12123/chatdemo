# 建议与计划识别 · 计划清单触发（Agent TOOL）

| 项目 | 内容 |
|---|---|
| 工具名 | `present_plan_list` |
| 用途 | 先分别识别本轮是不是**建议**、是不是**计划**。识别到建议或识别到计划，都调用本工具走 Intelligent UI。两次都否才不调用 |
| 版本 | v0.10 · 2026-11-24 |
| 配套 | [生成计划清单场景.html](生成计划清单场景.html)（交互 Demo）· 交叉优先级见与 `present_route_compare` 一节 |
| 口径 | **建议与计划分别判定，可同时成立** · 计划清单严触发 · **首轮判定**（不含确认、沿用、改某一项）· **与行程工具同轮可双开** |

> 本文是 **Agent TOOL 触发判定**（建议 / 计划何时走 Intelligent UI），不是前后端实现说明。把下面的 **description** 和 **系统提示增补** 贴进 Agent。本文件**不写** Schema、校验、兜底、多轮引用、接口。交互与 UI 见配套 Demo。是否生成目录按第 2.2 节。

---

## 1. 两次判定

每一轮做两次判定，互不影响。可以只识别到建议，只识别到计划，或两个都识别到。

不要靠「建议」「计划」「推荐」「清单」这些词。

事情已经清楚，只缺钟点、日期、人数或预算：按常理补全。缺这些信息不影响两次判定。

### 建议

用户要一个可以直接采用的结论，即识别为建议。不要求有一件即将要办的事，也不要求先说清谁和场合。结论是下面任一种：

1. 具体处境里还没定的选择：谁、什么场合，或一个已经说清的目标；
2. **推荐**：景点、美食、玩法。没有即将要办的事也算；
3. **知识或做法**：事实、原理，或怎么做才达到某个效果。不要求他先摆出一个选项。

识别到建议之后，调用 `present_plan_list`，并给出结论。二选一、三选一时，结论就是选项本身。问法开放时，结论后面加短理由；需要比较时给 2～3 个选项。推荐、知识、做法也只给结论和短理由。

本轮没有同时识别到计划时，不追加清单、步骤或时间表。

若本轮主答案将交付**带有序行程段的出行方案**（含比较几种出行方式，如高铁 vs 飞机）→ **建议判定为否**，走 `present_route_compare`；不要用本工具的建议结论抢行程对比卡。

### 计划

同时满足即识别为计划：

1. 有一件即将发生的具体的事，或一个已经说清、即将去做的目标；
2. 用户要的是可以照着做的安排；
3. 安排里有条目：要做的事、要备的东西，或先后顺序；
4. 拿掉钟点后，这些条目还在。

只要推荐、知识或做法，用户没有要一份可照做的安排，就不识别为计划。计划的四条不放宽。

识别到计划之后，清单是主体。时间可以写在条目旁边。没写具体钟点或日期，按常理假设后仍出这份安排。半天、一天、跨天都算。条目按天分开写，仍然是清单。

条目是要做的事或要备的东西时，调用 `present_plan_list`。时间格用普通文字。交通行程走 `present_route_compare`。是否在 HTML 里加目录，不在这里判，见第 2.2 节。

周日烤羊肉只是 Demo 示例，不是白名单。

### 两个都识别到

同一次调用里既给结论，也给清单。

## 2. 何时调用 / 何时不调用

### 要调用（走 Intelligent UI）

建议判定为是，或计划判定为是。两个都为是时调用一次。

- 只识别到建议：调用本工具给出结论。不追加清单、步骤或时间表。
- 识别到计划：调用本工具展示清单。清单拿掉钟点后条目还在。
- 两个都识别到：同一次调用里既给结论，也给清单。

说明：

- 缺具体钟点、日期、人数或预算：按常理假设后仍可调用。
- 同一轮还要把活动排进时间格：清单仍调用本工具；时间格用普通文字另答。
- 同一轮还夹了无关问题：计划部分仍调用本工具；无关部分用普通文字另答。
- 同一轮还要排交通行程（从哪到哪、怎么走）：交通部分走 `present_route_compare`；计划清单仍调用本工具。
- 判定顺序与行程工具的交叉规则见 §2.0。

### 不调用（普通文字）

两次判定都为否。见下一节。

### 两者都不识别

建议判定为否，计划判定也为否：

- **模糊需求**：只有笼统愿望，看不出要什么结论。只丢出一个选项，看不出这个选择发生在什么场合，同样算。本轮先追问，不交付结论，也不交付清单。
- **排期**：主交付是时间格。拿掉钟点，内容就不成立。
- **行程**：主交付是从哪到哪、怎么走（含会交付 legs 的出行方式对比）。有序交通行程段走 `present_route_compare`；不要当建议。缺起终点只追问时，不要改判成本工具。
- **已给出的条目**：用户已经点明要买什么、做什么，没有要求为这件事再做安排。
- **执行**：订位、下单、付款、发消息、建群，以及其他替他完成动作的请求。
- **加工已有内容**：翻译、总结、改写、换格式。对象是已经存在的计划或文本。
- **工作管理**：项目排期、OKR、周报，以及其他岗位或团队管理安排。

### 本 TOOL 不覆盖（不要写进触发规则）

以下不识别为新的建议，也不识别为新的计划。是否继续用结构化 UI、怎么传参，由产品多轮逻辑处理，不在本 TOOL 里判定：

- 确认或沿用：同意、收到、就按已有方案继续；
- 局部修改：改人数、改时间、替换已有计划中的某一项。

---

## 2.0 与 `present_route_compare` 的优先级

两工具**不互斥**；按主交付拆，不要按字数或「几个方案」拆。同一轮按下面顺序判定：

1. 主交付是否含**有序交通行程段**（起终点 + 时间或时长 + 交通方式）→ **有则行程部分走** `present_route_compare`。
2. 同轮另有**可勾选准备 / 待办条目**（拿掉钟点后条目还在）→ **再调本工具**（计划）；两工具可同轮都调。
3. **纯出行方式对比**（如高铁 vs 飞机），且本轮会交付带 legs 的方案 → **建议判定为否**，只走行程工具；不要用本工具出结论抢对比卡。
4. 拆不出 legs → 行程工具不调；再做本工具的建议 / 计划两次判定；仍否 → 普通文本。
5. 用户缺起终点、只能先追问的行程问法 → **不要改判成计划清单**；先按行程侧追问。

---

## 2.1 场景边界（验收清单）

开发验收时按本表，不另扩口径。

| 边界 | 口径 |
|---|---|
| **建议** | 用户要结论。具体处境里的选择、推荐景点美食玩法、知识或做法，都算。没有即将要办的事也算。没有同时识别到计划时，不追加清单。若主答案将是带 legs 的出行方案对比 → 建议为否，走行程工具 |
| **计划** | 即将发生的事，要可照做的条目，拿掉钟点后条目还在。识别为计划，调用本工具。只是推荐、知识或做法，没有这份安排 → 不算计划 |
| **两个都有** | 两次判定都为是。同一次调用里既给结论，也给清单 |
| **清单内容** | 要做的事、要备的东西都算清单。没有要买的东西，只要这张清单还在，仍调用 |
| **计划 vs 排期** | 拿掉钟点后还剩可勾选清单 → 计划，调用；主交付只是时间格 → 两者都不识别，不调用。同一句里两样都要 → 清单调用本工具，时间格用普通文字 |
| **时间跨度** | 半天 / 一天 / 跨天，只要清单还在，都调用 |
| **计划 vs 行程** | 见 §2.0；有拿掉钟点还在的清单 → 调用；有序交通行程段 → 不调用，走 `present_route_compare`；两样都要 → 各走各的工具 |
| **推荐 / 知识 / 做法** | 识别为建议，调用本工具，给结论，不追加清单。不因为没有即将要办的事就判否 |
| **缺信息** | 事情清楚，只缺钟点、日期、人数或预算 → 按常理补全后照常识别。事情本身不清楚 → 模糊需求，先追问。缺起终点的行程问 → 不改判为本工具 |
| **HTML 目录** | 与建议 / 计划分开判。第一层结构门槛和第二层页面价值都过 → 加目录，条目与章节标题一致并可跳转。任一不过 → 保持文本 |

---

## 2.2 是否生成目录

目录不判断「这是建议还是计划」。两层都过，才在 HTML 中加入目录。任一不过，保持文本，不加目录。

目录项与章节标题一致，点击跳到对应章节。

### 第一层：结构门槛

全部满足才过：

- 正文超过 500 个中文字符。阈值可在 500–1200 间调整，当前按 500。
- 至少 2 个二级标题，或 3 个以上编号章节。
- 不是提问、澄清、失败、取消。
- 不是以代码块为主。
- 不是已有文件交付的说明文字。

### 第二层：页面价值

只看结构特征。判断这段是不是一份自包含、分章节、适合浏览、分享、回看的说明，而不是一段对话式回答。

- 适合页面：多章节、步骤、清单、对比、时间安排、表格。
- 保持文本：代码为主、引用为主、短回答、情绪化回答、追问。

```text
Each turn, judge two things separately. Either, both, or neither may apply. Do not rely on the words "suggestion", "plan", "recommend", or "list". If the occasion is already clear and only the clock, date, headcount, or budget is missing, fill those in by common sense before judging.

SUGGESTION: the user wants a conclusion they can adopt. No upcoming occasion is required, and they need not name who or where first. The conclusion may be an undecided choice in a concrete situation, a recommendation (places, food, or things to do), or knowledge and method (a fact, a principle, or how to reach an effect). Call this tool and deliver the conclusion. For a closed choice, the conclusion is the option itself. For an open question, a recommendation, or knowledge and method, add a short reason; when comparison helps, give 2–3 options. If this turn is not also a plan, do not add a checklist, steps, or a timetable. If the main answer will be travel plans with ordered legs (including mode comparison such as train vs flight), the suggestion judgment is no—use present_route_compare; do not steal the conclusion with this tool.

PLAN: there is a concrete upcoming occasion or a stated goal about to be done; the user wants an arrangement they can follow; the arrangement has items (actions, things to prepare, or an order); the items still hold after the clock is removed. A recommendation, a fact, or a method with no such arrangement is not a plan. Then call this tool so the checklist uses Intelligent UI. Times may sit beside items. Half-day through multi-day all count. Items grouped by day are still a checklist. If the main deliverable becomes time slots for the day, the plan judgment is no. Put time slots in plain text. Transport goes to present_route_compare; when the same turn also needs a checklist, both tools may fire. When both judgments are yes, deliver the conclusion and the checklist in the same call. Decide the table of contents separately from suggestion versus plan. Add one only when both layers pass; otherwise keep plain text. Layer 1, all required: body longer than 500 Chinese characters (threshold adjustable between 500 and 1200; use 500); at least 2 second-level headings, or 3 or more numbered chapters; not a question, clarification, failure, or cancellation; not primarily code blocks; not a note explaining a file already delivered. Layer 2 looks only at structure, not at suggestion versus plan: the text is a self-contained, sectioned piece meant to be browsed, shared, or reread, with sections, steps, lists, comparisons, schedules, or tables. Keep plain text when it is mostly code, mostly quotation, a short reply, an emotional reply, or a follow-up question. When a table of contents is added, each entry matches a chapter title and jumps to that chapter. The Sunday roast demo is an example only, not a whitelist.

DO NOT CALL only when both judgments are no. Both are no for: vague requests (a bare wish, or a bare option with no occasion — ask first); schedules whose main deliverable is time slots; trips whose main deliverable is from/to and how to get there (including mode comparison that will deliver legs—defer to present_route_compare, not as a suggestion); items the user already named, with no request to arrange the occasion; booking, ordering, paying, sending, or creating a group; translating, summarizing, or rewriting existing content; project schedules, OKRs, or weekly reports; itinerary asks that only need origin/destination clarification (do not reclassify as this tool). Recommendations of places, food, or activities, and knowledge or how-to answers, are suggestions—do not put them here. Confirmations and local edits (change the headcount, change a time, swap one item) are out of scope for this trigger.

## 4. 系统提示增补（可贴进 system / developer）

```text
# 建议与计划（present_plan_list）

每一轮做两次判定，都要做，互不影响：
1. 是不是建议
2. 是不是计划

可以只命中一个，也可以两个都命中。不要因为命中了计划就否掉建议，也不要因为命中了建议就否掉计划。不要靠「建议」「计划」「推荐」「清单」这些词。

事情已经清楚，只缺钟点、日期、人数或预算：按常理补全，再做这两次判定。

## 建议
用户要一个可以直接采用的结论即是。不要求有一件即将要办的事，也不要求先说清谁和场合。结论是下面任一种：
- 具体处境里还没定的选择
- 推荐：景点、美食、玩法
- 知识或做法：事实、原理，或怎么做才达到某个效果

识别到建议后调用 present_plan_list，并给出结论。二选一、三选一时，结论就是选项本身。问法开放、推荐、知识或做法时加短理由，需要比较时给 2～3 个选项。本轮没有同时识别到计划时，不追加清单、步骤或时间表。

若本轮主答案将交付带有序行程段的出行方案（含高铁 vs 飞机等）→ 建议判定为否，走 present_route_compare；不要用本工具抢结论。

## 计划
同时满足即是：
- 有一件即将发生的具体的事，或一个已经说清、即将去做的目标
- 用户要可以照着做的安排
- 有条目：要做的事、要备的东西，或先后顺序
- 拿掉钟点后条目还在

只是推荐、知识或做法，没有这份安排，就不是计划。

清单是主体。时间可以写在条目旁边。半天到跨天都算。条目按天分开写仍然是清单。主交付变成当天的时间格时，计划判定为否。

识别到计划后调用 present_plan_list。时间格用普通文字。交通行程走 present_route_compare；同轮还有清单时两工具可双开。

## 与 present_route_compare 的优先级
同一轮先看主交付是否含有序交通行程段：
- 有 → 行程部分走 present_route_compare
- 另有可勾选准备/待办条目 → 再调本工具；可同轮双开
- 纯出行方式对比且会出 legs → 建议为否，只走行程工具；不要用本工具抢结论
- 拆不出 legs → 再做建议/计划两次判定；仍否 → 普通文本
- 缺起终点只能追问的行程问 → 不要改判成本工具

## 是否生成目录
与建议 / 计划分开判。两层都过才在 HTML 中加目录，任一不过就保持文本。目录项与章节标题一致，点击跳到对应章节。

第一层全部满足：
- 正文超过 500 个中文字符。阈值可在 500–1200 间调，当前按 500
- 至少 2 个二级标题，或 3 个以上编号章节
- 不是提问、澄清、失败、取消
- 不是以代码块为主
- 不是已有文件交付的说明文字

第二层只看结构，不看是建议还是计划。内容要自包含、分章节，适合浏览、分享、回看。多章节、步骤、清单、对比、时间安排、表格 → 适合页面。代码为主、引用为主、短回答、情绪化回答、追问 → 保持文本。

## 两个都识别到
同一次调用里既给结论，也给清单。

## 两者都不识别
建议为否，计划也为否，不调用：
- 模糊需求：只有笼统愿望，或只丢出一个选项但看不出场合。先追问
- 排期：主交付是时间格，拿掉钟点内容就不成立
- 行程：从哪到哪、怎么走（含出行方式对比且会出 legs → 让路给 present_route_compare，不要当建议）
- 缺起终点只能追问的行程问：不要改判成本工具
- 用户已经点明要买什么、做什么，没有要求再做安排
- 订位、下单、付款、发消息、建群
- 翻译、总结、改写已有内容
- 项目排期、OKR、周报

## 本文件不判定
确认、沿用、改人数、改时间、替换已有计划中的某一项：不识别为新的建议或计划。这些后续轮次还要不要继续用 Intelligent UI，不要根据本段决定。

不要把周日烤羊肉当成唯一可触发的 query。
```

  <script>
    const source = document.getElementById("toolSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const ordered = /^\s*\d+\./.test(line);
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);

    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    function downloadText(text, filename) {

      else fallback();

        link.click();
        link.remove();
        notify("已尝试下载 Demo.html");

    window.addEventListener("scroll", () => {

      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
