# 行程对比回复 UI 改版 PRD

| 项目 | 内容 |
|---|---|
| 文档状态 | 产品定稿 · 第 8 节问题已全部确认；触发口径见 Agent TOOL |
| 版本 | v0.6 · 2026-11-24（PRD 只保留产品功能 / 逻辑 / 交互 / UI；实现细节由开发据 Demo + 本文自行落地） |
| 交互 Demo | [三个路线方案.html](三个路线方案.html)（左侧历史有两个**示例** case：一日通勤、跨天旅行，用来演示数据差异，不是触发白名单；右上角「说明」可看逐项标注）。Demo 中的地图入口和逐块流式出现仅作演示，**本期不开发** |
| Agent TOOL | [三个路线方案-TOOL.md](三个路线方案-TOOL.md)（**仅触发判定**：何时走行程对比 Intelligent UI） |
| 适用读者 | 产品、设计、开发、测试 |
| 本文写什么 | **功能、产品逻辑、交互、UI**。不写接口、前后端分工、埋点、实现任务拆分 |

> 开发依据：**Demo + 本文 + TOOL**。首轮是否走行程对比 UI 由 `present_route_compare` 按 TOOL 触发；多轮换方案 / 改某一程的用户可见规则见第 4、6 节。**流式本期不做**，整条回复一次出现。第 8 节已确认的按结论；写「沿用线上」的不改现有产品逻辑。

---

## 1. 背景与目标

### 1.1 现状
用户在 MoreAI 对话里提「帮我排出发时间和路线，给我制定三个方案」，线上回复是一整段多级 Markdown 列表：
- 三个方案上下排列，要比较只能来回翻；
- 关键信息（几点出发、几点到）和细节（步行 3 分钟到 2 号口）在同一层级；
- 推荐结论只写在标题括号里，后面没有下一步；
- **线上 bug**：「约 35~40 分钟……预计 09:15~09:20 抵达」中两个 `~` 被 Markdown 解析成删除线，中间文字被划掉。

### 1.2 目标
- **内容和推荐逻辑不变**：方案、推荐、每一程的线路沿用线上模型的输出。本次只改呈现。
- 在 Chat 里完成比较，不需要打开右侧展示区。
- 一套组件支撑「行程规划」场景；Demo 用一日通勤 / 跨天旅行两个示例覆盖 `same_day` 与 `multi_day` 两套数据形态。
- 修复波浪号变删除线的问题。

### 1.3 成功标准
- 用户不滚动超过一屏，就能知道推荐哪个方案、三个方案差在哪。
- 表格可以一键复制到飞书文档 / Excel 并保持表格结构。
- 结构化渲染失败时，用户仍能看到完整的文字回复（不出现空白或报错）。

---

## 2. 范围

### 2.1 本期做
1. 行程对比场景的结构化输出与渲染（第一轮 + 后续轮次）。
2. 组件：思考过程、结论句、行程对比大卡、方案明细（文字 + 表格）、出行提示。
3. 深浅模式：所有组件颜色走 token，浅色 / 深色两套（见 5.6）。
4. **全站通用提示块**：「出行提示」这种提示块是全站一致的设计，任何场景的 Chat 回复里只要出现提示 / 说明类内容，都用同一个组件展示（见 5.7）。
5. 表格复制（富文本表格 + 纯文本双格式）。
6. 多轮：换方案、调整某一程（只能由用户输入触发）。
7. 一次渲染：工具参数到齐、校验通过后整条回复一次出现。**流式本期不做**（Demo 中的逐块出现仅作演示）。
8. 兜底：结构化失败时回退 Markdown；Markdown 渲染修复 `~`。
9. 混合需求：用户同一轮还问了与行程无关的事，卡片下方接一段普通文字回答。

### 2.2 本期不做
- 选择卡（让用户先选方案）。
- 推荐操作（回复底部的快捷按钮，如「改用方案二」）：不做。后续轮次只能由用户输入触发。
- 「加入日程」及任何写入用户日历的能力。
- **地图功能**：对话里的地图入口、右侧路线图都不做。Demo 保留演示和说明，供后续迭代参考；后续接入需要地图 SDK：国内用高德，国外用 Google Maps（见 8.5）。
- 路线 / 票务服务校验：班次、时长、票价一期只用大模型生成，与线上一致；二期再接路线服务。
- 实时导航、实时路况、实时票价。
- 订票、叫车等外部下单。
- 流式渲染：结论逐字、对比卡和表格逐块出现，本期不做，后续迭代再接（Demo 保留演示）。
- 展示模型的全局假设（如「按明天出发规划」）：只存档，不展示。

---

## 3. 场景

**要识别的场景是「行程规划」**：用户要一份可执行的出行 / 行程方案（从哪到哪、几点走、怎么走；可含推荐或多方案对比）。通勤、城际、出国、机场接驳、多站拜访等都属于本场景。

Demo / 验收里的两个 case **只是示例**，用来覆盖 `same_day` 与 `multi_day` 两套数据字段，**不是触发白名单**——只要属于行程规划且能交付有序 legs，就走本需求（调用 `present_route_compare`）。

| 数据形态（非白名单） | 示例 query（Demo） | 关键特征 |
|---|---|---|
| `same_day`（一日通勤形态） | 我住徐汇滨江，9 点半在陆家嘴见客户，12 点在静安寺见另一个，3 点回人民广场附近的公司。帮我排出发时间和路线。给我制定三个方案 | 同一天；常有截止时间；市内交通 |
| `multi_day`（跨天旅行形态） | 我在马德里，想去巴塞罗那和马略卡玩，巴塞呆 3 天，马略卡呆 4 天再回马德里，明天出发，帮我排出发时间和路线。给我制定三个方案 | 跨多天；常有住几晚；城际交通（高铁、飞机、渡轮） |

两种数据形态**共用同一组件和同一顺序**，差异只由数据决定（见 5.3）。触发规则见 TOOL 文档（触发判定）与 7.1。

---

## 4. 交互流程

### 4.1 第一轮
1. 用户发送 query。
2. **思考过程**：MoreAI 头像 + 名称；阶段文字流光 + 秒数；展开后是「已执行 N 个步骤」。默认展开，回复开始出现时自动收起成「已完成 N 秒」，头像跳一下。最后一步固定写「按推荐定下方案X。需要换方案时，写完后再说。」
3. **回复**，整条一次出现（流式本期不做），自上而下固定顺序：
   1. 结论句；
   2. 行程对比大卡；
   3. 三个方案的文字 + 表格（推荐方案排第一，全部展开）；
   4. 出行提示；
   5. 补充文字（仅当用户同轮还问了与行程无关的事，见 7.2）；
4. **操作栏**：复制、重新生成、赞、踩、分享 + 时间（悬停显示）。回复底部没有快捷按钮。

### 4.2 第二轮起（换方案 / 调整某一程）
- 触发：只能由用户在输入框输入，如「改用方案二」「用专车那个」「第二程改打车」「第二程改坐渡轮」。没有快捷按钮。
- 回复：思考过程（2 步）→ 结论句 → 所选方案的文字 + 表格 →（补充文字）→ 操作栏。
- 数据：模型只传方案序号（和被改的那一程），后端从上一轮载荷合并出完整数据（见 7.4）。
- **不重复**：行程对比大卡、出行提示。

### 4.3 其他交互
| 交互 | 规则 |
|---|---|
| 复制表格 | 表格右上角图标，悬停提示「复制表格」；写入 `text/html` + `text/plain`（TSV）；成功提示「已复制表格」 |
| 地图 | **本期不做**。Demo 中的地图入口和右侧路线图仅作演示 |
| 提问目录 | ≥2 条用户消息、右侧展示区关闭时显示（复用现有组件） |
| 赞 / 踩 | 互斥，再点取消；点踩不弹原因、不弹提示 |
| 编辑用户消息 | 原位编辑，发送后在末尾新增一条消息并重新生成；生成中不可编辑 |
| 重新生成 | 与论文对比一致：生成新版本，结论旁出现「‹ 2 / 2 ›」切换；切换时整条回复（结论、对比卡、表格、提示）一起切换。Demo 为原位重跑，以本文为准 |

---

## 5. 组件与样式规范

### 5.1 组件清单
| 组件 | 出现条件 | 形态 | 依赖字段 |
|---|---|---|---|
| 思考过程 | 每轮 | 复用现有组件 | `thinking_steps[]` |
| 结论句 | 每轮 | 正文 | `conclusion` |
| 行程对比大卡 | 仅第一轮，且方案数 ≥2 | 卡片（一层）+ 方案块（二层） | `trip`、`plans[]` |
| 方案明细 | 每轮（第一轮全部方案，之后仅所选方案） | 正文 + 表格，不包卡片 | `plans[].legs[]` |
| 出行提示 | 仅第一轮，`tips` 非空 | 卡片，**使用全站通用提示块**（5.7） | `tips[]` |
| 地图入口 | **本期不做** | — | — |
| 补充文字 | 用户同轮还问了与行程无关的事 | 普通 Markdown，接在卡片和表格之后 | `trailing_markdown` |

### 5.2 信息分级（对比卡与方案明细共用）
| 层级 | 内容 | 例子 | 样式 |
|---|---|---|---|
| 结论句 | 推荐结论 + 依据 | 推荐**方案一**：08:25 出门，全程地铁…… | 15/24 常规 #1c2330，方案名加粗 |
| 组件小标签 | 对比卡顶部 | 今日行程 / 行程骨架 | 12/18 #667085 |
| 一级标题 | 方案序号 + 出行方式 | 方案一 · 全地铁 | 15px 700 #1c2330（对比卡行高 22，明细行高 24） |
| 一级标签 | 推荐 | 推荐 | 结构参考典型场景 Status Tag（胶囊、水平垫 6、圆角 99、12/20 Regular；中文 PingFang SC、英文 Inter）；**无前置圆点**；颜色仍用成功色 token（`--rt-pick-bg` / `--rt-pick-fg`），与标题同行 |
| 副标题 | 定位 · 理由 | 高效准点 · 时间最可控，早高峰不堵车 | 13/20 500 #344054 |
| 三级说明 | 风险或适用场景 | 早高峰过江及延东隧道车流量大…… | 对比卡 12/18 #667085；明细里的适用说明 / 小结 14/22 #344054 |
| 行程时间 | 出发时间 | 08:25 / 11/14 09:00 | 13/20 700 #1c2330，等宽数字 |
| 行程路段 | 起点 → 终点 | 徐汇滨江 → 陆家嘴 | 13/20 常规 #1c2330 |
| 行程辅助 | 方式 · 到达 | 地铁 · 09:15–09:20 到 | 12/18 #667085 |
| 表格 | 表头 / 单元格 / 次要信息 | — | 表头 12px #667085；单元格 13/20；次要信息 12/18 #667085，每条一行 |

**禁止**：同一级用两种样式；用颜色区分层级。

### 5.3 场景差异（只由数据决定）
| 判断条件 | 骨架 | 时间线节点 | 表格列 | 地图线型 |
|---|---|---|---|---|
| 每站有 `deadline`（一日通勤） | 「今日行程」+ 截止时间 | `HH:MM` | 行程、出发、方式与线路、预计到达、缓冲 | 本期不做（Demo：地铁实线蓝；打车 / 专车虚线橙） |
| 每站有 `nights`（跨天旅行） | 「行程骨架」+ X 晚 | `M/D HH:MM` | 日期、行程、方式与班次、出发 – 到达、时长、参考价 | 本期不做（Demo：高铁实线蓝；飞机点线灰；渡轮虚线绿） |

- 缓冲 = 截止时间 − 预计到达的上限（见 6.3）。
- 跨夜到达显示「次日 07:00」。

### 5.4 样式 token
| 类别 | 值 |
|---|---|
| 层级 | 最多两层：卡片 → 块；块内不再套块 |
| 间距 | 回复内组件间距 12px；对比卡内边距 14px 16px，块间距 8px；方案块内边距 12px 16px；出行提示内边距 12px 16px 14px |
| 宽度 | 对比卡、方案明细、出行提示与对话列 / 输入框同宽（Demo：吃满 `.messages-inner`，与 `.composer` 的 `min(736px, …)` 持平）；窄屏 100%，表格横向滚动（最小宽 520px）；地图入口卡仍 ≤360px（本期不做） |
| 圆角 | 卡片 16；块 14；表格 12 |
| 颜色 | 全部引用 5.6 的 token，不写死色值；取值来自《华为项目-规范》色彩规则，下面三行写的是浅色取值 |
| 底色 / 描边 | 卡片 #EEF0F3（次要容器）；方案块 #FFFFFF（容器）；表格白底 + 1px #D8D9DD 边框、#E3E4E7 行分割，表头 #EEF0F3 |
| 方案色（只用于对比卡时间线圆点与竖线） | 方案一 Brand1 #0A59F7、方案二 Purple1 #8C3BFE、方案三 Cyan1 #00A7AD；推荐方案竖线实色，其他 35% 透明度 |
| 其他颜色 | 「推荐」标签 Green10 #E9F5E7 底 / Green1 #64BB5C 字；出行提示灯泡 Orange1 #ED6F21；品牌色 #0A59F7 仅用于链接、按钮、悬停 |

### 5.5 文案规则
- 方案命名：一级标题「方案X · 出行方式」；副标题「定位 · 理由」；调整后在出行方式后加括号，如「全地铁（第二程改打车）」。
- 结论句模板：
  - 推荐：「推荐方案X：<首程出发时间> 出门 / 出发，<方式>，<依据>。」
  - 换方案：「已改用方案X · 出行方式（定位）：<出发时间> 出发，<依据>。」
  - 调整：「已把第二程改成……，其余两程不变。」
- 时间：一日内 `08:25`；跨天 `11/14 09:00`；跨夜 `次日 07:00`；约数 `约 11:45`。
- **范围一律用「–」**（U+2013），如 `09:15–09:20`、`45–55 分钟`、`€30–90 / 人`。禁止输出 `~`。
- 时长：「约 X 分钟」「约 X 小时 Y 分钟」。
- 每个方案一句小结，写整体特点或主要风险。
- 出行提示：「小标题：正文」，2–3 条。

### 5.6 颜色 token（浅色 / 深色）
颜色来自 Figma《【25】华为项目-规范》的「色彩规则」与色板（[链接](https://www.figma.com/design/yqXDOTr2jDco9DVso8EVXs/?node-id=0-1)）。组件只引用下面的 `--rt-*` token，跟随产品主题切换；「规范 token」一列是它对应的规范变量，产品已有规范变量时直接引用规范变量即可。Demo 右上角「浅色 / 深色」可切换查看。

| 名称 | Token | 规范 token | 浅色 | 深色 | 用在哪里 |
|---|---|---|---|---|---|
| 文字一级 | `--rt-text-1` | @text-color-primary | #000000 | #FFFFFF | 结论句、方案标题、时间、路段、表格正文 |
| 文字二级 | `--rt-text-2` | @text-color-secondary | #000000 60% | #FFFFFF 60% | 副标题、适用说明、小结、提示正文 |
| 文字三级 | `--rt-text-3` | @text-color-secondary | #000000 60% | #FFFFFF 60% | 组件小标签、表头、次要信息、复制图标 |
| 文字四级 | `--rt-text-4` | @text-color-placeholder | #000000 40% | #FFFFFF 40% | 圆点、弱提示 |
| 卡片底 | `--rt-card` | @bg-color-secondarycontainer | Gray1 #EEF0F3 | Gray12 #191A1D | 对比卡、出行提示 |
| 块底 | `--rt-block` | @bg-color-container | White #FFFFFF | Gray13 #111216 | 对比卡里的方案块 |
| 表格底 | `--rt-table` | @bg-color-container | White #FFFFFF | Gray13 #111216 | 表格 |
| 表头底 | `--rt-table-head` | @bg-color-secondarycontainer | Gray1 #EEF0F3 | Gray12 #191A1D | 表头 |
| 时间线圆点填充 | `--rt-dot` | @bg-color-container | White #FFFFFF | Gray13 #111216 | 对比卡时间线圆点 |
| 描边 | `--rt-line` | @component-border | Gray4 #D8D9DD | Gray10 #434448 | 表格边框 |
| 弱分割线 | `--rt-line-soft` | @component-stroke | Gray3 #E3E4E7 | Gray11 #292B2E | 表格行分割 |
| 分割线 | `--rt-divider` | @component-stroke | Gray3 #E3E4E7 | Gray11 #292B2E | 方案之间、明细分割 |
| 悬停描边 | `--rt-hover-line` | @brand-color-hover | Brand3 #3B7AF9 | Brand3 #2762C6 | 预留（Demo 用于地图入口卡悬停，本期不做） |
| 推荐标签底 | `--rt-pick-bg` | 色板 Green10 / Green9 | #E9F5E7 | #122211 | 「推荐」标签 |
| 推荐标签字 | `--rt-pick-fg` | @success-color | Green1 #64BB5C | Green1 #5BA854 | 「推荐」标签 |
| 提示图标 | `--rt-tip-icon` | @warning-color | Orange1 #ED6F21 | Orange1 #DB6B42 | 出行提示灯泡 |
| 品牌色 | `--rt-brand` | @brand-color | Brand1 #0A59F7 | Brand1 #317AF7 | 链接、悬停态 |
| 方案一 | `--rt-plan-1` | 色板 Brand1 | #0A59F7 | #317AF7 | 对比卡时间线 |
| 方案二 | `--rt-plan-2` | 色板 Purple1 | #8C3BFE | #7F45E2 | 对比卡时间线 |
| 方案三 | `--rt-plan-3` | 色板 Cyan1 | #00A7AD | #00AFAF | 对比卡时间线 |

**外壳（页面级，沿用规范，不属于本需求开发范围）**：页面底 @bg-color-page（Gray1 #EEF0F3 / Gray14 #090B0E）；聊天区 @bg-color-container（#FFFFFF / Gray13 #111216）；悬停 @bg-color-container-hover（Gray1 / Gray11 #292B2E）。

**规则**
1. 组件里不写十六进制色值，只引用 token；不单独做主题开关，跟随产品主题。
2. 文字只用规范的四级：主要 100%、次要 60%、占位 40%、禁用 20%。行程对比的第三级文字（表头、标签、补充说明）也用次要 60%，与第二级靠字号、字重区分；40% 只用于圆点这类弱元素，禁用 20% 本需求不用。
3. 两层结构用「次要容器 + 容器」：对比卡、出行提示用次要容器底，卡片里的方案块用容器底。浅色下块比卡亮，深色下块比卡暗，两种模式都靠明度差分层。
4. 方案标识色用没有功能语义的 Brand / Purple / Cyan，避免和警示（橙）、成功（绿）混淆；「推荐」标签用成功色。
5. 规范内部有冲突时，以色阶名为准：深色次要容器取 Gray12 #191A1D（规则表误写为 #292B2E）；深色警示色取规则表的 #DB6B42（色板 Orange1 误标为 #D94838）；主文字按规则表取 100%（Figma 变量名写的 90% 不采用）。
6. 文字一级、二级在对应底色上的对比度不低于 4.5:1，三级不低于 3:1；「推荐」标签按规范成功色取值，是唯一例外。

### 5.7 全站通用提示块（Tip Block）
**定位**：全站一致的设计。不只用于行程对比；任何场景的 Chat 回复里，只要出现「提示 / 说明 / 注意事项 / 小贴士」这类内容，都用这个组件展示，不再用普通 Markdown 列表或 emoji 标题。

**什么内容算提示**
- 用：对用户有帮助、但不是主结论的补充说明，如「陆家嘴站步行时间」「高铁提前到站」「建议提前预约专车」「文件过大时可先压缩」。
- 不用：
  - 错误、失败、权限不足 → 用全站「错误卡片」：浅灰底（次要容器）、无描边、圆角 14、圆形叉号图标、重试按钮在卡内右下，详见《生成异常与恢复》Demo；
  - 某个方案自身的风险 → 写在该方案的小结里（如方案二早高峰拥堵）；
  - 主结论、步骤说明 → 用正文。

**结构**
1. 标题行：灯泡图标 + 标题。标题按场景取，默认「提示」；行程场景用「出行提示」；也可用「注意事项」「小贴士」。
2. 条目列表：每条「小标题：正文」；没有小标题时只写正文。
3. 一条回复里最多一个提示块，放在主内容之后、操作栏之前。

**样式**（全站共用，颜色取自 5.6 token）
| 项目 | 规格 |
|---|---|
| 容器 | 圆角 14px；内边距 12px 16px 14px；底 `--rt-card`；无描边、无阴影；宽度与对话列 / 输入框同宽 |
| 图标 | 16px 灯泡线性图标，颜色 `--rt-tip-icon`，与标题间距 6px；这是提示块里唯一的颜色 |
| 标题 | 14/22，700，`--rt-text-1` |
| 条目 | 13/21，`--rt-text-2`；条目间距 6px；左侧 4px 圆点 `--rt-text-4`，正文缩进 12px |
| 条目小标题 | 600，`--rt-text-1`，后接全角冒号「：」 |
| 数量 | 建议 2–3 条，最多 5 条；超过 5 条只保留前 5 条 |
| 深色模式 | 自动跟随 token，无需单独设计 |

**规则**
- 不在提示块里放按钮、链接卡片、表格或嵌套列表；需要链接时用正文内文字链接。
- 不用 emoji（如 💡）做标题，统一用组件里的灯泡图标。
- 不改色区分「重要 / 一般」提示；需要强调时把关键词加粗。

**出现条件**
- 结构化行程回复：有出行提示内容时出提示块（标题默认「出行提示」）。
- 其他场景的 Markdown 回复：若标题以「💡」开头，或标题为「提示 / 小提示 / 小贴士 / 注意事项 / 温馨提示 / 出行提示」，且下接列表（「**小标题**：正文」），也应呈现为同一提示块；识别失败则保持原 Markdown。

## 6. 产品规则与边界

### 6.1 信息结构（用户可见）
首轮行程对比回复按第 4、5 节组件顺序出现。结构化内容需要能支撑：

| 信息 | 说明 |
|---|---|
| 轮次类型 | 首轮 / 换方案 / 改某一程；决定出哪些组件（见 5.1） |
| 形态 | 一日通勤（有截止 → 缓冲列）或跨天旅行（有住几晚 → 日期 / 参考价列） |
| 结论 | 推荐谁、依据是什么；方案名可加粗 |
| 站点 | 起点 / 途经 / 终点；可选截止、目的、住几晚 |
| 方案 | 1–4 个；**恰好一个**标「推荐」；含出行方式、定位、理由、适用、风险、小结、行程段 |
| 行程段 | 起终点、日期、出发、到达（可约数、可跨夜）、方式、线路、门到门时长、票价、说明 |
| 出行提示 | 有则出；无则整块不出 |
| 补充文字 | 同轮非行程问题（如推荐酒店）接在主内容后；正文里不再复述方案与出发时间 |
| 假设 | 可内部记录（如按工作日早高峰），**页面不展示** |

缺时间、日期等非起终点信息：按常理假设后直接出方案。缺起点或终点：先追问。

### 6.2 多轮（用户可见结果）
- 回复底部**没有**快捷按钮；换方案 / 改某一程只能用户输入（如「改用方案二」「第二程改打车」）。
- **换方案**：只出结论 + 所选方案表格；**不重复**对比大卡、出行提示；其余方案不重出。
- **改某一程**：只改被点名的那一程，其余程与上一轮一致；结论说明改了什么。
- 对不上现有方案（如「用飞机那个」但没有飞机）：用文字说明现有方案，不硬切结构化。
- 新的行程需求重新走首轮；无关问题走通用回复。
- **重新生成**：多版本「‹ N / N ›」切换；切换时整条回复一起换。
- 刷新 / 回看：上线后的新回复按结构化原样呈现；改版前的老 Markdown 行程回复保持原样，不转换。

### 6.3 展示格式
| 内容 | 呈现 |
|---|---|
| 方案序号 | 方案一、方案二… |
| 时间范围 | `09:15–09:20`（一律「–」，禁止 `~`） |
| 约数 | `约 11:45` |
| 跨夜 | `次日 07:00` |
| 跨天时间 | `11/14 09:00`（不做时区换算） |
| 门到门 | `约 50–55 分钟` |
| 价格 | `€30–90 / 人`（当地币种原样） |
| 缓冲（仅一日通勤且该站有截止） | `deadline − 到达上限`；范围显示「10–15 分钟」；≤0 显示「可能迟到」 |

### 6.4 表格复制
- 一键复制后，贴到飞书文档 / Excel 仍是表；贴到纯文本为按列分开的文字。
- 复制内容与表格展示一致。

### 6.5 边界与异常（用户看到什么）

| 情况 | 处理 |
|---|---|
| 结构化呈现失败 | 回退同内容的 Markdown；页面不空白、不报技术错 |
| 只有 1 个方案 | 不出对比卡，直接出方案明细 |
| 超过 4 个方案 | 只展示前 4 个 |
| 推荐缺失或多个 | 只保留一个「推荐」标记（取第一个） |
| 到达晚于截止 | 缓冲显示「可能迟到」 |
| 某一程方式混合 | 表格照写 |
| 文本出现 `~` | 显示为「–」；Markdown 单个 `~` 不变删除线 |
| 同轮「排行程 + 顺便推荐酒店」 | 行程走对比 UI；酒店等用卡片下方普通文字 |
| 同轮「排路线 + 列要带的东西」 | 二选一，不能两个都填。判断哪个合适；判断不出只走行程工具（见 TOOL §2.2） |
| 生成中切换会话 | 回来后仍能看到结果（沿用线上） |

### 6.6 无障碍与适配（产品要求）
- 方案标题用标题层级；表格用语义表格；复制按钮有可读名称。
- 开启「减少动态效果」时关闭头像动效、流光、目录动画。
- 深浅色跟随产品主题；窄屏卡片满宽，表格可横向滚动。

## 7. 验收标准

### 7.1 功能
- [ ] 两个**示例** query（一日通勤、跨天旅行）按第 4 节顺序渲染，组件齐全；触发按「行程规划」场景，不把 Demo 当白名单。
- [ ] 第二轮「改用方案二」「第二程改打车 / 改坐渡轮」只出结论 + 所选方案表格。
- [ ] 回复底部没有快捷按钮；输入上述话术能进入后续轮次。
- [ ] 无规划意图的单段路询仍为普通 Markdown；规划类走行程对比 UI，正文不复述行程细节。
- [ ] 「排行程 + 顺便推荐酒店」：卡片下方有酒店文字，文字里没有方案和出发时间。
- [ ] 改某一程后，其余程与上一轮一致。
- [ ] 缺时间的规划 query 直接出方案，不追问；页面不展示假设。
- [ ] 表格复制到飞书 / Excel 保持表结构。
- [ ] 整条回复一次出现（流式本期不做）。
- [ ] 重新生成出现「‹ 2 / 2 ›」，切换时整条一起换。
- [ ] 对话里没有地图入口（本期不做）。
- [ ] 刷新后历史按结构化原样；改版前老对话保持 Markdown。
- [ ] 结构化失败时显示 Markdown，且无删除线 bug。

### 7.2 视觉
- [ ] 一级标题「方案X · 出行方式」序号与方式同字号同字重。
- [ ] 「推荐」标签只出现在推荐方案上。
- [ ] 方案色只出现在对比卡时间线上。
- [ ] 所有范围为「–」，页面上没有「~」。
- [ ] 与 Demo 并排对比，字号、间距、圆角、颜色一致。
- [ ] 浅色 / 深色均取自 5.6 token，对比度达标。
- [ ] 出行提示用全站提示块；其他场景 Markdown 出现「💡 提示」等写法时同样成提示块。

## 1. 要识别的场景

**场景名：行程规划。**

用户要的是一份**可执行的出行 / 行程方案**：从哪到哪、几点走、怎么走；可以带推荐，也可以要多个方案对比。

| | 说明 |
|---|---|
| 属于本场景 | 通勤排程、城际 / 出国行程、机场接驳、多站拜访、一日游 / 多日游骨架……只要核心交付物是「可执行的行程方案」 |
| Demo 两个 case | 一日通勤（徐汇滨江三场会）、跨天旅行（马德里 → 巴塞 → 马略卡）**只是示例**，用来演示 UI 和数据差异，**不是触发白名单** |
| 判定方法 | 看「即将交付的产物是不是行程方案」，不要抠关键词，也不要抠「是不是上海」「是不是西班牙」 |

## 2. 何时调用 / 何时不调用

### 要调用（走 Intelligent UI）

同时满足：

1. 用户意图是**行程规划**（排出发时间、排路线、制定行程 / 方案、比较几种出行方式等）；
2. 本轮主答案将交付 **≥1 个**可执行方案，且每个方案能拆出有序行程段（起点 / 终点 + 时间或时长 + 交通方式）。

说明：

- 用户要 1 个方案也调用（前端可以不出对比卡，仍用结构化方案 UI）。
- **用户未指定方案个数时，默认出 3 个**（上限 4；超过 4 只保留前 4，见 PRD）。
- 缺时间、日期等非起终点信息：按常理假设后仍可调用（假设不展示给用户的细节见 PRD）。
- 同一轮还夹了无关问题（如「顺便推荐酒店」）：**行程部分仍调用本工具**；无关部分用普通文字另答（怎么拼消息见 PRD）。
- 同一轮既有交通行程，又有准备清单（带什么、几点入园、出发前要做的事）：模型二选一，不能两个都填。判断主交付更适合哪个：行程只调本工具，准备清单只调 `present_plan_list`。判断不出来，只调本工具。

### 不调用（普通 Markdown / 文本）

任一成立即不调用：

- 没有规划意图的单段 A→B 指路（「怎么走最快」只要一句建议）；
- **主交付是玩 / 住 / 吃攻略或景点清单**，没有要排可执行交通时段 / 行程段；
- 交通知识问答（末班车、哪家航司等）；
- 起点或终点缺失，只能先追问；
- 订票、叫车、下单；
- 翻译 / 总结 / 改写**已有**行程文本；
- 与行程无关的任务。

### 本 TOOL 不覆盖（不要写进触发规则）

以下**不作为本文件的触发条件**（是否继续用结构化 UI、怎么传参，由产品多轮逻辑 / PRD 处理，不在本 TOOL 里判定）：

- 「改用方案二」「用专车那个」；
- 「第二程改打车」「下午不坐高铁」等调整某一程。

## 2.1 场景边界（验收清单）

开发验收「进 / 不进」时，按本表，不另扩口径。

| 边界 | 口径 |
|---|---|
| **时间跨度** | 半日 / 一日 / 多日都进；**不因天数拒绝调用**（无天数上限） |
| **地理范围** | 同城 / 城际 / 跨省 / 跨国都进 |
| **内容：攻略 vs 行程** | 看**主交付物**：能拆成有序行程段（起终点 + 时间或时长 + 交通）→ **进**；主交付是景点 / 美食 / 酒店清单、不要求排交通时段 → **不进**；「排行程 + 顺便推荐酒店」→ 行程进工具，酒店用文字 |
| **与计划清单** | 见 §2.2。交通和准备清单同时出现 → 二选一，不能两个都填；判断不出只调本工具。只有交通行程，或纯出行方式对比且会出 legs → **只调本工具**，不要用计划「建议」抢结论 |
| **方案数** | 用户说了按说的（1–4，>4 截前 4）；**未指定默认 3**；只要 1 个仍调用，前端可不出对比卡 |
| **字段范围（控复杂度）** | 触发不砍天数；卡内仍只承载**交通行程骨架**（有序 legs + 可选 nights）。每日玩住吃细项**不进卡字段**；用户要了用普通文字 |
| **排除** | 单段 A→B 指路、知识问答、订票下单、缺起终点只追问、改写已有行程等（见 §2 不调用） |

---

## 2.2 与 `present_plan_list` 的优先级

交通行程和准备清单同时出现时，模型二选一，不能两个都填。判断主交付更适合哪个；判断不出来只调本工具。同一轮按下面顺序判定：

1. 同一句里同时有有序交通行程段和准备清单（带什么、几点入园、出发前要做的事）→ 判断主交付：行程只调本工具，准备清单只调 `present_plan_list`。判断不出来，只调本工具。例如「周六去上海迪士尼，怎么坐车、带什么、几点入园」。
2. 只有有序交通行程段、没有准备清单 → 调用本工具。
3. **纯出行方式对比**（如高铁 vs 飞机），且本轮会交付带 legs 的方案 → **只调本工具**；不要用 `present_plan_list` 的「建议」出结论抢对比卡。
4. 主交付是玩 / 住 / 吃、**拆不出** legs → **本工具不调**；再交给计划工具判建议 / 计划；仍否 → 普通文本。
5. **缺起点或终点**只能先追问 → **本工具不调**；不要改判成计划清单。

### 中文

```text
何时调用：当用户意图是「行程规划」，且你要把可执行的行程 / 通勤 / 旅行方案作为本轮主答案交付时调用——至少一个方案，且每个方案有有序行程段（起点/终点 + 时间或时长 + 交通方式）。半日/一日/多日、同城到跨国都适用，不因天数拒绝。Demo 里的一日通勤、跨天旅行只是示例，不是白名单。用户未指定方案个数时默认出 3 个（1–4；只要 1 个也调用）。同一句里既有交通行程又有准备清单时，二选一，不能两个都填：判断主交付更适合行程就只调本工具，更适合准备清单就只调 present_plan_list；判断不出来只调本工具。纯出行方式对比且会交付带 legs 的方案时只调本工具，不要用 present_plan_list 的「建议」抢结论。

本工具只负责声明「本轮行程用 Intelligent UI 展示」。卡内只承载交通行程骨架；玩住吃细项用普通文字。不要用本工具的描述去处理「改用方案二」「第二程改打车」等后续轮次是否调用——那些不在本触发规则范围内。
```

### English（平台 description 要求英文时用）

```text
WHEN TO CALL: Call when the user intent is itinerary/travel planning (行程规划) and you are ready to deliver an executable travel/commute/itinerary plan as the main answer—at least one plan with ordered legs (from/to + time or duration + transport mode). Half-day, same-day, and multi-day all count; city to international all count; do not refuse by trip length. Demo cases are examples only, not a whitelist. If the user does not specify how many plans, default to 3 (range 1–4; still call for a single plan). If the same sentence has both a transport itinerary and a preparation checklist (what to bring, when to enter, what to do before leaving), pick one tool and do not call both. Call this tool when the main deliverable is the itinerary, or present_plan_list when it is the checklist. If you cannot tell, call only this tool. For pure mode comparison (e.g. train vs flight) that will deliver legged plans, call only this tool; do not let present_plan_list’s “suggestion” steal the conclusion.

DO NOT CALL for: one-shot A→B directions without planning intent; destination guides focused on sights/food/hotels without scheduling transport legs; transport knowledge Q&A; clarification-only turns when origin or destination is missing (do not reclassify as a plan checklist); booking/ticketing; rewriting/translating an existing itinerary; or unrelated tasks.

This tool only declares that this turn’s itinerary should use Intelligent UI. Card fields stay at the transport-skeleton level; day-by-day play/stay/eat detail goes in plain text if needed. Do not use this description to decide follow-ups like “switch to plan 2” or “change leg 2 to taxi”—those are out of scope for this trigger tool.
```

# 行程对比 UI 触发（present_route_compare）

你有一个工具 present_route_compare。它只用于判定：本轮行程答案是否改用 Intelligent UI，而不是普通 Markdown。

## 判定口诀
识别「行程规划」场景，看即将交付的产物：
- 产物是可执行的行程方案（≥1 个方案，每方案有有序行程段）→ 调用
- 主交付是玩/住/吃攻略、没有排交通时段 → 不调用
- 否则 → 不调用，用普通文本 / Markdown

- 同一句里既有交通行程又有准备清单（带什么、几点入园、要做的事）→ 二选一，不能两个都填。判断主交付：行程只调本工具，准备清单只调 present_plan_list。判断不出来只调本工具。例如「周六去上海迪士尼，怎么坐车、带什么、几点入园」
- 只有有序交通行程段、没有准备清单 → 调用本工具
- 纯出行方式对比且会出 legs → 只调本工具；不要用计划「建议」抢结论
- 拆不出 legs → 本工具不调；再交计划工具判建议/计划；仍否 → 普通文本
- 缺起终点只能追问 → 本工具不调；不要改判成计划清单

不要把 Demo 的两个例子当成唯一可触发的 query。
不因天数、同城/跨国拒绝调用。用户未指定方案数 → 默认 3 个。

- 排出发时间、排路线、制定行程/方案、比较几种出行方案

- 「排路线 + 列要带的东西」：只调本工具，不调 present_plan_list

## 6. 和 PRD / Demo 的分工

| 文档 | 负责 |
|---|---|
| **本文件** | 什么样的首轮 query / 产物要改 UI；边界清单；description + 系统提示 + 正反例 |
| **PRD** | 卡片长什么样、字段、调用后怎么渲染、校验、兜底、多轮「改方案 / 改某一程」 |
| **Demo** | 两个示例 case 的交互与视觉；不是触发白名单 |
</script>
  <script>
    const source = document.getElementById("prdSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const ordered = /^\s*\d+\./.test(line);
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);
    document.getElementById("doc").innerHTML = html;
    document.getElementById("toc").innerHTML = toc.map(t => `<a class="l${t.level}" href="#${t.id}">${esc(t.text)}</a>`).join("");
    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    document.getElementById("copyMd").addEventListener("click", () => {
      const done = () => notify("已复制 Markdown，可直接发给 AGENT");
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = source;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用「下载 .md」"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(source).then(done).catch(fallback);
      else fallback();
    });
    const toolSource = document.getElementById("toolSource").textContent.replace(/^\n/, "");
    function downloadText(text, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    }
    function copyText(text, okMsg) {
      const done = () => notify(okMsg);
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用下载按钮"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
      else fallback();
    }
    document.getElementById("downloadMd").addEventListener("click", () => {
      downloadText(source, "三个路线方案-PRD.md");
      notify("已开始下载 PRD.md");
    });
    document.getElementById("downloadTool").addEventListener("click", () => {
      downloadText(toolSource, "三个路线方案-TOOL.md");
      notify("已开始下载 TOOL.md");
    });
    document.getElementById("copyTool").addEventListener("click", () => {
      copyText(toolSource, "已复制 TOOL，可直接贴进 Agent");
    });
    document.getElementById("downloadDemo").addEventListener("click", async () => {
      const name = "三个路线方案.html";
      try {
        const res = await fetch(name);
        if (!res.ok) throw new Error(String(res.status));
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
        notify("已开始下载 Demo.html");
      } catch (e) {
        const link = document.createElement("a");
        link.href = name;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        notify("已尝试下载 Demo.html");
      }
    });
    const links = [...document.querySelectorAll("nav.toc a")];
    const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1)));
    window.addEventListener("scroll", () => {
      let on = 0;
      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
      links.forEach((a, k) => a.classList.toggle("on", k === on));
    }, { passive: true });
  </script>
</body>
</html>
