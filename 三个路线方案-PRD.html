# 行程对比回复 UI 改版 PRD

| 项目 | 内容 |
|---|---|
| 文档状态 | 待开发 · 第 12 节问题已全部确认 |
| 版本 | v0.1 · 2026-11-13 |
| 交互 Demo | [三个路线方案.html](三个路线方案.html)（左侧历史有两个示例：一日通勤、跨天旅行；右上角「说明」可看逐项标注）。Demo 中的地图入口仅作演示，**本期不开发** |
| 适用读者 | 前端、后端、测试，以及接手开发的 AGENT |

> 给 AGENT：请按「第 6 节数据契约 → 第 7 节后端 → 第 8 节前端 → 第 11 节验收」的顺序实现。第 12 节已确认的按结论开发；写「沿用线上」的不改现有逻辑；仍为「待确认」的先按「默认方案」开发，并在代码里留出配置开关。

---

## 1. 背景与目标

### 1.1 现状
用户在 MoreAI 对话里提「帮我排出发时间和路线，给我制定三个方案」，线上回复是一整段多级 Markdown 列表：
- 三个方案上下排列，要比较只能来回翻；
- 关键信息（几点出发、几点到）和细节（步行 3 分钟到 2 号口）在同一层级；
- 推荐结论只写在标题括号里，后面没有下一步；
- **线上 bug**：「约 35~40 分钟……预计 09:15~09:20 抵达」中两个 `~` 被 Markdown 解析成删除线，中间文字被划掉。

### 1.2 目标
- **内容和推荐逻辑不变**：方案、推荐、每一程的线路沿用线上模型的输出。本次只改呈现。
- 在 Chat 里完成比较，不需要打开右侧展示区。
- 一套组件同时支撑「一日通勤（有截止时间）」和「跨天旅行（有住几晚）」两类行程。
- 修复波浪号变删除线的问题。

### 1.3 成功标准
- 用户不滚动超过一屏，就能知道推荐哪个方案、三个方案差在哪。
- 表格可以一键复制到飞书文档 / Excel 并保持表格结构。
- 结构化渲染失败时，用户仍能看到完整的文字回复（不出现空白或报错）。

---

## 2. 范围

### 2.1 本期做
1. 行程对比场景的结构化输出与渲染（第一轮 + 后续轮次）。
2. 组件：思考过程、结论句、行程对比大卡、方案明细（文字 + 表格）、出行提示。
3. 深浅模式：所有组件颜色走 token，浅色 / 深色两套（见 5.6）。
4. **全站通用提示块**：「出行提示」这种提示块是全站一致的设计，任何场景的 Chat 回复里只要出现提示 / 说明类内容，都用同一个组件展示（见 5.7）。
5. 表格复制（富文本表格 + 纯文本双格式）。
6. 多轮：换方案、调整某一程（只能由用户输入触发）。
7. 边生成边渲染：结论、对比卡、方案明细、出行提示按生成顺序逐块出现。
8. 兜底：结构化失败时回退 Markdown；Markdown 渲染修复 `~`。

### 2.2 本期不做
- 选择卡（让用户先选方案）。
- 推荐操作（回复底部的快捷按钮，如「改用方案二」）：不做。后续轮次只能由用户输入触发。
- 「加入日程」及任何写入用户日历的能力。
- **地图功能**：对话里的地图入口、右侧路线图都不做。Demo 保留演示和说明，供后续迭代参考；后续接入需要地图 SDK：国内用高德，国外用 Google Maps（见 8.5）。
- 路线 / 票务服务校验：班次、时长、票价一期只用大模型生成，与线上一致；二期再接路线服务。
- 实时导航、实时路况、实时票价。
- 订票、叫车等外部下单。

---

## 3. 场景

| 场景 | 示例 query | 关键特征 |
|---|---|---|
| 一日通勤 | 我住徐汇滨江，9 点半在陆家嘴见客户，12 点在静安寺见另一个，3 点回人民广场附近的公司。帮我排出发时间和路线。给我制定三个方案 | 同一天；每站有截止时间；市内交通 |
| 跨天旅行 | 我在马德里，想去巴塞罗那和马略卡玩，巴塞呆 3 天，马略卡呆 4 天再回马德里，明天出发，帮我排出发时间和路线。给我制定三个方案 | 跨多天；每站有住几晚；城际交通（高铁、飞机、渡轮） |

两类场景**共用同一组件和同一顺序**，差异只由数据决定（见 5.3）。

---

## 4. 交互流程

### 4.1 第一轮
1. 用户发送 query。
2. **思考过程**：MoreAI 头像 + 名称；阶段文字流光 + 秒数；展开后是「已执行 N 个步骤」。默认展开，回复开始出现时自动收起成「已完成 N 秒」，头像跳一下。最后一步固定写「按推荐定下方案X。需要换方案时，写完后再说。」
3. **回复**，边生成边渲染，按以下固定顺序逐块出现（详见 6.3）：
   1. 结论句；
   2. 行程对比大卡；
   3. 三个方案的文字 + 表格（推荐方案排第一，全部展开）；
   4. 出行提示；
4. **操作栏**：复制、重新生成、赞、踩、分享 + 时间（悬停显示）。回复底部没有快捷按钮。

### 4.2 第二轮起（换方案 / 调整某一程）
- 触发：只能由用户在输入框输入，如「改用方案二」「用专车那个」「第二程改打车」「第二程改坐渡轮」。没有快捷按钮。
- 回复：思考过程（2 步）→ 结论句 → 所选方案的文字 + 表格 → 操作栏。
- **不重复**：行程对比大卡、出行提示。

### 4.3 其他交互
| 交互 | 规则 |
|---|---|
| 复制表格 | 表格右上角图标，悬停提示「复制表格」；写入 `text/html` + `text/plain`（TSV）；成功提示「已复制表格」 |
| 地图 | **本期不做**。Demo 中的地图入口和右侧路线图仅作演示 |
| 提问目录 | ≥2 条用户消息、右侧展示区关闭时显示（复用现有组件） |
| 赞 / 踩 | 互斥，再点取消；点踩不弹原因、不弹提示 |
| 编辑用户消息 | 原位编辑，发送后在末尾新增一条消息并重新生成；生成中不可编辑 |
| 重新生成 | 与论文对比一致：生成新版本，结论旁出现「‹ 2 / 2 ›」切换；切换时整条回复（结论、对比卡、表格、提示）一起切换。Demo 为原位重跑，以本文为准 |

---

## 5. 组件与样式规范

### 5.1 组件清单
| 组件 | 出现条件 | 形态 | 依赖字段 |
|---|---|---|---|
| 思考过程 | 每轮 | 复用现有组件 | `thinking_steps[]` |
| 结论句 | 每轮 | 正文 | `conclusion` |
| 行程对比大卡 | 仅第一轮，且方案数 ≥2 | 卡片（一层）+ 方案块（二层） | `trip`、`plans[]` |
| 方案明细 | 每轮（第一轮全部方案，之后仅所选方案） | 正文 + 表格，不包卡片 | `plans[].legs[]` |
| 出行提示 | 仅第一轮，`tips` 非空 | 卡片，**使用全站通用提示块**（5.7） | `tips[]` |
| 地图入口 | **本期不做** | — | — |

### 5.2 信息分级（对比卡与方案明细共用）
| 层级 | 内容 | 例子 | 样式 |
|---|---|---|---|
| 结论句 | 推荐结论 + 依据 | 推荐**方案一**：08:25 出门，全程地铁…… | 15/24 常规 #1c2330，方案名加粗 |
| 组件小标签 | 对比卡顶部 | 今日行程 / 行程骨架 | 12/18 #667085 |
| 一级标题 | 方案序号 + 出行方式 | 方案一 · 全地铁 | 15px 700 #1c2330（对比卡行高 22，明细行高 24） |
| 一级标签 | 推荐 | 推荐 | 底 #e7f8ef，字 #067647，12/18 700，与标题同行 |
| 副标题 | 定位 · 理由 | 高效准点 · 时间最可控，早高峰不堵车 | 13/20 500 #344054 |
| 三级说明 | 风险或适用场景 | 早高峰过江及延东隧道车流量大…… | 对比卡 12/18 #667085；明细里的适用说明 / 小结 14/22 #344054 |
| 行程时间 | 出发时间 | 08:25 / 11/14 09:00 | 13/20 700 #1c2330，等宽数字 |
| 行程路段 | 起点 → 终点 | 徐汇滨江 → 陆家嘴 | 13/20 常规 #1c2330 |
| 行程辅助 | 方式 · 到达 | 地铁 · 09:15–09:20 到 | 12/18 #667085 |
| 表格 | 表头 / 单元格 / 次要信息 | — | 表头 12px #667085；单元格 13/20；次要信息 12/18 #667085，每条一行 |

**禁止**：同一级用两种样式；用颜色区分层级。

### 5.3 场景差异（只由数据决定）
| 判断条件 | 骨架 | 时间线节点 | 表格列 | 地图线型 |
|---|---|---|---|---|
| 每站有 `deadline`（一日通勤） | 「今日行程」+ 截止时间 | `HH:MM` | 行程、出发、方式与线路、预计到达、缓冲 | 本期不做（Demo：地铁实线蓝；打车 / 专车虚线橙） |
| 每站有 `nights`（跨天旅行） | 「行程骨架」+ X 晚 | `M/D HH:MM` | 日期、行程、方式与班次、出发 – 到达、时长、参考价 | 本期不做（Demo：高铁实线蓝；飞机点线灰；渡轮虚线绿） |

- 缓冲 = 截止时间 − 预计到达的上限，前端计算（见 8.3）。
- 跨夜到达显示「次日 07:00」。

### 5.4 样式 token
| 类别 | 值 |
|---|---|
| 层级 | 最多两层：卡片 → 块；块内不再套块 |
| 间距 | 回复内组件间距 12px；对比卡内边距 14px 16px，块间距 8px；方案块内边距 12px 16px；出行提示内边距 12px 16px 14px |
| 宽度 | 对比卡 ≤600px；方案明细、出行提示 ≤680px；窄屏 100%，表格横向滚动（最小宽 520px） |
| 圆角 | 卡片 16；块 14；表格 12 |
| 颜色 | 全部引用 5.6 的 token，不写死色值；取值来自《华为项目-规范》色彩规则，下面三行写的是浅色取值 |
| 底色 / 描边 | 卡片 #EEF0F3（次要容器）；方案块 #FFFFFF（容器）；表格白底 + 1px #D8D9DD 边框、#E3E4E7 行分割，表头 #EEF0F3 |
| 方案色（只用于对比卡时间线圆点与竖线） | 方案一 Brand1 #0A59F7、方案二 Purple1 #8C3BFE、方案三 Cyan1 #00A7AD；推荐方案竖线实色，其他 35% 透明度 |
| 其他颜色 | 「推荐」标签 Green10 #E9F5E7 底 / Green1 #64BB5C 字；出行提示灯泡 Orange1 #ED6F21；品牌色 #0A59F7 仅用于链接、按钮、悬停 |

### 5.5 文案规则
- 方案命名：一级标题「方案X · 出行方式」；副标题「定位 · 理由」；调整后在出行方式后加括号，如「全地铁（第二程改打车）」。
- 结论句模板：
  - 推荐：「推荐方案X：<首程出发时间> 出门 / 出发，<方式>，<依据>。」
  - 换方案：「已改用方案X · 出行方式（定位）：<出发时间> 出发，<依据>。」
  - 调整：「已把第二程改成……，其余两程不变。」
- 时间：一日内 `08:25`；跨天 `11/14 09:00`；跨夜 `次日 07:00`；约数 `约 11:45`。
- **范围一律用「–」**（U+2013），如 `09:15–09:20`、`45–55 分钟`、`€30–90 / 人`。禁止输出 `~`。
- 时长：「约 X 分钟」「约 X 小时 Y 分钟」。
- 每个方案一句小结，写整体特点或主要风险。
- 出行提示：「小标题：正文」，2–3 条。

### 5.6 颜色 token（浅色 / 深色）
颜色来自 Figma《【25】华为项目-规范》的「色彩规则」与色板（[链接](https://www.figma.com/design/yqXDOTr2jDco9DVso8EVXs/?node-id=0-1)）。组件只引用下面的 `--rt-*` token，跟随产品主题切换；「规范 token」一列是它对应的规范变量，产品已有规范变量时直接引用规范变量即可。Demo 右上角「浅色 / 深色」可切换查看。

| 名称 | Token | 规范 token | 浅色 | 深色 | 用在哪里 |
|---|---|---|---|---|---|
| 文字一级 | `--rt-text-1` | @text-color-primary | #000000 | #FFFFFF | 结论句、方案标题、时间、路段、表格正文 |
| 文字二级 | `--rt-text-2` | @text-color-secondary | #000000 60% | #FFFFFF 60% | 副标题、适用说明、小结、提示正文 |
| 文字三级 | `--rt-text-3` | @text-color-secondary | #000000 60% | #FFFFFF 60% | 组件小标签、表头、次要信息、复制图标 |
| 文字四级 | `--rt-text-4` | @text-color-placeholder | #000000 40% | #FFFFFF 40% | 圆点、弱提示 |
| 卡片底 | `--rt-card` | @bg-color-secondarycontainer | Gray1 #EEF0F3 | Gray12 #191A1D | 对比卡、出行提示 |
| 块底 | `--rt-block` | @bg-color-container | White #FFFFFF | Gray13 #111216 | 对比卡里的方案块 |
| 表格底 | `--rt-table` | @bg-color-container | White #FFFFFF | Gray13 #111216 | 表格 |
| 表头底 | `--rt-table-head` | @bg-color-secondarycontainer | Gray1 #EEF0F3 | Gray12 #191A1D | 表头 |
| 时间线圆点填充 | `--rt-dot` | @bg-color-container | White #FFFFFF | Gray13 #111216 | 对比卡时间线圆点 |
| 描边 | `--rt-line` | @component-border | Gray4 #D8D9DD | Gray10 #434448 | 表格边框 |

| 分割线 | `--rt-divider` | @component-stroke | Gray3 #E3E4E7 | Gray11 #292B2E | 方案之间、明细分割 |

**外壳（页面级，沿用规范，不属于本需求开发范围）**：页面底 @bg-color-page（Gray1 #EEF0F3 / Gray14 #090B0E）；聊天区 @bg-color-container（#FFFFFF / Gray13 #111216）；悬停 @bg-color-container-hover（Gray1 / Gray11 #292B2E）。

**规则**
1. 组件里不写十六进制色值，只引用 token；不单独做主题开关，跟随产品主题。
2. 文字只用规范的四级：主要 100%、次要 60%、占位 40%、禁用 20%。行程对比的第三级文字（表头、标签、补充说明）也用次要 60%，与第二级靠字号、字重区分；40% 只用于圆点这类弱元素，禁用 20% 本需求不用。
3. 两层结构用「次要容器 + 容器」：对比卡、出行提示用次要容器底，卡片里的方案块用容器底。浅色下块比卡亮，深色下块比卡暗，两种模式都靠明度差分层。
4. 方案标识色用没有功能语义的 Brand / Purple / Cyan，避免和警示（橙）、成功（绿）混淆；「推荐」标签用成功色。
5. 规范内部有冲突时，以色阶名为准：深色次要容器取 Gray12 #191A1D（规则表误写为 #292B2E）；深色警示色取规则表的 #DB6B42（色板 Orange1 误标为 #D94838）；主文字按规则表取 100%（Figma 变量名写的 90% 不采用）。
6. 文字一级、二级在对应底色上的对比度不低于 4.5:1，三级不低于 3:1；「推荐」标签按规范成功色取值，是唯一例外。

### 5.7 全站通用提示块（Tip Block）
**定位**：全站一致的设计。不只用于行程对比；任何场景的 Chat 回复里，只要出现「提示 / 说明 / 注意事项 / 小贴士」这类内容，都用这个组件展示，不再用普通 Markdown 列表或 emoji 标题。

**什么内容算提示**
- 用：对用户有帮助、但不是主结论的补充说明，如「陆家嘴站步行时间」「高铁提前到站」「建议提前预约专车」「文件过大时可先压缩」。
- 不用：
  - 错误、失败、权限不足 → 用现有的错误 / 断网提示卡片；
  - 某个方案自身的风险 → 写在该方案的小结里（如方案二早高峰拥堵）；
  - 主结论、步骤说明 → 用正文。

**结构**
1. 标题行：灯泡图标 + 标题。标题按场景取，默认「提示」；行程场景用「出行提示」；也可用「注意事项」「小贴士」。
2. 条目列表：每条「小标题：正文」；没有小标题时只写正文。
3. 一条回复里最多一个提示块，放在主内容之后、操作栏之前。

**样式**（全站共用，颜色取自 5.6 token）
| 项目 | 规格 |
|---|---|
| 容器 | 圆角 14px；内边距 12px 16px 14px；底 `--rt-card`；无描边、无阴影；宽度与正文一致（≤680px） |
| 图标 | 16px 灯泡线性图标，颜色 `--rt-tip-icon`，与标题间距 6px；这是提示块里唯一的颜色 |
| 标题 | 14/22，700，`--rt-text-1` |
| 条目 | 13/21，`--rt-text-2`；条目间距 6px；左侧 4px 圆点 `--rt-text-4`，正文缩进 12px |
| 条目小标题 | 600，`--rt-text-1`，后接全角冒号「：」 |
| 数量 | 建议 2–3 条，最多 5 条；超过 5 条只保留前 5 条 |
| 深色模式 | 自动跟随 token，无需单独设计 |

**规则**
- 不在提示块里放按钮、链接卡片、表格或嵌套列表；需要链接时用正文内文字链接。
- 不用 emoji（如 💡）做标题，统一用组件里的灯泡图标。
- 不改色区分「重要 / 一般」提示；需要强调时把关键词加粗。

**数据**
- 结构化回复：返回 `{ "type": "tips", "title": "出行提示", "items": [{ "title": "陆家嘴站步行时间", "body": "……" }] }`；行程对比里即 `tips[]`（标题默认「出行提示」）。
- Markdown 回复（其他场景、兜底）：前端渲染时识别以下写法，转成提示块：
  - 标题以「💡」开头，或标题文字为「提示 / 小提示 / 小贴士 / 注意事项 / 温馨提示 / 出行提示」；
  - 标题下紧跟的列表，每条按「**小标题**：正文」拆分。
  - 识别失败时按原 Markdown 渲染。

### 6.1 消息载荷

### 6.2 字段说明
| 字段 | 类型 | 必填 | 说明 |
|---|---|---|---|
| `turn_kind` | `initial` / `switch_plan` / `modify_leg` / `other` | 是 | 决定渲染哪些组件（见 5.1） |
| `scene` | `same_day` / `multi_day` | 是 | 决定表格列、时间格式、地图线型；后端按「是否跨天」判定 |
| `trip.stops[].role` | `origin` / `stop` / `destination` | 是 | 起终点同名时前端合并为一个点 |
| `trip.stops[].deadline` | `HH:MM` | 一日通勤必填 | 用于骨架和缓冲计算 |
| `trip.stops[].nights` | int | 跨天必填 | 骨架显示「X 晚」 |
| `plans[].index` | int | 是 | 渲染为「方案一 / 二 / 三」 |
| `plans[].recommended` | bool | 是 | **有且仅有一个 true** |
| `legs[].date` | `YYYY-MM-DD` | 是 | 跨天场景显示 `M/D`；日期和时间以后端返回为准，前端不做时区换算 |
| `legs[].depart.time` / `arrive.*` | `HH:MM` | 是 | 范围用 `from` / `to`，单点时 `to` 为 null |
| `legs[].arrive.next_day` | bool | 否 | true 时显示「次日 HH:MM」 |
| `legs[].mode_type` | `walk` / `metro` / `bus` / `taxi` / `car` / `bike` / `rail` / `flight` / `ferry` / `mixed` | 是 | 交通方式类型，用于识别「某一程改用 X」和后续地图线型；`mixed` 时取 `mode_label` 第一个方式 |
| `legs[].mode_label` | string | 是 | 展示用，如「地铁 / 打车」 |
| `door_to_door_min` / `duration_min` | `{from,to}` 分钟 | 二选一 | 一日通勤用门到门，跨天用时长 |
| `price` | `{currency, from, to, unit}` | 否 | 跨天场景显示参考价 |
| `stop.lat` / `stop.lng` | number | 否 | **本期不用**，为后续地图功能预留，可不返回 |

### 6.3 流式事件（SSE）：边生成边渲染
已确认：回复按块流式渲染。后端让模型按固定顺序逐块输出（建议 NDJSON：每行一个完整的块），每解析出一个完整块就推送一个事件；前端收到即渲染，不等整包。

| 顺序 | 事件 | 载荷 | 前端行为 |
|---|---|---|---|
| 0 | `thinking_step` | `{ title, note }` | 追加思考步骤；可出现多次 |
| 1 | `route_meta` | `{ schema_version, turn_kind, scene }` | 思考收起，创建回复容器 |
| 2 | `conclusion_delta` | `{ text }` 文本片段 | 结论句逐字流式显示（方案名在完成后加粗） |
| 3 | `route_trip` | `trip` | 第一轮：渲染对比卡外框和顶部骨架 |
| 4 | `route_plan` | 单个 `plan`（含全部 `legs`） | 第一轮：对比卡追加一个方案块，同时在下方追加该方案的文字 + 表格；后续轮次只追加表格。每个方案一个事件，按推荐方案在前的顺序 |
| 5 | `route_compare_foot` | `{ text }` | 第一轮：对比卡底部总结 |
| 6 | `route_tips` | `tips[]` | 第一轮：渲染出行提示 |
| 7 | `done` | `{ message_id, payload }` | 结束；`payload` 为完整 6.1 载荷，用于落库和回放 |
| — | `text_delta` | 文本片段 | 仅兜底时使用，按 Markdown 流式渲染 |
| — | `error` | `{ code, recoverable }` | 沿用线上中断 / 重试逻辑（Q14，不在本需求内） |

**渲染规则**
- 生成中自动跟随到底部；用户往上翻看时不强制拉回。
- 每块到达前不显示占位骨架，到达后整块出现，避免页面跳动；表格整张出现，不逐行出现。
- 对比卡在第一个 `route_plan` 到达后才显示「推荐」标签（推荐方案总是第一个）。
- 操作栏只在 `done` 后显示。
- 用户在生成中停止、或生成中断：沿用线上停止 / 中断 / 重试逻辑（Q14，不在本需求内）。

## 7. 后端职责

### 7.1 意图识别
- 判断是否进入「行程对比」：用户要求排路线 / 出发时间 / 行程即进入（Q2）；方案数按用户要求出 1–4 个，1 个时不出对比卡（Q1）。
- 识别后续轮次的意图：换方案（「改用方案二」「用专车那个」）、调整某一程（「第二程改打车」）、其他。
- 未识别为行程对比时，走原有通用回复，不受本需求影响。

### 7.2 结构化生成
- 提示词要求模型按 6.3 的顺序逐块输出（NDJSON：每行一个完整 JSON 块），后端逐行解析、校验后推送事件；全部完成后拼成 6.1 完整载荷。不要让模型在 Markdown 里夹 JSON。
- 方案内容、推荐结论沿用现有提示词的产出逻辑，只是改成结构化字段。
- 时间范围用 `{from, to}`，**不要在任何文本字段里输出 `~`**；若出现，后端替换为 `–`。

### 7.3 校验与补全（返回前端前）
| 校验 | 处理 |
|---|---|
| 某一块 JSON 不合法 / 缺必填字段 | 首块（`route_meta`、`trip`）失败：重试 1 次，仍失败走兜底（7.6）；后续块失败：推送 `error`，之后沿用线上中断 / 重试逻辑（Q14） |
| `recommended` 不是恰好一个 | 取第一个为推荐，记录告警 |
| 方案数为 0 或超过 4 | 0 个走兜底；超过 4 个只保留前 4 个（Q1） |
| `depart` 晚于 `arrive` 且非 `next_day` | 标记异常，记录告警，前端照常显示 |
| 预计到达晚于截止时间 | 保留数据，前端缓冲显示「可能迟到」（见 8.3） |
| 文本字段含 `~` | 替换为 `–` |

### 7.4 多轮上下文
- 每轮把上一轮的结构化结果存入会话上下文。
- 「换方案」：直接返回已有方案的数据，`turn_kind=switch_plan`，`plans` 只含所选方案，不必重新生成线路。
- 「调整某一程」：基于当前方案，只重新生成被调整的那一程，其余程原样返回，`plan.mode_label` 追加括号说明。
- 用户输入无法识别为以上两类时：新的行程需求重新走第一轮；无关问题走通用回复（沿用线上意图识别，Q9）。

### 7.5 后续轮次的触发（只能用户输入）
- 回复底部没有快捷按钮，后续轮次全部来自用户在输入框里的输入。
- 后端需要识别的话术（示例，非穷举）：
  - 换方案：「改用方案二」「方案三」「用专车那个」「全地铁」；
  - 调整某一程：「第二程改打车」「第二程改坐渡轮」「下午不打车」；
  - 其他：按 7.4 最后一条处理。
- 识别依赖上一轮的结构化结果（方案序号、`mode_label`、`mode_type`），沿用线上意图识别能力。

### 7.6 兜底
- 结构化失败时，返回同一内容的 Markdown（`fallback_markdown`，或直接走 `text_delta` 流），前端按现有方式渲染。
- Markdown 渲染层统一修复：单个 `~` 不解析为删除线（只有 `~~` 才算）。

### 7.7 存储与回放
- 消息落库时保存完整 `route_compare` 载荷，刷新 / 回看历史时前端按载荷重新渲染，不依赖重新调用模型。
- 重新生成：同一条消息下保存多个版本（`versions[]`，每个版本一份完整载荷），记录当前展示的版本号；后续轮次基于用户当前看到的版本继续。
- 赞 / 踩、分享复用现有接口。

### 7.8 埋点
| 事件 | 参数 |
|---|---|
| `route_compare_shown` | scene、plan_count、recommended_index |
| `route_table_copy` | plan_index、turn_kind |
| `route_followup` | turn_kind（switch_plan / modify_leg / other） |
| `route_fallback` | reason |

## 8. 前端职责

### 8.1 渲染器
- 新增 `RouteCompareMessage` 组件，入参为 6.1 载荷；按 `turn_kind` 决定组件组合（5.1）。
- `content_type` 不是 `route_compare` 时走原有渲染。
- 子组件：`ThinkingSteps`（复用）、`Conclusion`、`CompareCard`、`PlanSection`（标题 + 副标题 + 适用说明 + `RouteTable` + 小结）、`TipBlock`（全站通用提示块，见 5.7）、`VersionPager`（复用论文对比的「‹ 2 / 2 ›」）。
- `TipBlock` 放在全站公共组件库，不放在行程对比目录下；Markdown 渲染器在识别到 5.7 的写法时调用它。
- 组件支持增量追加：`CompareCard` 与 `PlanSection` 按 `route_plan` 事件逐个追加（见 6.3）。

### 8.2 格式化（统一在前端做）
| 输入 | 输出 |
|---|---|
| `plans[].index=1` | 方案一 |
| `{from:"09:15", to:"09:20"}` | 09:15–09:20 |
| `{from:"11:45", approx:true}` | 约 11:45 |
| `next_day=true` | 次日 07:00 |
| `scene=multi_day` 的时间 | 11/14 09:00（前端不做时区换算） |
| `door_to_door_min {50,55}` | 约 50–55 分钟 |
| `price {EUR,30,90,"人"}` | €30–90 / 人 |

### 8.3 缓冲计算
- 仅 `scene=same_day` 且该站有 `deadline` 时计算：`缓冲 = deadline − arrive.to（无 to 时用 from）`。
- 结果为范围时显示「10–15 分钟」（用 `arrive.from` 与 `arrive.to` 各算一次）。
- ≤0 时显示「可能迟到」并用三级说明样式提示；结论句的说明沿用线上模型输出（Q8）。

### 8.4 表格复制
- `navigator.clipboard.write` 同时写入 `text/html`（带边框的 table）和 `text/plain`（TSV，行用 `\n`，列用 `\t`）。
- 不支持 `ClipboardItem` 时降级为纯文本复制。
- 复制内容与表格展示一致，次要信息合并到「方式与线路」单元格，用「；」分隔。
- 运行环境需确认剪贴板权限（见待确认 Q10）。

### 8.5 地图（本期不做）
- 本期不开发地图入口和右侧路线图。
- Demo 中的地图仅作演示，样式和交互见 Demo「说明」里的「地图入口与路线示意图」。
- 后续接入方案：国内行程用高德地图 SDK，国外行程用 Google Maps；需要后端返回 `stops[].lat/lng`，按 `legs[].mode_type` 区分线型。

### 8.6 状态与多轮
- 回复底部不渲染快捷按钮；后续轮次只来自输入框。
- 生成中：隐藏用户消息的编辑按钮，发送按钮置灰。
- 提问目录：≥2 条用户消息时显示（复用现有组件）。
- 重新生成：新版本流式生成；完成后结论旁显示「‹ N / N ›」，切换版本时整条回复一起切换。
- 历史回放：按存储的载荷渲染，思考过程默认收起，头像不跳。

### 8.7 无障碍与适配
- 方案标题用 `h3/h4`；表格用原生 `table` + `th`；复制按钮 `aria-label="复制表格"`。
- 开启「减少动态效果」时关闭头像动效、流光、目录动画。
- 深浅模式：所有颜色取自 5.6 token，跟随产品主题切换；切换时无需刷新。
- 窄屏：卡片 100% 宽，表格横向滚动，不压缩文字。

## 9. 接口与时序

```
用户发送 query
  → 后端：意图识别 = 行程对比
  → SSE thinking_step × N
  → 后端：结构化生成 → 校验 → 补全
     ├─ 成功：SSE route_meta → conclusion_delta… → route_trip → route_plan ×N → route_compare_foot → route_tips
     │        （前端每收到一块就渲染一块）
     └─ 失败：SSE text_delta（Markdown 兜底）
  → SSE done（附完整载荷，落库）
  → 前端：显示操作栏

用户在输入框输入「改用方案二」
  → 前端：作为普通用户消息发送
  → 后端：读取上一轮载荷 → turn_kind=switch_plan → 返回所选方案
```

---

## 10. 边界与异常

| 情况 | 处理 |
|---|---|
| 结构化失败（首块） | Markdown 兜底，埋点 `route_fallback` |
| 生成中断（后续块失败 / 断网） | 不在本需求内，沿用线上中断 / 重试逻辑（Q14） |
| 只有 1 个方案 | 不出对比卡，直接出方案明细（Q1） |
| 超过 4 个方案 | 只展示前 4 个（Q1） |
| 推荐方案缺失或多个 | 后端校验修正（7.3） |
| 到达晚于截止 | 缓冲显示「可能迟到」（Q8） |
| 某一程交通方式混合（地铁 / 打车） | 表格照写；`mode_type=mixed` |
| 跨夜到达 | 「次日 07:00」 |
| 字段文本超长 | 表格单元格自动换行；标题不截断 |
| 用户在生成中切换会话 | 后台继续生成，回来后显示结果（复用现有逻辑） |
| 文本里出现 `~` | 后端替换为 `–`；Markdown 渲染层单个 `~` 不解析 |

</script>
  <script>
    const source = document.getElementById("prdSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const ordered = /^\s*\d+\./.test(line);
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);
    document.getElementById("doc").innerHTML = html;
    document.getElementById("toc").innerHTML = toc.map(t => `<a class="l${t.level}" href="#${t.id}">${esc(t.text)}</a>`).join("");
    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    document.getElementById("copyMd").addEventListener("click", () => {
      const done = () => notify("已复制 Markdown，可直接发给 AGENT");
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = source;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用「下载 .md」"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(source).then(done).catch(fallback);
      else fallback();
    });
    document.getElementById("downloadMd").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([source], { type: "text/markdown;charset=utf-8" }));
      link.download = "三个路线方案-PRD.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    });
    const links = [...document.querySelectorAll("nav.toc a")];
    const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1)));
    window.addEventListener("scroll", () => {
      let on = 0;
      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
      links.forEach((a, k) => a.classList.toggle("on", k === on));
    }, { passive: true });
  </script>
