<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天气场景</title>
  <style>
    :root {
      --page: #f6f7fb;
      --card: #ffffff;
      --card-line: #f1f5f9;
      --brand: #0a59f7;
      --brand-deep: #165dff;
      --brand-hover: #1e61ea;
      --brand-active: #0e4ed9;
      --ink: #1e293b;
      --nav: #5e6063;
      --secondary: #5e6063;
      --muted: #858e9c;
      --label: #858e9c;
      --placeholder: #828a99;
      --line: #f1f5f9;
      --chip: rgba(9, 11, 14, 0.04);
      --chip-line: #e9ebee;
      --hover: #f3f7ff;
      --brand-soft: #f3f7ff;
      --send: #165dff;
      --sidebar: linear-gradient(180deg, rgba(248,250,255,.8) 0%, rgba(234,242,255,.8) 54%, rgba(234,242,255,.8) 61%, rgba(243,243,255,.8) 100%);
      --stage: var(--page);
      --shadow: 0 1px 2px rgba(0,0,0,.05);
      --font: "HarmonyOS Sans SC", "HarmonyOS Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", "Noto Sans SC", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: var(--font); color: var(--ink); background: var(--page); letter-spacing: 0; }
    button, textarea { font-family: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .app { display: flex; height: 100%; height: 100vh; height: 100dvh; min-height: 640px; overflow: hidden; }
    .sidebar { width: 210px; flex: none; display: flex; flex-direction: column; background: var(--sidebar); color: var(--nav); }
    .sidebar.collapsed { width: 64px; }
    .org { display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 16px 8px 8px; }
    .sidebar.collapsed .org { justify-content: center; padding: 8px 4px; }
    .org-mark { width: 21px; height: 21px; flex: none; border-radius: 5px; background: #3370ff; color: #fff; font-size: 12px; line-height: 21px; text-align: center; font-weight: 500; }
    .org-name { min-width: 0; flex: 1; font-size: 14px; line-height: 24px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 8px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: #e5edff; color: var(--brand); }
    .nav { padding: 8px; }
    .nav ul, .projects ul, .history ul { list-style: none; margin: 0; padding: 0; }
    .nav-item, .row { display: flex; align-items: center; gap: 8px; height: 34px; width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; color: var(--nav); font-size: 14px; line-height: 22px; text-align: left; }
    .nav-item span, .row span, .session-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item:hover, .row:hover, .session:hover { background: var(--hover); color: var(--brand); }
    .nav-item.active { background: var(--chip); color: var(--brand); }
    .sidebar.collapsed .nav-item { width: 36px; height: 36px; justify-content: center; padding: 0; margin: 0 auto; }
    .sidebar.collapsed .nav-item span, .sidebar.collapsed .section-label, .sidebar.collapsed .projects, .sidebar.collapsed .user-meta, .sidebar.collapsed .org-name { display: none; }
    .section-label { padding: 6px 12px; font-size: 12px; line-height: 18px; color: var(--muted); }
    .projects { min-height: 0; flex: 1; overflow: auto; padding: 0 8px 16px; }
    .user { display: flex; align-items: center; gap: 8px; margin: auto 16px 22px; padding: 6px; border: 0; background: transparent; border-radius: 8px; text-align: left; }
    .user:hover { background: rgba(10,89,247,.06); }
    .avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; background: #d6e3ff; color: var(--brand); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
    .user-meta { min-width: 0; }
    .user-meta strong, .user-meta small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-meta strong { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); }
    .user-meta small { font-size: 11px; line-height: 16px; color: var(--muted); }
    .stage { position: relative; min-width: 0; flex: 1; display: flex; gap: 8px; padding: 8px 8px 8px 0; background: var(--stage); }
    .card { min-width: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: #fff; box-shadow: var(--shadow); }
    .history { width: 260px; flex: none; }
    .history-head { padding: 16px 16px 0; }
    .history-head h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    .new-chat { display: none; align-items: center; gap: 8px; height: 34px; width: calc(100% - 24px); margin: 12px 12px 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; line-height: 22px; padding: 0 12px; }
    .new-chat.show { display: flex; }
    .new-chat:hover { background: var(--hover); color: var(--brand); }
    .history-list { min-height: 0; flex: 1; overflow: auto; padding: 8px 12px 12px; }
    .session { position: relative; display: flex; align-items: center; height: 34px; border-radius: 8px; color: var(--muted); }
    .session.active { background: var(--chip); color: var(--brand); }
    .session-title { flex: 1; height: 34px; border: 0; background: transparent; color: inherit; text-align: left; padding: 6px 12px; font-size: 14px; line-height: 22px; }
    .more { display: none; width: 22px; height: 22px; margin-right: 6px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); }
    .session:hover .more, .session:focus-within .more { display: inline-flex; align-items: center; justify-content: center; }
    .more:hover { background: rgba(0,0,0,.06); }
    .menu { position: absolute; right: 8px; top: 32px; z-index: 5; width: 128px; padding: 8px 15px; border: 0; border-radius: 9px; background: #fff; box-shadow: 0 4px 12px rgba(22,37,67,.16); }
    .menu button { display: flex; align-items: center; width: 100%; height: 28px; border: 0; background: transparent; border-radius: 5px; padding: 0 4px; font-size: 12px; line-height: 18px; color: var(--ink); }
    .menu button.danger { color: #ff3b30; }
    .menu button:hover { background: #f3f3f3; }
    .main { position: relative; flex: 1; }
    .welcome, .thread { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .welcome { align-items: center; justify-content: center; padding: 64px 24px; }
    .welcome-inner { width: min(736px, 100%); display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .welcome h1 { margin: 0; font-size: 20px; line-height: 29px; font-weight: 600; letter-spacing: 0; text-align: center; }
    .prompt-fill { width: min(736px, 100%); min-height: 36px; border: 1px solid #e6e8ec; border-radius: 8px; background: #fff; color: var(--ink); text-align: left; padding: 8px 12px; font-size: 14px; line-height: 22px; }
    .prompt-fill:hover { border-color: #b9d0ff; background: #f3f7ff; color: var(--brand); }
    .thread { display: none; }
    .main.chatting .welcome { display: none; }
    .main.chatting .thread { display: flex; }
    .messages { flex: 1; overflow: auto; padding: 28px 24px 24px; }
    .messages-inner { width: min(640px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .artifact { position: relative; align-self: flex-start; display: flex; align-items: center; width: 300px; max-width: 100%; height: 56px; border: 1px solid #eef0f3; border-radius: 12px; background: #fff; overflow: hidden; }
    .artifact-open { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; height: 100%; padding: 9px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
    .artifact-thumb { position: relative; width: 68px; height: 38px; flex: none; overflow: hidden; border-radius: 6px; border: 1px solid #eef0f3; background: #fff; }
    .artifact-sheet { position: absolute; left: 0; top: 0; width: 272px; padding: 10px 12px 0; transform: scale(0.25); transform-origin: top left; color: #1f2329; pointer-events: none; }
    .artifact-sheet em { display: block; color: #8f959e; font-size: 12px; line-height: 16px; font-style: normal; }
    .artifact-sheet strong { display: block; margin: 2px 0 6px; font-size: 18px; line-height: 24px; font-weight: 650; }
    .artifact-sheet span { display: block; margin: 0 0 4px; color: #3a3d42; font-size: 12px; line-height: 18px; }
    .artifact-copy { min-width: 0; flex: 1; overflow: hidden; }
    .artifact-copy b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #1e293b; font-size: 14px; line-height: 20px; font-weight: 500; }
    .artifact-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(0, 0, 0, 0.4); font-size: 12px; line-height: 18px; font-weight: 400; }
    .artifact-actions { display: none; align-items: center; gap: 2px; padding-right: 8px; flex: none; }
    .artifact:hover { background: rgba(9, 11, 14, 0.04); }
    .artifact:hover .artifact-actions { display: flex; }
    .artifact.on,
    .artifact.on:hover { background: #f3f7ff; border-color: #3370ff; }
    .artifact-actions button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #5e6063; display: grid; place-items: center; padding: 0; }
    .artifact-actions button:hover { background: rgba(9, 11, 14, 0.04); color: #5e6063; }
    .doc-unfold { position: absolute; right: 15px; top: 16px; z-index: 3; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #3c4043; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .doc-unfold[hidden] { display: none; }
    .doc-unfold:hover { color: var(--ink); background: rgba(0,0,0,.06); }
    .doc-empty { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .doc-empty.show { display: flex; }

    .doc-empty p { margin: 0; max-width: 240px; font-size: 13px; line-height: 20px; color: var(--muted); }
    .doc.is-empty .doc-article, .doc.is-empty .compare-bar, .doc.is-empty .changes-toggle { display: none; }
    .msg { max-width: 86%; font-size: 14px; line-height: 22px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #f3f7ff; color: var(--ink); border-radius: 12px; padding: 10px 14px; }
    .msg.assistant { align-self: flex-start; color: var(--ink); padding: 2px 0; }
    .msg.rich { max-width: min(560px, 100%); white-space: normal; }
    .msg.rich p { margin: 0 0 10px; }
    .msg.rich h4 { margin: 12px 0 6px; font-size: 13px; line-height: 20px; font-weight: 650; color: #667085; }
    .msg.rich ul, .msg.rich ol { margin: 0 0 10px; padding-left: 18px; }
    .msg.rich li { margin: 4px 0; }
    .msg.rich li.pick { font-weight: 650; }
    .msg.rich .tag { display: inline-block; margin-left: 8px; height: 18px; padding: 0 6px; border-radius: 99px; background: #e7f8ef; color: #067647; font-size: 12px; line-height: 18px; font-weight: 600; vertical-align: 1px; }
    .msg.rich table { width: 100%; margin: 0 0 10px; border-collapse: collapse; font-size: 14px; line-height: 22px; }
    .msg.rich th, .msg.rich td { border: 1px solid #e6e8ec; padding: 8px 10px; text-align: left; vertical-align: middle; }
    .msg.rich th { background: #f7f8fa; font-size: 12px; line-height: 18px; font-weight: 600; color: #667085; }
    .msg.rich tr.pick td { background: #f4fbf7; font-weight: 650; }
    .revise-card { display: flex; flex-direction: column; gap: 8px; width: min(440px, 100%); }
    .revise-lead { margin: 0; font-size: 14px; line-height: 22px; font-weight: 650; }
    .revise-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .revise-cell { background: #f6f8fb; border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .revise-cell > span { display: block; margin-bottom: 4px; color: #667085; font-size: 12px; line-height: 18px; }
    .revise-cell > b { display: block; font-size: 13px; line-height: 20px; font-weight: 600; }
    .revise-plans { display: flex; flex-direction: column; }
    .revise-plan { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; padding: 5px 0; font-size: 13px; line-height: 20px; }
    .revise-plan.on { font-weight: 650; }
    .revise-more { display: none; flex-direction: column; }
    .revise-cell.plans.open .revise-more { display: flex; }
    .revise-more .revise-plan { border-top: 1px solid #e6ebf3; }
    .revise-fold { display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 2px; border: 0; border-top: 1px solid #e6ebf3; background: transparent; padding: 6px 0 1px; color: #667085; font-size: 12px; line-height: 18px; text-align: left; }
    .revise-fold svg { flex: none; transition: transform .15s ease; }
    .revise-cell.plans.open .revise-fold svg { transform: rotate(180deg); }
    .revise-plan i { flex: none; height: 18px; padding: 0 6px; border-radius: 99px; background: #e7f8ef; color: #067647; font-style: normal; font-size: 12px; line-height: 18px; font-weight: 600; }
    .revise-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .revise-chips b { height: 24px; padding: 0 8px; border-radius: 8px; background: #fff; color: #245bdb; font-size: 12px; line-height: 24px; font-weight: 600; }
    .revise-grid.single { grid-template-columns: 1fr; }
    .stream-caret { display: inline-block; width: 1.5px; height: .9em; margin-left: 1px; background: #245bdb; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
    .composer-wrap { width: min(736px, 100%); }

    .composer { position: relative; display: flex; align-items: center; gap: 2px; width: 100%; padding: 12px; border: 1px solid #f0f0f0; border-radius: 20px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
    .composer:focus-within { border-color: var(--brand); }
    textarea { flex: 1; min-width: 0; min-height: 22px; max-height: 88px; border: 0; resize: none; outline: none; background: transparent; color: var(--ink); font-size: 14px; line-height: 22px; padding: 0 8px; }
    textarea::placeholder { color: var(--muted); }
    textarea:disabled { color: var(--muted); }
    .actions { display: flex; align-items: center; gap: 8px; height: 32px; flex: none; }
    .plus, .send { border: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--ink); }
    .plus { width: 28px; height: 28px; border-radius: 6px; }
    .plus:hover, .plus.open { background: rgba(0,0,0,.06); }
    .send { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-deep); color: #fff; }
    .send:hover { background: var(--brand-hover); }
    .send:active { background: var(--brand-active); }
    .send:disabled { opacity: .5; cursor: default; pointer-events: none; }
    .pop { position: absolute; z-index: 6; background: #fff; border: .5px solid #dcdcdc; border-radius: 16px; box-shadow: 0 3px 7px rgba(0,0,0,.05), 0 8px 5px rgba(0,0,0,.06), 0 5px 2.5px rgba(0,0,0,.1); }
    .plus-menu { left: 12px; bottom: 52px; min-width: 166px; padding: 10px; display: none; }
    .plus-menu.show { display: block; }
    .plus-menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; border: 0; background: transparent; border-radius: 6px; padding: 3px 8px; font-size: 14px; line-height: 22px; color: var(--ink); text-align: left; }
    .plus-menu button:hover { background: rgba(0,0,0,.06); }
    .toast {
      position: fixed;
      left: 50%;
      top: 20px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      width: max-content;
      min-width: min(380px, calc(100vw - 32px));
      max-width: min(480px, calc(100vw - 32px));
      height: 48px;
      margin: 0;
      padding: 0 16px;
      border: 0.5px solid #dcdcdc;
      border-radius: 12px;
      background: #fff;
      color: rgba(0, 0, 0, 0.9);
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
      box-shadow:
        0 8px 10px -5px rgba(0, 0, 0, 0.08),
        0 16px 24px 2px rgba(0, 0, 0, 0.04),
        0 6px 30px 5px rgba(0, 0, 0, 0.05);

      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;

    .toast.show { opacity: 1; }
    .toast img { width: 16px; height: 16px; flex: none; }
    .toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hover-tip { position: fixed; z-index: 90; display: none; max-width: 220px; padding: 4px 8px; border-radius: 6px; background: #1f2329; color: #fff; font-size: 12px; line-height: 18px; pointer-events: none; white-space: nowrap; }
    .hover-tip.show { display: block; }
    .stage {
      height: 100%; height: 100vh; height: 100dvh; min-height: 640px; display: grid;
      grid-template-columns: 268px minmax(0, 1fr);
      gap: 10px; padding: 10px; background: #e8eef6;
    }
    .stage.with-doc { grid-template-columns: 268px minmax(300px, .82fr) minmax(0, 1.35fr); }
    .panel { background: #fff; border-radius: 22px; min-height: 0; box-shadow: none; border: 0; }
    .left { display: grid; grid-template-columns: 56px minmax(0, 1fr); overflow: hidden; }
    .rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0 12px; border-right: 1px solid #eef1f6; }
    .avatar-mini { width: 28px; height: 28px; border-radius: 9px; background: #3b6dff; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 0; margin-bottom: 8px; }
    .user-mini { margin: 0; background: #eef2f7; color: #667085; font-weight: 600; }
    .left { position: relative; z-index: 3; }
    .rail .spacer { flex: 1; }
    .rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .rail .nav-item { width: 34px; height: 34px; border-radius: 10px; padding: 0; display: grid; place-items: center; color: #6e778b; background: transparent; }
    .rail .nav-item span, .rail .section-label, .projects, .org { display: none; }
    .rail .nav-item.active, .rail .nav-item:hover { background: #eaf0ff; color: #3b6dff; }
    .chats { padding: 16px 12px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .chats h1 { font-size: 16px; font-weight: 650; margin: 2px 8px 14px; }

    .chats .new-chat:hover { background: #f3f5f9; color: #6e778b; }
    .hist-label { margin: 16px 8px 8px; color: #8b93a6; font-size: 12px; }
    #sessionList { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
    .chats .session { height: auto; border-radius: 10px; color: #3b6dff; }
    .chats .session.active, .chats .session:hover { background: #eaf0ff; }
    .chats .session-title { height: auto; padding: 9px 12px; font-size: 13px; font-weight: 550; color: inherit; }
    .main { position: relative; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .main-head { padding: 16px 20px 8px; font-size: 18px; font-weight: 650; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .head-actions { display: flex; align-items: center; }

    .main .doc-unfold:hover { background: #f3f5f9; color: #1c2330; }
    .welcome { flex: 1; }
    .main.chatting .welcome,
    .main.chatting .welcome-dock,
    .main.chatting .mascot { display: none; }

    .main:not(.chatting) .thread-dock { display: none; }
    .thread { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .messages { flex: 1; }
    .composer-dock { padding: 0 28px 18px; }

    .thread-dock { align-items: stretch; }
    .starter { max-width: 100%; border: 1px solid #e4e8f1; border-radius: 999px; background: #fff; color: #243047; padding: 8px 14px; font-size: 13px; line-height: 20px; text-align: left; }

    .mascot:before, .mascot:after { content: ""; position: absolute; background: #3b3358; border-radius: 50%; }

    function notify(text, type) {
      const kind = type === "error" || type === "info" ? type : "success";
      const icon = toast.querySelector("img");
      const label = toast.querySelector("span");
      icon.src = toastIcons[kind];
      label.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }
    function sceneById(id) { return scenes.find(item => item.id === id) || scenes[0]; }
    function sceneByText(text) {
      if (/下个月|下月/.test(text)) return "far";
      if (/下周/.test(text) && /[6六]/.test(text)) return "sat";
      if (/20|二十/.test(text)) return "d20";
      if (/三天|3天/.test(text)) return "d3";
      if (/雷|雪|雾|夜|雨|晴|云|天气|七天|7天/.test(text)) return "cloud";
      return "";
    }
    function tempRgb(t) {
      const stops = [[-15, [88, 176, 255]], [0, [110, 206, 255]], [8, [120, 214, 168]], [16, [255, 214, 90]], [24, [255, 159, 48]], [34, [255, 96, 48]]];
      if (t <= stops[0][0]) return stops[0][1];
      const last = stops[stops.length - 1];
      if (t >= last[0]) return last[1];
      for (let i = 0; i < stops.length - 1; i++) {
        const [a, ca] = stops[i];
        const [b, cb] = stops[i + 1];
        if (t >= a && t <= b) {
          const p = (t - a) / (b - a);
          return ca.map((c, k) => Math.round(c + (cb[k] - c) * p));
        }
      }
      return last[1];
    }
    function weatherCardHtml(scene) {
      const today = scene.days[0];
      const temps = scene.days.flatMap(day => [parseFloat(day.low), parseFloat(day.high)]);
      const minT = Math.min(...temps);
      const span = Math.max(Math.max(...temps) - minT, 1);
      const days = scene.days.map((day, index) => {
        const detail = `${day.date} ${day.cond}，${day.high} / ${day.low}°C，降水概率 ${day.pop}${day.rain ? "，" + day.rain : ""}`;
        const lo = parseFloat(day.low);
        const hi = parseFloat(day.high);
        const left = ((lo - minT) / span) * 100;
        const width = Math.min(Math.max(((hi - lo) / span) * 100, 8), 100 - left);
        const pop = day.rain || day.pop;
        const c1 = tempRgb(lo).join(",");
        const c2 = tempRgb(hi).join(",");
        return `<div class="wx-day${day.label === "今天" ? " is-today" : ""}" title="${esc(detail)}"><span class="wx-day-label">${esc(day.label)}</span><span class="wx-day-ico">${skyIcon(day.kind)}</span><em class="wx-day-pop${pop === "0%" ? " is-zero" : ""}">${esc(pop)}</em><span class="wx-lo">${esc(day.low)}°</span><span class="wx-bar" style="--lo:${left.toFixed(1)}%;--span:${width.toFixed(1)}%;--c1:rgb(${c1});--c2:rgb(${c2})"><i></i></span><span class="wx-hi">${esc(day.high)}°</span></div>`;
      }).join("");
      const light = scene.light ? " is-light" : "";
      const cond = scene.when === "今天" ? today.cond : `${scene.when} · ${today.cond}`;
      const preview = scene.window || 0;
      const forecast = preview > 0 && scene.days.length > preview
        ? `<div class="wx-scroll is-more"><div class="wx-scroll-body" style="--preview:${preview}">${days}</div><div class="wx-more" aria-hidden="true">向下查看</div></div>`
        : days;
      return `<article class="wx wx-${esc(scene.tone)}${light}" aria-label="${esc(scene.place)}${esc(scene.when)}天气"><div class="wx-top"><div class="wx-place">${esc(scene.place)}</div><div class="wx-hero"><div class="wx-temp">${esc(today.high)}<sup>°</sup></div><div class="wx-ico">${skyIcon(today.kind)}</div></div><span class="wx-cond">${esc(cond)}</span><div class="wx-range"><span>最高 ${esc(today.high)}°</span><span>最低 ${esc(today.low)}°</span></div></div><div class="wx-days"><div class="wx-days-label">${esc(scene.listLabel || "七日预报")}</div>${forecast}</div></article>`;
    }
    function askMark(on) {
      return on
        ? `<span class="ask-num" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M6 11.2 9.2 14.4 16 7.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`
        : "";
    }
    function askReady(state) {
      if (!state || state.done) return false;
      if (state.picked === "custom") return Boolean(state.custom && state.custom.trim());
      return Boolean(state.picked);
    }
    function askPad(value) { return String(value).padStart(2, "0"); }
    function askIso(date) { return `${date.getFullYear()}-${askPad(date.getMonth() + 1)}-${askPad(date.getDate())}`; }
    function forecastDates() {
      return sceneById("d20").days.map(day => {
        const match = day.date.match(/(\d+)月(\d+)日/);
        const month = Number(match[1]);
        const dayNum = Number(match[2]);
        return { ...day, year: 2026, month, dayNum, iso: `2026-${askPad(month)}-${askPad(dayNum)}` };
      });
    }
    function forecastDay(date) {
      return sceneById("d20").days.find(day => day.date === date) || null;
    }
    function askShiftMonth(view, delta) {
      const next = new Date(view.year, view.month - 1 + delta, 1);
      return { year: next.getFullYear(), month: next.getMonth() + 1 };
    }
    function askMonthOpen(view) {
      return forecastDates().some(day => day.year === view.year && day.month === view.month);
    }
    function askCalendarCells(view) {
      const first = new Date(view.year, view.month - 1, 1);
      const cells = [];
      for (let index = 0; index < first.getDay(); index += 1) cells.push(new Date(view.year, view.month - 1, index - first.getDay() + 1));
      const count = new Date(view.year, view.month, 0).getDate();
      for (let day = 1; day <= count; day += 1) cells.push(new Date(view.year, view.month - 1, day));
      while (cells.length % 7) {
        const last = cells[cells.length - 1];
        cells.push(new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1));
      }
      return cells;
    }
    const askDateIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M8 3v3M16 3v3M3.5 9.5h17"/></svg>`;
    function askRangeBounds(state) {
      const dates = forecastDates();
      const start = dates.findIndex(day => day.date === state.custom);
      const end = dates.findIndex(day => day.date === state.rangeEnd);
      if (start < 0) return { dates, start: -1, end: -1, open: false };
      if (end < 0) return { dates, start, end: start, open: true };
      return { dates, start: Math.min(start, end), end: Math.max(start, end), open: false };
    }
    function askCellClasses(order, weekday, span) {
      const cell = ["ask-cell"];
      const lo = Math.min(span.start, span.end);
      const hi = Math.max(span.start, span.end);
      const inSpan = span.start >= 0 && span.end >= 0 && lo !== hi && order >= lo && order <= hi;
      if (inSpan) {
        cell.push("is-in");
        if (order === lo) cell.push("is-cap-start");
        if (order === hi) cell.push("is-cap-end");
        if (weekday === 0) cell.push("is-row-start");
        if (weekday === 6) cell.push("is-row-end");
      }
      const on = span.start >= 0 && order >= 0 && (order === span.start || (span.end >= 0 && order === span.end && (span.preview || !span.open)));
      return { cell, on };
    }
    function askRangeFaces(state) {
      const span = askRangeBounds(state);
      if (span.start < 0) return { start: "", end: "" };
      const first = span.dates[span.start].date;
      const last = span.dates[span.end].date;
      if (span.open) return { start: first, end: "" };
      return { start: first, end: last };
    }
    function paintAskHover(cal, state, hoverDate) {
      const dates = forecastDates();
      const start = dates.findIndex(day => day.date === state.custom);
      const hover = dates.findIndex(day => day.date === hoverDate);
      const span = hover >= 0 && start >= 0
        ? { start, end: hover, open: true, preview: true }
        : askRangeBounds(state);
      cal.querySelectorAll(".ask-cell").forEach(cell => {
        const paint = askCellClasses(Number(cell.dataset.order), Number(cell.dataset.weekday), span);
        cell.className = paint.cell.join(" ");
        const button = cell.querySelector(".ask-day");
        if (button) button.classList.toggle("is-on", paint.on);
      });
    }
    function askCalHtml(state) {
      const dates = forecastDates();
      const view = state.cal || { year: dates[0].year, month: dates[0].month };
      const allowed = new Map(dates.map(day => [day.iso, day]));
      const span = askRangeBounds(state);
      const today = dates[0].iso;
      const week = "日一二三四五六".split("").map(item => `<span>${item}</span>`).join("");
      const days = askCalendarCells(view).map(date => {
        const iso = askIso(date);
        const inMonth = date.getMonth() + 1 === view.month;
        const day = inMonth ? allowed.get(iso) : null;
        const order = day ? dates.findIndex(item => item.iso === iso) : -1;
        const paint = askCellClasses(order, date.getDay(), span);
        const classes = ["ask-day"];
        if (!inMonth) classes.push("out");
        else if (!day) classes.push("is-off");
        if (iso === today && day) classes.push("is-today");
        if (paint.on) classes.push("is-on");
        const pick = day ? ` data-cal-day="${esc(day.date)}"` : "";
        return `<span class="${paint.cell.join(" ")}" data-order="${order}" data-weekday="${date.getDay()}"><button class="${classes.join(" ")}" type="button"${pick}${day ? "" : " disabled"}>${date.getDate()}</button></span>`;
      }).join("");
      const prev = askMonthOpen(askShiftMonth(view, -1)) ? "" : " disabled";
      const next = askMonthOpen(askShiftMonth(view, 1)) ? "" : " disabled";
      return `<div class="ask-cal" data-ask-cal><div class="ask-cal-head"><button class="ask-cal-nav" type="button" data-cal-move="-1" aria-label="上个月"${prev}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 6l-6 6 6 6"/></svg></button><strong>${view.year}年${view.month}月</strong><button class="ask-cal-nav" type="button" data-cal-move="1" aria-label="下个月"${next}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6l6 6-6 6"/></svg></button></div><div class="ask-week">${week}</div><div class="ask-days">${days}</div></div>`;
    }
    function dayCard(day) {
      return { place: "北京", when: day.date, tone: "cloud", listLabel: day.date, days: [day] };
    }
    function askCustomHtml(scene, state) {
      const customOn = state.picked === "custom";
      const mark = customOn ? askMark(true) : `<span class="ask-num">${scene.ask.options.length + 1}</span>`;
      const disabled = state.done ? " disabled" : "";
      if (scene.ask.date) {
        const faces = askRangeFaces(state);
        const open = state.calOpen && !state.done;
        const pop = open ? askCalHtml(state) : "";
        const start = `<span class="${faces.start ? "" : "is-placeholder"}">${esc(faces.start || "开始日期")}</span>`;
        const end = `<span class="${faces.end ? "" : "is-placeholder"}">${esc(faces.end || "结束日期")}</span>`;
        return `<div class="ask-opt ask-custom${customOn ? " is-on" : ""}">${mark}<button class="ask-trigger${open ? " is-open" : ""}" type="button" data-cal-open aria-expanded="${open ? "true" : "false"}" aria-label="${esc(scene.ask.custom)}"${disabled}><b>${start}<span class="ask-range-sep">-</span>${end}</b>${askDateIcon}</button></div>${pop}`;
      }
      return `<label class="ask-opt ask-custom${customOn ? " is-on" : ""}">${mark}<input class="ask-input" type="text" maxlength="40" placeholder="${esc(scene.ask.custom)}" value="${esc(state.custom || "")}"${disabled}></label>`;
    }
    function askChosen(scene, state) {
      const options = scene.ask.options;
      if (state.picked === "custom") {
        const faces = askRangeFaces(state);
        const label = faces.start ? (faces.end && faces.end !== faces.start ? `${faces.start} - ${faces.end}` : faces.start) : (state.custom || scene.ask.custom);
        return { num: options.length + 1, label };
      }
      const index = options.findIndex(item => item.id === state.picked);
      if (index < 0) return null;
      return { num: index + 1, label: options[index].label };
    }
    function askCardHtml(scene) {
      if (!scene.ask) return "";
      const state = scene.askState || { picked: "", custom: "", done: false, skipped: false };
      if (state.done && !state.skipped) {
        const chosen = askChosen(scene, state);
        const picked = chosen ? `<div class="ask-picked"><span class="ask-num">${chosen.num}</span><span class="ask-label">${esc(chosen.label)}</span></div>` : "";

      const text = host.dataset.tip;
      if (!text) { hoverTip.classList.remove("show"); return; }
      hoverTip.textContent = text;
      hoverTip.classList.add("show");
      const rect = host.getBoundingClientRect();
      const width = hoverTip.offsetWidth;
      let left = rect.left + rect.width / 2 - width / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
      let top = rect.bottom + 6;
      if (top + hoverTip.offsetHeight > window.innerHeight - 8) top = rect.top - hoverTip.offsetHeight - 6;
      hoverTip.style.left = left + "px";
      hoverTip.style.top = top + "px";
    }
    document.addEventListener("mouseover", event => {
      const host = event.target.closest("[data-tip]");
      if (host) placeTip(host);
    });
    document.addEventListener("mouseout", event => {
      const host = event.target.closest("[data-tip]");
      if (!host || host.contains(event.relatedTarget)) return;
      hoverTip.classList.remove("show");
    });
    openSession("cloud");
    mountAiFaces();

  </script>

        { id: "s4", group: "scene", title: "询问查询范围内的指定日期", body: "【前置】打开左侧「询问查询范围内的指定日期」。\n【期望】下周六是 10 月 31 日，在 15 天范围内。回复直接说明这天小雨，最高 10.4°、最低 4.6°，并给出这一天的卡片。\n【当前】点这条对话即可看到指定日期卡片。" },
        { id: "s5", group: "scene", title: "询问查询范围外的指定日期", body: "【前置】打开左侧「询问查询范围外的指定日期」。\n【期望】说明下面有一张推荐操作卡片，询问要看哪一段。未选择时「确认」不可点，选中后序号变成蓝色对勾，「确认」可点。选项是近 15 天、近 7 天，或打开日历选一段日期。输入框是「开始日期 - 结束日期」。先点开始日，悬停时中间连成浅色带，再点结束日。范围外的日期是灰色，不可点。确认后卡片只留下选中的那一项，序号恢复成灰色数字，下面给出这一段预报。跳过只留一句说明。\n【当前】点这条对话即可看到超出范围的说明和推荐卡片。" },
      ];
      const embedded = document.getElementById("revEmbedded");
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (error) { saved = {}; }
      let seed = {};
      try { seed = JSON.parse(embedded.textContent || "{}").edits || {}; } catch (error) { seed = {}; }
      const edits = { ...seed, ...saved };
      let annotationMode = false;
      let tab = "feature";
      let editingId = null;
      let pinTimer = 0;
      const panel = document.getElementById("revPanel");
      const content = document.getElementById("revContent");
      const exportBtn = document.getElementById("revExport");
      const saveStatus = document.getElementById("revSaveStatus");
      const backupBox = document.getElementById("revBackupBox");
      const backupText = document.getElementById("revBackupText");
      const pins = document.getElementById("revPins");
      const esc = value => String(value ?? "").replace(/[&<>"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
      const getEntry = id => ({ ...defaults.find(item => item.id === id), ...(edits[id] || {}) });
      function persist() {
        try {
          localStorage.setItem(key, JSON.stringify(edits));
          saveStatus.textContent = "已在本浏览器保存";
          saveStatus.classList.remove("is-warning");
        } catch (error) {
          saveStatus.textContent = "当前浏览器未能保存，请用备份或导出";
          saveStatus.classList.add("is-warning");
        }
        backupText.value = JSON.stringify({ key, edits }, null, 2);
      }
      function render() {
        content.innerHTML = defaults.filter(item => item.group === tab).map(item => {
          const entry = getEntry(item.id);
          const editing = editingId === item.id;
          const number = item.num ? `<span class="rev-number">${item.num}</span>` : "";
          const body = editing
            ? `<label class="rev-label">标题<input class="rev-input" data-rev-title="${item.id}" value="${esc(entry.title)}"></label><label class="rev-label">说明<textarea class="rev-textarea" data-rev-body="${item.id}">${esc(entry.body)}</textarea></label>`
            : `<p class="rev-body">${esc(entry.body)}</p>`;
          const badge = entry.status ? `<span class="rev-badge${entry.status === "已实现" ? "" : " is-pending"}">${esc(entry.status)}</span>` : "";
          return `<article class="rev-item" id="rev-${item.id}"><div class="rev-item-top">${number}<div class="rev-item-heading"><strong>${esc(entry.title)}</strong>${badge}</div><button type="button" class="rev-edit" data-rev-edit="${item.id}">${editing ? "完成" : "编辑"}</button></div>${body}</article>`;
        }).join("");
      }
      function drawPins() {
        pins.replaceChildren();
        if (!annotationMode) return;
        const specs = [
          ["bg", "1", [".wx"]],
          ["opt", "2", [".ask"]]
        ];
        specs.forEach(([id, num, selectors]) => {
          const target = selectors.map(selector => document.querySelector(selector)).find(node => {
            if (!node) return false;
            const rect = node.getBoundingClientRect();
            const style = getComputedStyle(node);
            return rect.width > 1 && rect.height > 1 && style.display !== "none" && style.visibility !== "hidden";
          });
          if (!target) return;
          const rect = target.getBoundingClientRect();
          const pinSize = 24;
          let left = rect.left;
          let top = rect.top - pinSize - 6;
          if (top < 58) {
            left = rect.left - pinSize - 6;
            top = rect.top + (rect.height - pinSize) / 2;
          }
          const button = document.createElement("button");
          button.className = "rev-pin";
          button.type = "button";
          button.textContent = num;
          button.dataset.revPin = id;
          button.setAttribute("aria-label", "查看功能标注 " + num);
          button.style.left = Math.max(8, Math.min(left, window.innerWidth - pinSize - 8)) + "px";
          button.style.top = Math.max(58, Math.min(top, window.innerHeight - pinSize - 8)) + "px";
          pins.appendChild(button);

      function schedulePins() {
        cancelAnimationFrame(pinTimer);
        pinTimer = requestAnimationFrame(drawPins);
      }
      function setMode(on) {
        annotationMode = on;
        panel.hidden = !on;
        exportBtn.hidden = !on;

        render();
        schedulePins();

      function exportHtml() {
        const clone = document.documentElement.cloneNode(true);
        const node = clone.querySelector("#revEmbedded");
        if (node) node.textContent = JSON.stringify({ key, edits });
        clone.querySelectorAll(".rev-pin").forEach(pin => pin.remove());
        const clonedPanel = clone.querySelector("#revPanel");
        if (clonedPanel) clonedPanel.setAttribute("hidden", "");
        const clonedExport = clone.querySelector("#revExport");
        if (clonedExport) clonedExport.setAttribute("hidden", "");

          button.setAttribute("aria-pressed", String(button.dataset.revMode === "preview"));
        });
        const blob = new Blob(["<!DOCTYPE html>\n" + clone.outerHTML], { type: "text/html" });

        link.href = URL.createObjectURL(blob);

        link.click();
        URL.revokeObjectURL(link.href);
      }
      document.querySelectorAll("[data-rev-mode]").forEach(button => button.addEventListener("click", () => setMode(button.dataset.revMode === "annotation")));

      exportBtn.addEventListener("click", exportHtml);
      document.querySelectorAll("[data-rev-tab]").forEach(button => button.addEventListener("click", () => {
        tab = button.dataset.revTab;
        editingId = null;
        document.querySelectorAll("[data-rev-tab]").forEach(item => item.setAttribute("aria-selected", String(item === button)));
        render();
      }));
      content.addEventListener("click", event => {
        const edit = event.target.closest("[data-rev-edit]");
        if (!edit) return;
        editingId = editingId === edit.dataset.revEdit ? null : edit.dataset.revEdit;
        render();
        content.querySelector(`[data-rev-body="${editingId}"]`)?.focus();
      });
      content.addEventListener("input", event => {
        const title = event.target.closest("[data-rev-title]");
        const body = event.target.closest("[data-rev-body]");
        const id = title?.dataset.revTitle || body?.dataset.revBody;
        if (!id) return;
        edits[id] = { ...(edits[id] || {}), title: getEntry(id).title, body: getEntry(id).body };
        if (title) edits[id].title = title.value;
        if (body) edits[id].body = body.value;
        const heading = document.querySelector(`#rev-${id} strong`);
        if (title && heading) heading.textContent = title.value;
        persist();
      });
      pins.addEventListener("click", event => {
        const pin = event.target.closest("[data-rev-pin]");
        if (!pin) return;
        tab = "feature";
        document.querySelectorAll("[data-rev-tab]").forEach(item => item.setAttribute("aria-selected", String(item.dataset.revTab === "feature")));
        render();
        const card = document.getElementById("rev-" + pin.dataset.revPin);
        card?.scrollIntoView({ block: "nearest" });
        card?.classList.add("is-highlight");
        setTimeout(() => card?.classList.remove("is-highlight"), 1600);
      });
      document.getElementById("revBackupToggle").addEventListener("click", () => {
        const open = backupBox.hidden;
        backupBox.hidden = !open;
        document.getElementById("revBackupToggle").setAttribute("aria-expanded", String(open));
      });
      const stage = document.getElementById("stage");
      if (stage) new MutationObserver(schedulePins).observe(stage, { subtree: true, childList: true, attributes: true });
      window.addEventListener("resize", schedulePins);
      document.addEventListener("scroll", schedulePins, true);
      persist();
      render();
    })();
  </script>
