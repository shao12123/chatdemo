<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>MoreAI Demo 入口</title>
  <style>
    :root {
      --page: #f4f6fb;
      --card: #fff;
      --ink: #1c2330;
      --muted: #667085;
      --line: #e4e7ec;
      --brand: #0a59f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(10, 89, 247, .12), transparent 60%),
        radial-gradient(700px 360px at 90% 0%, rgba(22, 93, 255, .08), transparent 55%),
        var(--page);
    }
    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 80px; }
    .hero { margin-bottom: 28px; }
    .hero h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; letter-spacing: -.02em; }
    .hero p { margin: 0; color: var(--muted); }
    .meta {
      display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 14px; padding: 6px 10px; border: 1px solid var(--line);
      border-radius: 999px; background: rgba(255,255,255,.8); color: var(--muted); font-size: 12px;
    }
    .meta b { color: var(--brand); font-weight: 600; }
    .list { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .card {
      display: block; padding: 18px 20px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--card); text-decoration: none; color: inherit;
      box-shadow: 0 8px 24px rgba(28, 35, 48, .04);
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .card:hover { border-color: #b9cdfb; transform: translateY(-1px); box-shadow: 0 12px 28px rgba(28, 35, 48, .08); }
    .card h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; font-size: 17px; }
    .card .tag { padding: 1px 8px; border-radius: 999px; background: #fff4e5; color: #b54708; font-size: 12px; font-weight: 600; line-height: 20px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .card .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .card .row span { color: var(--brand); font-weight: 600; }
    .hint {
      margin-top: 28px; padding: 14px 16px; border-radius: 12px; background: #eef3ff; color: #3451b2; font-size: 13px;
    }
    .empty { padding: 24px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
    .err { margin-top: 12px; color: #c9372c; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1>MoreAI Demo</h1>
      <p>团队唯一入口。改完推送后，打开这里刷新即可看到最新版；不要再用本地附件当分发渠道。</p>
      <div class="meta" id="versionMeta">正在读取版本…</div>
    </header>
    <ul class="list" id="demoList" aria-live="polite"></ul>
    <p class="hint">多人协作：各做各的 HTML，在 <code>demos.json</code> 登记一条（可选 <code>status</code> 字段标注状态，如「本期暂不开发」）；同一文件请先拉再改。正式说明以仓库默认内容为准。</p>
    <p class="err" id="loadErr" hidden></p>
  </main>
  <script>
    async function loadJson(path) {
      const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(path + " " + res.status);
      return res.json();
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[ch]));
    }
    (async () => {
      const meta = document.getElementById("versionMeta");
      const list = document.getElementById("demoList");
      const err = document.getElementById("loadErr");
      try {
        const [version, catalog] = await Promise.all([loadJson("version.json"), loadJson("demos.json")]);
        meta.innerHTML = `当前版本 <b>${esc(version.version)}</b> · 更新于 ${esc(version.updatedAt)}${version.note ? " · " + esc(version.note) : ""}`;
        const demos = Array.isArray(catalog.demos) ? catalog.demos : [];
        if (!demos.length) {
          list.innerHTML = `<li class="empty">还没有登记 demo。在 demos.json 里加一条即可。</li>`;
          return;
        }
        list.innerHTML = demos.map(demo => `
          <li>
            <a class="card" href="${esc(demo.file)}" target="_blank" rel="noopener noreferrer">
              <h2>${esc(demo.title || demo.id)}${demo.status ? `<span class="tag">${esc(demo.status)}</span>` : ""}</h2>
              <p>${esc(demo.summary || "")}</p>
              <div class="row"><span>打开 →</span><em>${esc(demo.owner || "未署名")}</em></div>
            </a>
          </li>`).join("");
      } catch (e) {
        meta.textContent = "版本读取失败";
        err.hidden = false;
        err.textContent = "入口页需要通过 http(s) 打开（GitHub Pages 或本地静态服务），不要用直接拖进浏览器的旧副本。";
      }
    })();
  </script>
</body>
</html>
