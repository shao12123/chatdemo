# 对话目录公共组件 PRD

| 项目 | 内容 |
|---|---|
| 文档状态 | 产品稿 · 交互以 Demo 为准；第 8 节待确认项已给默认方案 |
| 版本 | v0.8 · 2026-11-24（PRD 只保留产品功能 / 逻辑 / 交互 / UI） |
| 交互 Demo | [对话目录.html](对话目录.html)（提问 / 消息 / 文档 / 右侧互斥 / 不足两条 / **很多条**） |
| Agent TOOL | **不需要**（导航控件，不改触发） |
| 适用读者 | 产品、设计、开发、测试 |
| 本文写什么 | **功能、产品逻辑、交互、UI**。不写接口、模块拆分、埋点、实现任务拆分 |

> 开发依据：**Demo + 本文**。业务 PRD **只声明本场景挂哪些锚点**，控件行为以本文为准。第 8 节「默认方案」先按默认。

---

## 1. 背景与目标

### 1.1 现状
长对话、长回复、长文档需要快速跳转。线上 / Demo 已有同一套右缘「短横线 → 悬停展开列表」控件，但：
- 各业务 PRD 只写「复用现有组件」，开发缺少统一规格；
- 提问目录、消息目录、文档目录易被做成三套 UI。

### 1.2 目标
- **一个控件、三种用法**：提问目录、消息目录、文档目录共用 `createOutline`（或工程等价实现）。
- 业务只提供 `items` + 锚点节点；壳层交互、视觉、动效全站一致。
- Demo 可单独验收；正式工程可抽成公共模块。

### 1.3 成功标准
- ≥2 条锚点时出现；1 条及以下不出现。
- 悬停展开、点击跳转、滚动跟当前项、离开收起行为与 Demo 一致。
- 提问目录在右侧文档台打开时隐藏；文档目录仅在文档正文态显示。
- `prefers-reduced-motion: reduce` 时关闭展开 / 跳转动画。

---

## 2. 范围

### 2.1 本期做
1. 统一控件：收起轨（短横线）+ 展开卡（列表）+ 当前态 + 跳转高亮。
2. 三种适配模式：提问（peek 开）、消息（peek 按业务）、文档（peek 关）。
3. 出现 / 隐藏规则、与右侧展示区互斥。
4. 数据适配契约（`items` / `nodeFor` / 配置项）。
5. 深浅色：横线与文字用中性色；高亮闪用品牌色透明度（见 5.4）。
6. 无障碍：列表行为按钮、`aria-label`；键盘 focus 可展开。

### 2.2 Demo 与工程
| | Demo `对话目录.html` | 工程 |
|---|---|---|
| 交互 / 视觉 | 可点验收 | 对齐本文与 Demo |
| 业务锚点 | 写死示例块 | 各业务注入 items |
| 右侧文档台 | 用「模拟右侧打开」case 演示互斥 | 接真实 `with-doc` / 文档态 |

### 2.3 本期不做
- 目录内搜索、拖拽排序、多级树（文档目录本期**不分层级**，一章一条）。
- 触控长按专用手势（沿用 pointer 悬停；窄屏专项另案）。
- Agent TOOL / 后端 Schema（无）。
- 把业务文案生成规则写进本控件（如总结卡 `data-sum-sec` 标题映射仍在业务 PRD）。

---

## 3. 场景（三种用法）

| 用法 | 宿主 | 列表内容 | peek | 典型产品 |
|---|---|---|---|---|
| 提问目录 | 对话列右缘 | 每条用户消息标题；可选 AI 首句作副文 | **开** | 课程论文、行程多轮 |
| 消息目录 | 对话列右缘 | 长回复内可跳转块（导语、报告卡、提示等） | 业务定（总结建议开） | 文档分析与总结、高频推送 |
| 文档目录 | 右侧文档台正文区右缘 | 章节标题（h3/h4 等） | **关** | 课程论文文档台 |

同一时刻对话列上**至多一个**目录实例可见（提问 / 消息按产品约定二选一或合并 items；打开右侧文档台时对话列目录隐藏）。

---

## 4. 交互流程

### 4.1 出现与隐藏
| 条件 | 行为 |
|---|---|
| `items.length >= 2`（`OUTLINE_MIN`） | 显示轨（`.qnav.show`） |
| `items.length < 2` | 隐藏并关闭展开 |
| 提问 / 消息目录 + 右侧展示区打开 | **隐藏**对话列目录 |
| 文档目录 + 非文档正文（空、对比、任务等） | **隐藏** |
| 生成中 / 新增锚点 | 仍显示；新横线可播 `is-new` 入场 |

### 4.2 收起态（轨）
- 位置：宿主右缘，竖直居中（`top: 50%` + translate）。
- 一条锚点一条短横线；间距固定 **10px**（`OUTLINE_PITCH`）。
- **当前项**：横线更长（约 16px）、颜色更深（`#1f2329`）；其余约 8px、`#c9cdd4`。
- 滚动宿主内容时，当前项随视口同步，轨平滑平移。

### 4.2.1 条数特别多时（强制 · 对齐 Cursor 轨手感）
条目可以远多于一屏，**禁止**把全部短横线无限制堆满右缘。配置：`denseRail: true`（Demo「很多条」开启）。

| 规则 | 说明 |
|---|---|
| 短横线可见上限 | `min(条目数, OUTLINE_MAX=18, floor(可用高度 / 10px))`；可用高度约为宿主高 − 48px（原 30 对 1440 过高） |
| 溢出怎么表现 | 轨内 `.qnav-track` **整体 translateY**，只露出一段窗口；不出现第二列、不缩小间距塞下全部 |
| 当前项跟滚 | 整段短横线轨**固定**在对话列垂直居中，不随滚动贴顶/贴底；滚动只平移轨内 track，让当前项落在满窗约 18 根里 |
| **边缘平移** | 指针在轨可见窗口**上/下沿约 24px** 热区时持续拨轨：上沿送入更早条目，下沿送入更晚条目；离开热区停止；宿主滚动改当前项时清零手动拨动 |
| **悬停鱼眼** | 收起轨上，指针附近横线**只加长、不加大上下间距**（避免窗口被撑开后只剩两三根）；离轨恢复。减弱动效时不做鱼眼。贴顶/贴底时仍保持满窗可见条数 |
| 点轨跳转 | 点击短横线 → 与点标题行相同，跳到锚点 |
| 展开标题卡 | **保留（方案 A）**：轨上停留约 **240ms** 后再展开；移入卡立即保持展开。**展开卡最多约 12 行高**（`12 × ~30px + 内边距`），超出卡内滚 |

验收：Demo「很多条」——短横线 ≤18；展开卡视觉高度约 12 行；鱼眼 / 贴顶底平移；卡内可滚到末条。

### 4.3 展开态（卡）
1. 指针进入轨：普通模式**立即展开**；`denseRail` 约 **240ms** 后再展开。指针进入卡 → 立即展开 / 保持展开。
2. 卡片从右侧 clip 展开，宽 **280px**；`top` 以**当前轨中心**为基准垂直居中夹紧，避免总贴顶。
3. 打开时列表滚到让当前行居中。
4. 卡片高度：`min(内容高, 宿主剩余, **约 12 行**)`；**条目再多只在卡内滚动**（藏滚动条），1440 小屏也不顶满。
5. 指针离开轨与卡约 **150ms** 后收起；focus 在卡内时保持展开。

### 4.4 peek（仅 peek 模式）
- 指针在某一行停留约 **80ms**：该行 `is-peek`。
- 主文最多 1 行（提问）或按业务；副文（`answer`）灰字最多 **2** 行，左对齐展开。
- 无副文可不渲染 peek 区；提问场景无回复时可显示「生成中…」（业务填入 `answer`）。
- 文档目录 **peek:false**：标题可换行完整显示，悬停行不展开副文。

### 4.5 点击跳转
1. 点击行 → `pinned = key`，设为当前。
2. 宿主平滑滚动，使锚点距视口顶保留 `offset`（对话约 24px，文档约 16px）。
3. 锚点节点加 `qnav-flash` 约 1s。
4. 用户滚轮 / 触控 / 指针按下滚动区 → 清除 `pinned`，恢复滚动跟当前。

### 4.6 减弱动效
`prefers-reduced-motion: reduce`：关闭轨/卡 transition、`is-new`、flash 动画；跳转可用 `auto`。

## 5. 组件与样式

### 5.1 结构
```
nav.qnav[.show][.open][.no-peek]
  .qnav-rail > .qnav-view > .qnav-track > i[data-qi][.is-current][.is-new]
  .qnav-card > button.qnav-row[data-qi][.is-current][.is-peek]
                 .qnav-text > .qnav-q + (.qnav-a-wrap > .qnav-a > span)?
                 i.qnav-dash
```

### 5.2 尺寸与视觉（浅色）
| 项 | 值 |
|---|---|
| 轨容器宽 | 28px；右偏移约 14px |
| 横线 | 默认 8×2，当前 16×2；圆角 1；间距 10 |
| 卡片 | 宽 280；圆角 12；白底；边 `#eceef2`；双层浅影；**最大高度约 12 行**（`OUTLINE_CARD_MAX`） |
| 短横线窗口 | 最多 **18** 条（`OUTLINE_MAX`），再受宿主高度限制 |
| 行 | 字 12/20；默认右对齐；当前字重 600、色 `#1f2329`；默认字色 `#646a73` |
| peek 底 | `#f5f6f7`；副文 `#8f959e` |
| flash | 品牌色约 16% 透明光晕 1s |

深色：横线 / 字色改走全站 text token；卡片底与边对齐深色容器规范（`#191A1D` 系），工程实现时 token 化，禁止业务写死多套。

### 5.3 文案规则
- 提问标题：用户首行；空则文件名 / 引用 /「（空消息）」。
- 副文：对应回复纯文本首句；截断由 CSS line-clamp。
- 文档标题：章节原文；有序号保留，无则不强加。
- 消息目录标题：由业务 PRD 映射表决定（如总结 `data-sum-sec`）。

### 5.4 与悬停气泡
目录行**不使用**全站 `data-tip` 气泡；展开卡即说明。

---

## 6. 产品规则与边界

### 6.1 三种目录（同一控件）
| 模式 | 何时出现 | 列表内容 | Peek |
|---|---|---|---|
| 提问目录 | ≥2 条用户提问锚点，且右侧未占文档正文 | 用户问 + 可选副文 | 有（副文约 2 行） |
| 消息目录 | 长单答等多块锚点场景 | 导语 / 报告块等 | 按业务 |
| 文档目录 | 右侧展示文档正文时 | 章节标题 | 无 |

业务侧只负责：提供稳定锚点与标题；**不要**自造另一套圆点目录 / 左侧 TOC 替代本控件；**不要**给目录行加悬停气泡。

### 6.2 互斥
| 状态 | 提问 / 消息目录 | 文档目录 |
|---|---|---|
| 仅对话 | 可显示 | 隐藏 |
| 右侧文档正文 | 隐藏 | 可显示 |
| 右侧对比 / 任务 / 空 | 隐藏 | 隐藏 |

变体消息（重新生成多版本）：只收录**当前展示**那一版对应的用户问。

### 6.3 很多条
- 右缘只显示一段短横线窗口；当前项居中或贴边。
- 边缘平移 + 悬停鱼眼（局部放大，不是整列变标题）。
- 停留后可展开标题卡；卡内可滚完全部。
- 减弱动效：无展开动画、flash、鱼眼。

### 6.4 边界
| 情况 | 处理 |
|---|---|
| 不足 2 条锚点 | 不显示轨 |
| 锚点暂时找不到 | 跳过该项；有节点的照常 |
| 标题极长 | 提问单行省略；文档可换行 |
| 快速划过轨 | 离开延迟约 150ms，避免闪烁 |
| 与标注侧栏并存 | 文档目录可右移让位 |

## 7. 验收标准

### 7.1 功能
- [ ] 1 条锚点不显示；加到 2 条后显示。
- [ ] 滚动时当前横线 / 行跟随。
- [ ] 悬停展开，点击跳转并 flash，离开收起。
- [ ] 提问 peek：副文 2 行内；文档无 peek。
- [ ] 右侧打开文档时提问目录隐藏；文档目录可见。
- [ ] 很多条：轨窗口上限；边缘平移与鱼眼；展开后卡内可滚完全部。
- [ ] 减弱动效下无展开动画、flash、鱼眼。

### 7.2 视觉
- [ ] 展开卡在轨中心附近，不无故贴顶。
- [ ] 当前横线更长更深；样式对齐 Demo。
- [ ] 很多条时右缘只有一段横线窗口；鱼眼仅局部放大。

### 7.3 用例（Demo）
| # | Case | 期望 |
|---|---|---|
| 1 | 提问目录 | ≥2 问；peek；跳转用户气泡 |
| 2 | 消息目录 | 多块锚点跳转 |
| 3 | 文档目录 | 无 peek；章节跳转 |
| 4 | 右侧互斥 | 打开后提问轨消失 |
| 5 | 不足两条 | 无轨 |
| 6 | 很多条 | ≥35 问；短横线窗口；鱼眼；贴顶/底平移；卡内滚完全部 |

## 8. 已确认与待确认

| # | 问题 | 产品结论 | 状态 |
|---|---|---|---|
| Q1 | 提问与消息目录同时 | 同一会话优先提问目录；长单答用消息目录；不同时两套轨 | 默认方案 |
| Q2 | 展开是否延迟 | 普通立即开；很多条模式约 240ms 再开 | 已确认 |
| Q3 | 深色 token | 复用全站，不另开色表 | 默认方案 |
| Q4 | 触控无 hover | 本期点击轨切换开合；窄屏专项另案 | 默认方案 |

</script>
  <script>
    const source = document.getElementById("prdSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);
    document.getElementById("doc").innerHTML = html;
    document.getElementById("toc").innerHTML = toc.map(t => `<a class="l${t.level}" href="#${t.id}">${esc(t.text)}</a>`).join("");
    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    function downloadText(text, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    }
    document.getElementById("copyMd").addEventListener("click", () => {
      const done = () => notify("已复制 Markdown，可直接发给 AGENT");
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = source;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用「下载 .md」"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(source).then(done).catch(fallback);
      else fallback();
    });
    document.getElementById("downloadMd").addEventListener("click", () => {
      downloadText(source, "对话目录-PRD.md");
      notify("已开始下载 PRD.md");
    });
    document.getElementById("downloadDemo").addEventListener("click", async () => {
      const name = "对话目录.html";
      try {
        const res = await fetch(name);
        if (!res.ok) throw new Error(String(res.status));
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
        notify("已开始下载 Demo.html");
      } catch (e) {
        const link = document.createElement("a");
        link.href = name;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        notify("已尝试下载 Demo.html");
      }
    });
    const links = [...document.querySelectorAll("nav.toc a")];
    const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1)));
    window.addEventListener("scroll", () => {
      let on = 0;
      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
      links.forEach((a, k) => a.classList.toggle("on", k === on));
    }, { passive: true });
  </script>
