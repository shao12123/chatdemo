<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>MoreAI · 对话</title>
  <link rel="preconnect" href="https://fonts.cdnfonts.com" />
  <link href="https://fonts.cdnfonts.com/css/harmonyos-sans" rel="stylesheet" />
  <style>
    :root {
      --page: #f6f7fb;
      --card: #ffffff;
      --card-line: #f1f5f9;
      --brand: #0a59f7;
      --brand-deep: #165dff;
      --brand-hover: #1e61ea;
      --brand-active: #0e4ed9;
      --ink: #1e293b;
      --nav: #5e6063;
      --secondary: #5e6063;
      --muted: #858e9c;
      --label: #858e9c;
      --placeholder: #828a99;
      --line: #f1f5f9;
      --chip: rgba(9, 11, 14, 0.04);
      --chip-line: #e9ebee;
      --hover: #f3f7ff;
      --brand-soft: #f3f7ff;
      --send: #165dff;
      --sidebar: linear-gradient(180deg, rgba(248,250,255,.8) 0%, rgba(234,242,255,.8) 54%, rgba(234,242,255,.8) 61%, rgba(243,243,255,.8) 100%);
      --stage: var(--page);
      --shadow: 0 1px 2px rgba(0,0,0,.05);
      --font: "HarmonyOS Sans SC", "HarmonyOS Sans", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: var(--font); color: var(--ink); background: var(--page); letter-spacing: 0; }
    button, textarea { font-family: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .app { display: flex; height: 100dvh; min-height: 640px; overflow: hidden; }
    .sidebar { width: 210px; flex: none; display: flex; flex-direction: column; background: var(--sidebar); color: var(--nav); }
    .sidebar.collapsed { width: 64px; }
    .org { display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 16px 8px 8px; }
    .sidebar.collapsed .org { justify-content: center; padding: 8px 4px; }
    .org-mark { width: 21px; height: 21px; flex: none; border-radius: 5px; background: #3370ff; color: #fff; font-size: 12px; line-height: 21px; text-align: center; font-weight: 500; }
    .org-name { min-width: 0; flex: 1; font-size: 14px; line-height: 24px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 8px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: #e5edff; color: var(--brand); }
    .nav { padding: 8px; }
    .nav ul, .projects ul, .history ul { list-style: none; margin: 0; padding: 0; }
    .nav-item, .row { display: flex; align-items: center; gap: 8px; height: 34px; width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; color: var(--nav); font-size: 14px; line-height: 22px; text-align: left; }
    .nav-item span, .row span, .session-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item:hover, .row:hover, .session:hover { background: var(--hover); color: var(--brand); }
    .nav-item.active { background: var(--chip); color: var(--brand); }
    .sidebar.collapsed .nav-item { width: 36px; height: 36px; justify-content: center; padding: 0; margin: 0 auto; }
    .sidebar.collapsed .nav-item span, .sidebar.collapsed .section-label, .sidebar.collapsed .projects, .sidebar.collapsed .user-meta, .sidebar.collapsed .org-name { display: none; }
    .section-label { padding: 6px 12px; font-size: 12px; line-height: 18px; color: var(--muted); }
    .projects { min-height: 0; flex: 1; overflow: auto; padding: 0 8px 16px; }
    .user { display: flex; align-items: center; gap: 8px; margin: auto 16px 22px; padding: 6px; border: 0; background: transparent; border-radius: 8px; text-align: left; }
    .user:hover { background: rgba(10,89,247,.06); }
    .avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; background: #d6e3ff; color: var(--brand); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
    .user-meta { min-width: 0; }
    .user-meta strong, .user-meta small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-meta strong { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); }
    .user-meta small { font-size: 11px; line-height: 16px; color: var(--muted); }
    .stage { position: relative; min-width: 0; flex: 1; display: flex; gap: 8px; padding: 8px 8px 8px 0; background: var(--stage); }
    .card { min-width: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: #fff; box-shadow: var(--shadow); }
    .history { width: 260px; flex: none; }
    .history-head { padding: 16px 16px 0; }
    .history-head h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    .new-chat { display: none; align-items: center; gap: 8px; height: 34px; width: calc(100% - 24px); margin: 12px 12px 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; line-height: 22px; padding: 0 12px; }
    .new-chat.show { display: flex; }
    .new-chat:hover { background: var(--hover); color: var(--brand); }
    .history-list { min-height: 0; flex: 1; overflow: auto; padding: 8px 12px 12px; }
    .session { position: relative; display: flex; align-items: center; height: 34px; border-radius: 8px; color: var(--muted); }
    .session.active { background: var(--chip); color: var(--brand); }
    .session-title { flex: 1; height: 34px; border: 0; background: transparent; color: inherit; text-align: left; padding: 6px 12px; font-size: 14px; line-height: 22px; }
    .more { display: none; width: 22px; height: 22px; margin-right: 6px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); }
    .session:hover .more, .session:focus-within .more { display: inline-flex; align-items: center; justify-content: center; }
    .more:hover { background: rgba(0,0,0,.06); }
    .menu { position: absolute; right: 8px; top: 32px; z-index: 5; width: 128px; padding: 8px 15px; border: 0; border-radius: 9px; background: #fff; box-shadow: 0 4px 12px rgba(22,37,67,.16); }
    .menu button { display: flex; align-items: center; width: 100%; height: 28px; border: 0; background: transparent; border-radius: 5px; padding: 0 4px; font-size: 12px; line-height: 18px; color: var(--ink); }
    .menu button.danger { color: #ff3b30; }
    .menu button:hover { background: #f3f3f3; }
    .main { position: relative; flex: 1; }
    .welcome, .thread { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .welcome { align-items: center; justify-content: center; padding: 64px 24px; }
    .welcome-inner { width: min(736px, 100%); display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .welcome h1 { margin: 0; font-size: 20px; line-height: 29px; font-weight: 600; letter-spacing: 0; text-align: center; }
    .prompt-fill { width: min(736px, 100%); min-height: 36px; border: 1px solid #e6e8ec; border-radius: 8px; background: #fff; color: var(--ink); text-align: left; padding: 8px 12px; font-size: 14px; line-height: 22px; }
    .prompt-fill:hover { border-color: #b9d0ff; background: #f3f7ff; color: var(--brand); }
    .thread { display: none; }
    .main.chatting .welcome { display: none; }
    .main.chatting .thread { display: flex; }
    .messages { flex: 1; overflow: auto; padding: 28px 24px 24px; }
    .messages-inner { width: min(640px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .artifact { position: relative; align-self: flex-start; display: flex; align-items: center; width: 300px; max-width: 100%; height: 56px; border: 1px solid #eef0f3; border-radius: 12px; background: #fff; overflow: hidden; }
    .artifact-open { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; height: 100%; padding: 9px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
    .artifact-thumb { position: relative; width: 68px; height: 38px; flex: none; overflow: hidden; border-radius: 6px; border: 1px solid #eef0f3; background: #fff; }
    .artifact-sheet { position: absolute; left: 0; top: 0; width: 272px; padding: 10px 12px 0; transform: scale(0.25); transform-origin: top left; color: #1f2329; pointer-events: none; }
    .artifact-sheet em { display: block; color: #8f959e; font-size: 12px; line-height: 16px; font-style: normal; }
    .artifact-sheet strong { display: block; margin: 2px 0 6px; font-size: 18px; line-height: 24px; font-weight: 650; }
    .artifact-sheet span { display: block; margin: 0 0 4px; color: #3a3d42; font-size: 12px; line-height: 18px; }
    .artifact-copy { min-width: 0; flex: 1; overflow: hidden; }
    .artifact-copy b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #1e293b; font-size: 14px; line-height: 20px; font-weight: 500; }
    .artifact-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(0, 0, 0, 0.4); font-size: 12px; line-height: 18px; font-weight: 400; }
    .artifact-actions { display: none; align-items: center; gap: 2px; padding-right: 8px; flex: none; }
    .artifact:hover { background: rgba(9, 11, 14, 0.04); }
    .artifact:hover .artifact-actions { display: flex; }
    .artifact.on,
    .artifact.on:hover { background: #f3f7ff; border-color: #3370ff; }
    .artifact-actions button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #5e6063; display: grid; place-items: center; padding: 0; }
    .artifact-actions button:hover { background: rgba(9, 11, 14, 0.04); color: #5e6063; }
    .doc-unfold { position: absolute; right: 15px; top: 16px; z-index: 3; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #3c4043; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .doc-unfold[hidden] { display: none; }
    .doc-unfold:hover { color: var(--ink); background: rgba(0,0,0,.06); }
    .doc-empty { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .doc-empty.show { display: flex; }
    .doc-empty h3 { margin: 16px 0 6px; font-size: 16px; line-height: 24px; font-weight: 600; }
    .doc-empty p { margin: 0; max-width: 240px; font-size: 13px; line-height: 20px; color: var(--muted); }
    .doc.is-empty .doc-article, .doc.is-empty .compare-bar, .doc.is-empty .changes-toggle { display: none; }
    .msg { max-width: 86%; font-size: 14px; line-height: 22px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #f3f7ff; color: var(--ink); border-radius: 12px; padding: 10px 14px; }
    .msg.assistant { align-self: flex-start; color: var(--ink); padding: 2px 0; }
    .msg.rich { max-width: min(560px, 100%); white-space: normal; }
    .msg.rich p { margin: 0 0 10px; }
    .msg.rich h4 { margin: 12px 0 6px; font-size: 13px; line-height: 20px; font-weight: 650; color: #667085; }
    .msg.rich ul, .msg.rich ol { margin: 0 0 10px; padding-left: 18px; }
    .msg.rich li { margin: 4px 0; }
    .msg.rich li.pick { font-weight: 650; }
    .msg.rich .tag { display: inline-block; margin-left: 8px; height: 18px; padding: 0 6px; border-radius: 99px; background: #e7f8ef; color: #067647; font-size: 12px; line-height: 18px; font-weight: 600; vertical-align: 1px; }
    .msg.rich table { width: 100%; margin: 0 0 10px; border-collapse: collapse; font-size: 14px; line-height: 22px; }
    .msg.rich th, .msg.rich td { border: 1px solid #e6e8ec; padding: 8px 10px; text-align: left; vertical-align: middle; }
    .msg.rich th { background: #f7f8fa; font-size: 12px; line-height: 18px; font-weight: 600; color: #667085; }
    .msg.rich tr.pick td { background: #f4fbf7; font-weight: 650; }
    .revise-card { display: flex; flex-direction: column; gap: 8px; width: min(440px, 100%); }
    .revise-lead { margin: 0; font-size: 14px; line-height: 22px; font-weight: 650; }
    .revise-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .revise-cell { background: #f6f8fb; border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .revise-cell > span { display: block; margin-bottom: 4px; color: #667085; font-size: 12px; line-height: 18px; }
    .revise-cell > b { display: block; font-size: 13px; line-height: 20px; font-weight: 600; }
    .revise-plans { display: flex; flex-direction: column; }
    .revise-plan { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; padding: 5px 0; font-size: 13px; line-height: 20px; }
    .revise-plan.on { font-weight: 650; }
    .revise-more { display: none; flex-direction: column; }
    .revise-cell.plans.open .revise-more { display: flex; }
    .revise-more .revise-plan { border-top: 1px solid #e6ebf3; }
    .revise-fold { display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 2px; border: 0; border-top: 1px solid #e6ebf3; background: transparent; padding: 6px 0 1px; color: #667085; font-size: 12px; line-height: 18px; text-align: left; }
    .revise-fold svg { flex: none; transition: transform .15s ease; }
    .revise-cell.plans.open .revise-fold svg { transform: rotate(180deg); }
    .revise-plan i { flex: none; height: 18px; padding: 0 6px; border-radius: 99px; background: #e7f8ef; color: #067647; font-style: normal; font-size: 12px; line-height: 18px; font-weight: 600; }
    .revise-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .revise-chips b { height: 24px; padding: 0 8px; border-radius: 8px; background: #fff; color: #245bdb; font-size: 12px; line-height: 24px; font-weight: 600; }
    .revise-grid.single { grid-template-columns: 1fr; }
    .stream-caret { display: inline-block; width: 1.5px; height: .9em; margin-left: 1px; background: #245bdb; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
    .composer-wrap { width: min(736px, 100%); }

    .composer { position: relative; display: flex; align-items: center; gap: 2px; width: 100%; padding: 12px; border: 1px solid #f0f0f0; border-radius: 20px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
    .composer:focus-within { border-color: var(--brand); }
    textarea { flex: 1; min-width: 0; min-height: 22px; max-height: 88px; border: 0; resize: none; outline: none; background: transparent; color: var(--ink); font-size: 14px; line-height: 22px; padding: 0 8px; }
    textarea::placeholder { color: var(--muted); }
    textarea:disabled { color: var(--muted); }
    .actions { display: flex; align-items: center; gap: 8px; height: 32px; flex: none; }
    .plus, .send { border: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--ink); }
    .plus { width: 28px; height: 28px; border-radius: 6px; }
    .plus:hover, .plus.open { background: rgba(0,0,0,.06); }
    .send { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-deep); color: #fff; }
    .send:hover { background: var(--brand-hover); }
    .send:active { background: var(--brand-active); }
    .send:disabled { opacity: .5; cursor: default; pointer-events: none; }
    .pop { position: absolute; z-index: 6; background: #fff; border: .5px solid #dcdcdc; border-radius: 16px; box-shadow: 0 3px 7px rgba(0,0,0,.05), 0 8px 5px rgba(0,0,0,.06), 0 5px 2.5px rgba(0,0,0,.1); }
    .plus-menu { left: 12px; bottom: 52px; min-width: 166px; padding: 10px; display: none; }
    .plus-menu.show { display: block; }
    .plus-menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; border: 0; background: transparent; border-radius: 6px; padding: 3px 8px; font-size: 14px; line-height: 22px; color: var(--ink); text-align: left; }
    .plus-menu button:hover { background: rgba(0,0,0,.06); }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #090b0e; color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 20px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
    .toast.show { opacity: 1; }
    .modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(15,23,42,.28); }
    .modal.show { display: flex; }
    .modal-card { width: min(480px, calc(100% - 32px)); background: #fff; border-radius: 16px; padding: 28px 28px 24px; box-shadow: 0 12px 40px rgba(15,23,42,.18); }
    .modal-card h3 { margin: 0 0 16px; font-size: 20px; line-height: 28px; font-weight: 600; }
    .modal-card p { margin: 0 0 28px; font-size: 16px; line-height: 24px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .modal-actions button { height: 36px; min-width: 88px; border-radius: 8px; padding: 0 16px; font-size: 14px; line-height: 22px; }
    #restoreCancel { border: 1px solid #e3e5e8; background: #fff; color: var(--ink); }
    #restoreOk { border: 0; background: var(--brand); color: #fff; }
    #restoreOk:hover { background: var(--brand-hover); }

    .pick-card { align-self: flex-start; width: min(440px, 100%); border: 1px solid #f0f0f0; border-radius: 16px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.04); padding: 14px; }
    .steps { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .steps i { width: 8px; height: 8px; border-radius: 50%; background: #e3e5e8; }
    .steps i.on { background: var(--brand); }
    .steps i.got { background: #b9d0ff; }
    .steps b { flex: 1; height: 1px; background: #eceef2; }
    .pick-card h3 { margin: 0 0 10px; font-size: 14px; line-height: 22px; font-weight: 600; }
    .choice { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; margin-bottom: 6px; border: 1px solid #eceff3; border-radius: 8px; background: #fff; color: var(--ink); text-align: left; padding: 6px 10px; font-size: 14px; line-height: 22px; }
    .choice .radio { width: 14px; height: 14px; border: 1.5px solid #c5c8ce; border-radius: 50%; flex: none; }
    .choice.selected { border-color: #b9d0ff; background: #f3f7ff; color: var(--brand); }
    .choice.selected .radio { border: 4px solid var(--brand); }
    .card-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .card-foot button { height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--nav); padding: 0 12px; font-size: 14px; }
    .card-foot button.primary { background: var(--brand); color: #fff; }
    .card-foot button.primary:disabled { background: #d7e4ff; color: #fff; opacity: 1; cursor: default; }
    .cmp-hint { margin: 0 0 8px; color: #8b93a6; font-size: 12px; line-height: 18px; }
    .card-foot button:disabled { color: #c5c8ce; }
    .locked-row { display: flex; justify-content: space-between; gap: 12px; min-height: 32px; align-items: center; font-size: 13px; line-height: 20px; }
    .locked-row span { color: var(--muted); }
    .locked-row b { font-weight: 600; }
    .pick-card.locked { position: relative; padding-right: 36px; }
    .custom-box { display: none; margin: 0 0 6px; }
    .custom-box.show { display: block; }
    .custom-box input { width: 100%; height: 36px; border: 1px solid #eceff3; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; }
    .follow-send { width: 100%; margin: 0 0 8px; }
    .follow-send[hidden] { display: none; }
    .next-chip { align-self: flex-start; max-width: 100%; min-height: 36px; border: 1px solid #e6e8ec; border-radius: 8px; background: #fff; color: var(--ink); padding: 8px 12px; font-size: 14px; line-height: 22px; text-align: left; }
    .next-chip:hover { border-color: #b9d0ff; background: #f3f7ff; color: var(--brand); }
    .think { align-self: flex-start; display: flex; flex-direction: column; gap: 8px; max-width: min(560px, 100%); color: #5d6578; }
    .think-row { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; color: inherit; font-size: 14px; line-height: 22px; text-align: left; }
    .dot-ring { width: 14px; height: 14px; flex: none; border: 1.5px solid #d8dee8; border-top-color: #245bdb; border-radius: 50%; animation: spin .7s linear infinite; }
    .think.done .dot-ring { animation: none; border-color: #c5cad6; border-top-color: #c5cad6; }
    .think-tag { display: inline-flex; align-items: center; width: fit-content; background: #eceff5; color: #667085; border-radius: 8px; padding: 4px 8px; font-size: 12px; line-height: 18px; }
    .dots { display: flex; gap: 4px; padding: 2px 10px; }
    .dots i { width: 4px; height: 4px; border-radius: 50%; background: #b0b7c6; animation: blink 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .think-list { margin: 0; padding: 0; list-style: none; color: #5d6578; font-size: 14px; line-height: 22px; }
    .think:not(.open):not(.done) .think-list { display: none; }
    .think-head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; }
    .paper-think .think-row { display: flex; align-items: center; gap: 12px; margin-left: -8px; }
    .think-name { color: #1c2330; font-size: 15px; line-height: 22px; font-weight: 600; }
    .think-status { display: flex; align-items: center; gap: 4px; min-height: 20px; color: #98a2b3; font-size: 13px; line-height: 20px; }
    .think-status b { font-weight: 400; }
    .think-time { color: #98a2b3; font-size: 13px; line-height: 20px; }
    .think-shine { color: #98a2b3; }
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {

        { key: "h-title", kind: "h2", text: "生成式 AI 会怎样改变初级程序员的代码评审" },
        { key: "h-abs", kind: "h", text: "一、题目与摘要" },
        { key: "p-abs", kind: "p", text: `摘要：本文讨论${q}。材料限于「${mat}」。成稿目标是${depth}。代码评审一直承担两件事：发现缺陷，以及把设计惯例交给经验较少的工程师。生成式 AI 先进入了写代码这一步。初级程序员越来越常把模型给出的实现放进差异里，再请别人评审。本文据此认为，评审的中心已经从自己查找缺陷，转到确认模型没有写错。` },
        { key: "p-abs2", kind: "p", text: "文章回顾代码评审研究，以及程序员如何使用代码生成工具的经验研究，把两类文献对照起来读。对照之后提出三个变化：评审对象从人写的差异变成人和模型一起写出的差异；改动说明必须证明作者理解这段代码；初级程序员的困难从写不出来，变成不敢删除模型给出的代码。关键词：代码评审；生成式 AI；初级程序员；GitHub Copilot。" },
        { key: "h-intro", kind: "h", text: "二、引言" },
        { key: "p-intro", kind: "p", text: `研究问题写成：${q}。现代代码评审通常发生在合并之前。作者提交一小段改动，评审者阅读差异、留下评论，再决定是否合并。对刚入行的程序员，评审还是学习代码库惯例的主要场合。生成式 AI 改变的是这段差异的来源：其中一部分不再由作者逐行写出，而是由模型生成后被接受、修改或原样保留。` },
        { key: "p-intro2", kind: "p", text: "工具厂商和部分生产率研究倾向于把这个变化讲成效率故事。程序员完成任务更快，于是评审也被假定一起变快、变少。课程讨论里常见的说法更进一步：初级程序员既然能靠模型写出能运行的代码，就不必再在评审里练习如何发现缺陷。本文把这个说法当成需要检验的主张，而不是前提。" },
        { key: "p-intro3", kind: "p", text: `检验材料限定为「${mat}」。不使用公司内部的评审记录，也不把工具博客里的成功案例当成测量结果。文章要回答的是：现有公开研究是否已经足够支持「初级程序员的评审行为已经改变」。成稿形式是${depth}。因此本文做的是文献对照，不是一次新的田野调查。` },
        { key: "p-intro4", kind: "p", text: "后文先分开两条文献。一条说明代码评审在 AI 出现之前就承担什么功能。另一条说明程序员实际如何与代码生成模型相处。随后把两条文献不能直接相加的地方写出来，再给出本文的判断。这个判断在初稿里写得比较满：评审者会更少自己找缺陷。" },
        { key: "h-rel", kind: "h", text: "三、相关工作" },
        { key: "p-rel", kind: "p", text: "代码评审研究首先要区分缺陷发现和知识传递。Bacchelli 与 Bird 在 2013 年访谈并观察了微软的评审实践。他们发现，评审者期待找到缺陷，但评审同时在确认设计、传递团队对代码的共同理解。对初级程序员，后一种功能往往比多找出一个缺陷更重要，因为他们正是通过别人的评论学习什么写法在这个代码库里可以被接受。" },
        { key: "p-rel2", kind: "p", text: "Sadowski 等人 2018 年对 Google 评审制度的研究把这个观察推进了一步。评审能否进行，取决于改动是否足够小、描述是否足够清楚、作者是否还在等待反馈。太大的差异会让评审者放弃细读。这个结论在生成式 AI 之后变得更关键：模型一次可以给出整段实现，作者如果整段接受，差异的体积和说明的质量会同时变差。" },
        { key: "p-rel3", kind: "p", text: "代码生成工具的可用性研究描述的是写代码，不是评审。Vaithilingam、Zhang 与 Glassman 2022 年在对照实验中看到，使用大语言模型代码生成工具的程序员并不稳定地比对照组更快，而且更难修改自己没有完全理解的生成结果。Barke、James 与 Polikarpova 2023 年则把与 Copilot 的互动分成加速和探索。加速是作者已经知道要写什么，用模型少打一些字。探索是作者还没有方案，靠补全来试方向。" },
        { key: "p-rel4", kind: "p", text: "Peng 等人 2023 年关于 GitHub Copilot 的生产率实验常被引来证明 AI 让程序员更快完成任务。Liang、Yang 与 Myers 2024 年的大规模可用性调查则同时记录了成功和困难：生成结果需要检查，错误会以看起来合理的形式出现。两组研究都没有统计评审评论的类型。它们可以说明写代码的过程变了，不能直接说明评审意见变了。本文初稿仍然把这种变快，读成评审负担下降。" },
        { key: "h-method", kind: "h", text: "四、研究方法" },
        { key: "p-method", kind: "p", text: `材料范围是「${mat}」。正文使用六篇公开论文：两篇讨论现代代码评审，四篇讨论程序员与代码生成工具的关系。工具文档只用来核对产品承诺，不作为行为证据。选择标准是：论文必须报告观察、实验或调查，而不是只提出工具。成稿停在${depth}，所以不补充访谈，也不申请内部代码仓库。` },
        { key: "p-method2", kind: "p", text: "阅读时记录三项内容。第一，研究对象是写代码、提交差异，还是评审评论。第二，样本里是否区分初级程序员和有经验的程序员。第三，作者明确写出的结论，以及结论所依赖的测量。六篇论文被做成同一张对照表，再按这三项归类。归类由作者一人完成，没有第二位编码者。" },
        { key: "p-method3", kind: "p", text: "初稿采用一个偏松的推断规则。只要一篇论文表明模型参与了代码的产生，就把它计为支持「评审已经改变」的材料。这个规则没有要求论文观察评审评论，也没有要求样本包含初级程序员。它能使结论很快写满，但会把写代码的证据平移到评审上。" },
        { key: "h-find", kind: "h", text: "五、分析" },
        { key: "p-find", kind: "p", text: "对照之后，有三件事反复出现，而且三件事都不需要假定评审已经消失。第一，评审对象变了。差异里可能同时有作者手写的行和模型生成后被接受的行。评审者如果只按过去的习惯寻找笔误和边界条件，会漏掉另一类问题：这段代码是否只是模型对常见写法的复述，以及作者是否能解释它。" },
        { key: "p-find2", kind: "p", text: "第二，改动说明的作用被抬高了。Sadowski 等人已经说明，评审者需要足够的描述才能决定要不要细读。生成式 AI 使这个要求更具体。只写「由 Copilot 生成」不能告诉评审者作者检查了什么。作者至少要说明自己保留了哪一部分、改了哪一部分、哪一个测试覆盖了这段行为。否则评审者无法区分理解后的接受和整段粘贴。" },
        { key: "p-find3", kind: "p", text: "第三，初级程序员的困难点发生了移动。Vaithilingam 等人观察到，参与者难以修改自己没有形成心理模型的生成代码。Barke 等人描述的探索模式则鼓励作者在方案未定时就接受补全。对初级程序员，这两件事叠在一起：他们更可能把模型的输出当成比自己更可靠的版本，从而在评审前就不删除自己看不懂的部分。评审评论因此要面对一段作者自己也解释不清的实现。" },
        { key: "p-find4", kind: "p", text: "这三项都能指回公开论文里的具体发现，但指回的发现级别不同。评审对象和改动说明的变化，可以由评审研究加上生成代码的使用研究共同推出。初级程序员是否已经更少报告缺陷，没有任何一篇被引文献给出计数。初稿把三项写成同一强度的结论，这个写法后面要改。" },
        { key: "h-disc", kind: "h", text: "六、讨论" },
        { key: "p-disc", kind: "p", text: "把分析直接推到行为层面，可以得到一个强结论：生成式 AI 已经改变初级程序员的代码评审，他们更少自己查找缺陷，更多只是确认模型没有写错。这个句子和课程论文希望给出明确答案的期待一致，也和工具宣传里的效率叙事一致。它的问题是证据的位置。被引研究测量的是任务完成时间、接受补全的方式，以及对生成代码的修改困难，不是评审评论的内容。" },
        { key: "p-disc2", kind: "p", text: "如果保持强结论，本文实际上做了一次概念平移。写代码时更依赖模型，被写成评审时更少找缺陷。中间缺少一步：作者提交差异之后，评审者留下的评论是否从缺陷转向对生成代码的质疑。没有评审记录，这一步只能是推断。初稿没有把推断标出来，是因为标出来以后，论文的答案会从「已经改变」变成「可能改变了注意力，但尚未被测量」。" },
        { key: "p-disc3", kind: "p", text: "这个限度也说明本文不能指导团队马上改评审制度。不能据此要求初级程序员少写缺陷评论，也不能据此取消评审。能说的只是，评审清单如果仍然只问缺陷和风格，就没有覆盖生成代码带来的新问题：作者是否理解、测试是否覆盖、差异是否小到可以读。" },
        { key: "h-end", kind: "h", text: "七、结论" },
        { key: "p-end", kind: "p", text: `结论按研究问题「${q}」来收。本文的答案是肯定的。生成式 AI 已经改变初级程序员的代码评审：评审不再以自己查找缺陷为中心，而以确认模型输出为主。材料来自「${mat}」，文章写成${depth}。` },
        { key: "p-end2", kind: "p", text: "若要把这篇课程论文扩成毕业论文或可投稿的研究，下一步不是把结论写得更满，而是收集真实的评审评论，比较 AI 辅助提交和普通提交在评论类型上的差别。在那之前，强结论只应被看成一个有待测量的假设。" },
        { key: "h-ref", kind: "h", text: "八、参考文献" },

        { key: "p-ref", kind: "p", text: "六篇文献都在正文中被使用。前两篇支撑评审原本做什么，后四篇支撑程序员如何与生成模型相处，以及这些研究没有测量评审评论。工具文档和厂商博客不进入参考文献。内部评审记录、问卷和未公开实验不在本版材料中。" }

    function clipQuote(value, limit) {
      const clean = plainText(value).replace(/^(摘要|关键词)[：:]\s*/, "").trim();

      return { full: clean, short: clean.length > max ? clean.slice(0, max) + "…" : clean };

    function markQuote(mark) {
      const layer = markSurface().layer;
      const host = layer?.parentElement;
      const rect = host && layer ? layer.getBoundingClientRect() : null;
      let text = "";
      if (rect && rect.width && rect.height) {
        const cx = rect.left + (mark.x + mark.w / 2) / 100 * rect.width;
        const cy = rect.top + (mark.y + mark.h / 2) / 100 * rect.height;
        let best = null;
        let bestArea = Infinity;
        host.querySelectorAll("p, li, h1, h2, h3, h4, td, blockquote, .cmp-cell, .cmp-item").forEach(node => {
          if (node.closest(".marks-layer, .mark-dock, .follow-shield")) return;
          const box = node.getBoundingClientRect();
          if (!box.width || !box.height) return;
          const hit = cx >= box.left - 6 && cx <= box.right + 6 && cy >= box.top - 6 && cy <= box.bottom + 6;
          if (!hit) return;
          const area = box.width * box.height;
          if (area < bestArea) { best = node; bestArea = area; }
        });
        text = best ? (best.innerText || best.textContent || "") : "";

      if (!text && !markingCompare() && !markingTask()) {

        const blocks = source?.versions?.[source.versions.length - 1]?.blocks || source?.live || [];

    function applyFmt(cmd, value) {
      docDirty = true;

      if (cmd === "code") {
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount || sel.isCollapsed) return;
        const range = sel.getRangeAt(0);
        const hostOf = node => (node.nodeType === 1 ? node : node.parentElement);
        const inside = hostOf(range.startContainer)?.closest("code");
        const codes = [...docArticle.querySelectorAll("code")].filter(code => {
          try { return range.intersectsNode(code); } catch { return false; }
        });
        if (inside || codes.length) {
          const targets = codes.length ? codes : [inside];
          targets.sort((a, b) => a.contains(b) ? 1 : -1);
          let first = null, last = null;
          targets.forEach(code => {
            const parent = code.parentNode;
            const start = code.firstChild;
            const end = code.lastChild;
            if (!first) first = start;
            last = end;
            while (code.firstChild) parent.insertBefore(code.firstChild, code);
            parent.removeChild(code);

            const next = document.createRange();

            sel.addRange(next);
            savedRange = next.cloneRange();

          return;

        const code = document.createElement("code");
        code.appendChild(range.extractContents());
        range.insertNode(code);
        const next = document.createRange();
        next.selectNodeContents(code);
        sel.removeAllRanges();
        sel.addRange(next);
        savedRange = next.cloneRange();

            const box = document.createElement("input");

      } else if (cmd === "codeBlock") {

        const block = node?.closest("p,h1,h2,h3,h4,h5,h6,pre,div");
        if (!block || !docArticle.contains(block)) return;
        if (block.tagName === "PRE") {

    }
    function dnLocate(id) {
      const note = dn.notes.find(item => item.id === id);
      if (!note) return;
      if (!note.anchor) { notify("这条是场景说明，没有对应的页面元素"); return; }
      let target = dnTarget(note);
      if (!target) {
        const candidate = document.querySelector(note.anchor);
        if (candidate && candidate.getBoundingClientRect().width > 1) {
          candidate.scrollIntoView({ block: "center" });
          target = candidate;
        }
      }
      if (!target) { notify("当前页面没有这个元素，切到对应场景后再定位"); return; }
      let box = document.getElementById("dnHighlight");
      if (!box) {
        box = document.createElement("div");
        box.id = "dnHighlight";
        box.className = "dn-highlight";
        document.body.appendChild(box);
      }
      const rect = target.getBoundingClientRect();
      Object.assign(box.style, { left: rect.left - 4 + "px", top: rect.top - 4 + "px", width: rect.width + 8 + "px", height: rect.height + 8 + "px" });
      box.hidden = false;
      clearTimeout(box.timer);
      box.timer = setTimeout(() => { box.hidden = true; }, 1600);
    }
    function dnEditsPayload(exportId) {
      const edits = {};
      dn.notes.forEach(note => {
        if (note.title !== note.codeTitle || note.body !== note.codeBody) edits[note.id] = { title: note.title, body: note.body };
      });
      return { exportId, exportedAt: new Date().toISOString(), edits };
    }
    function dnHint(text) {
      const hint = document.getElementById("dnExportHint");
      if (!hint) return;
      hint.textContent = text;
      hint.hidden = false;
    }
    async function dnSaveToFile() {
      if (!window.showOpenFilePicker) {
        dnExport();
        dnHint("当前浏览器不支持直接写入本地文件，已改为下载新文件「conversations-说明版.html」。Chrome 或 Edge 可以直接写入。");
        return;
      }
      try {
        if (!dn.fileHandle) {
          const [handle] = await window.showOpenFilePicker({ multiple: false, types: [{ description: "HTML", accept: { "text/html": [".html", ".htm"] } }] });
          dn.fileHandle = handle;
        }
        const handle = dn.fileHandle;
        if (handle.requestPermission && (await handle.requestPermission({ mode: "readwrite" })) !== "granted") {
          dnHint("没有获得写入权限，文件没有改动。可以用「导出 HTML」或「复制备份」保存。");
          return;
        }
        const source = await (await handle.getFile()).text();
        const pattern = /<script type="application\/json" id="dnData">[\s\S]*?<\/script>/;
        if (!pattern.test(source)) {
          dn.fileHandle = null;
          dnHint("选的文件不是这个页面，没有写入。请重新点「保存到文件」，选择当前打开的这个 HTML。");
          return;
        }
        const exportId = dn.embedded?.exportId || "x" + Date.now().toString(36);
        const payload = dnEditsPayload(exportId);
        const json = JSON.stringify(payload).replace(/</g, "\\u003c");
        const writable = await handle.createWritable();
        await writable.write(source.replace(pattern, `<script type="application/json" id="dnData">${json}<\/script>`));
        await writable.close();
        dn.embedded = payload;
        dn.key = "moreai-demo-notes:" + exportId;
        dn.notes.forEach(note => { note.defaultTitle = note.title; note.defaultBody = note.body; });
        dnSave();
        dn.panelKeepHint = `已写入「${handle.name}」，下次打开这个文件就是现在的内容。`;
        dnRenderPanel();
      } catch (err) {
        if (err && err.name === "AbortError") { dnHint("已取消，文件没有改动。"); return; }
        dn.fileHandle = null;
        dnHint("写入失败，文件没有改动。可以用「导出 HTML」或「复制备份」保存。");
      }
    }
    function dnExport() {
      const hint = document.getElementById("dnExportHint");
      try {
        const doc = new DOMParser().parseFromString(dn.snapshot, "text/html");
        const data = doc.getElementById("dnData");
        const edits = {};
        dn.notes.forEach(note => {
          if (note.title !== note.codeTitle || note.body !== note.codeBody) edits[note.id] = { title: note.title, body: note.body };
        });
        const payload = { exportId: "x" + Date.now().toString(36), exportedAt: new Date().toISOString(), edits };
        data.textContent = JSON.stringify(payload).replace(/</g, "\\u003c");
        const html = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
        link.download = "conversations-说明版.html";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 4000);
        hint.textContent = "已发起下载「conversations-说明版.html」。如果浏览器没有弹出下载，请用「复制备份」保存说明内容。";
      } catch (err) {
        hint.textContent = "导出失败，请用「复制备份」保存说明内容。";
      }
      hint.hidden = false;
    }
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && dn.mode === "notes" && dn.open) { dn.open = false; dnPaintPanelOpen(); }
    });
    window.addEventListener("resize", () => { if (dn.mode === "notes") dnPlaceMarkers(); });
    async function loadDemoVersion() {
      const el = document.getElementById("demoVersion");
      if (!el) return;
      try {
        const res = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        el.innerHTML = `版本 <b>${esc(data.version || "")}</b> · ${esc(data.updatedAt || "")}<a href="./">入口</a>`;
        el.title = data.note ? String(data.note) : "以仓库 version.json 为准";
      } catch (err) {
        el.textContent = "本地打开 · 无版本戳";
        el.title = "请通过入口页的 http(s) 地址打开，才能核对仓库版本";
      }
    }
    dnInit();
    loadDemoVersion();
  </script>
</body>
