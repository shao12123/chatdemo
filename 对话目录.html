<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对话目录</title>
  <style>
    /*
     * 颜色 = moreai-electron 现网语义 token（colors-semantic.css）
     * 工程直接抄同名 CSS 变量 / Tailwind：text-text-*、bg-bg-*、border-border、brand
     * 禁止业务再写 #1f2329 / #646a73 等飞书灰
     */
    :root {
      --text-color-primary: #000000;
      --text-color-secondary: #66686c;
      --text-color-placeholder: #8b8e93;
      --text-color-disabled: #b0b3b8;
      --bg-color-page: #e9ebee; /* gray-2 */
      --bg-color-container: #ffffff;
      --bg-color-secondarycontainer: #eef0f3; /* gray-1 */
      --component-border: #dcdcdc; /* gray-4-border，现网 */
      --component-stroke: #dcdcdc;
      --border: var(--component-border);
      --card: var(--bg-color-container);
      --brand-color: #0a59f7;
      --brand-color-soft: #f3f7ff; /* brand-12 */
      --brand-color-hover-line: #b5cdfd; /* brand-8 */
      --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.06);
      --page: var(--bg-color-page);
      --ink: var(--text-color-primary);
      --sub: var(--text-color-secondary);
      --muted: var(--text-color-placeholder);
      --line: var(--component-stroke);
      --brand: var(--brand-color);
      --secondary: var(--bg-color-secondarycontainer);
      --font: "HarmonyOS Sans SC", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* 与 html.dark / next-themes 一致：本 Demo 用 html.theme-dark */
    html.theme-dark {
      --text-color-primary: #ffffff;
      /* 现网深色 secondary / placeholder / disabled 合并为同一 muted */
      --text-color-secondary: #c5c8ce;
      --text-color-placeholder: #c5c8ce;
      --text-color-disabled: #c5c8ce;
      --bg-color-page: #090b0e; /* gray-14 */
      --bg-color-container: #111216; /* gray-13 */
      --bg-color-secondarycontainer: #191a1d; /* gray-12 */
      --component-border: #2a2d33; /* 现网 dark border */
      --component-stroke: #2a2d33;
      /* 现网：brand-dark-1 #317af7 再提亮约 15% */
      --brand-color: color-mix(in srgb, #317af7 85%, #ffffff);
      --brand-color-soft: #0a1831; /* brand-dark-9 */
      --brand-color-hover-line: #2762c6; /* brand-dark-3 */
      --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { height: 100%; background: var(--page); color: var(--ink); font: 14px/1.6 var(--font); overflow: hidden; }
    button { font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0; }
    a { color: var(--brand); text-decoration: none; }

    .app { display: grid; grid-template-rows: 48px minmax(0, 1fr); height: 100%; }
    .top {
      display: flex; align-items: center; gap: 10px; padding: 0 16px;
      background: color-mix(in srgb, var(--card) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
    }
    .top h1 { margin: 0; font-size: 14px; font-weight: 700; flex: 1; min-width: 0; }
    .top .ver { font-size: 12px; color: var(--muted); }
    .top a.entry, .top .mode button, .theme-switch button {
      height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); font-size: 12px; line-height: 26px;
    }
    .top a.entry:hover, .top .mode button:hover, .theme-switch button:hover { border-color: var(--brand-color-hover-line); color: var(--brand); }
    .mode, .theme-switch { display: inline-flex; gap: 4px; padding: 2px; border-radius: 10px; background: var(--secondary); border: 0; }
    .mode button, .theme-switch button { border: 0; background: transparent; height: 24px; padding: 0 10px; border-radius: 8px; color: var(--sub); }
    .mode button[aria-pressed="true"], .theme-switch button[aria-pressed="true"] {
      background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .body { display: grid; grid-template-columns: 220px minmax(0, 1fr) 280px; min-height: 0; }
    .body.hide-notes { grid-template-columns: 220px minmax(0, 1fr); }
    .body.hide-notes .notes { display: none; }

    .hist {
      border-right: 1px solid var(--line); background: var(--card); padding: 12px 10px; overflow: auto;
    }
    .hist .label { padding: 4px 8px 8px; font-size: 12px; color: var(--muted); }
    .hist button {
      display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px;
      color: var(--sub); font-size: 13px; line-height: 20px; margin-bottom: 4px;
    }
    .hist button:hover { background: var(--secondary); }
    .hist button.on { background: var(--brand-color-soft); color: var(--brand); font-weight: 600; }

    .main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--card); }
    .hint {
      flex: none; margin: 12px 20px 0; padding: 10px 12px; border-radius: 12px; background: var(--secondary);
      font-size: 12px; line-height: 18px; color: var(--sub);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .hint b { color: var(--ink); font-weight: 600; }
    .hint .acts { flex: none; display: flex; gap: 6px; }
    .hint .acts button {
      height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); font-size: 12px; color: var(--ink);
    }
    .hint .acts button:hover { border-color: var(--brand-color-hover-line); color: var(--brand); }
    .hint .acts button.on { border-color: var(--brand); color: var(--brand); background: var(--brand-color-soft); }
    .stage-row { flex: 1; min-height: 0; display: flex; }
    .stage-row .scroll { flex: 1; }
    .fake-doc {
      display: none; width: 280px; flex: none; border-left: 1px solid var(--line);
      background: var(--secondary); padding: 16px; overflow: auto; font-size: 12px; color: var(--sub); line-height: 20px;
    }
    .main.with-doc .fake-doc { display: block; }
    .fake-doc h4 { margin: 0 0 8px; font-size: 13px; color: var(--ink); }
    .scroll {
      flex: 1; min-height: 0; overflow: auto; padding: 16px 48px 48px 24px; position: relative;
    }
    .block {
      max-width: 680px; margin: 0 0 20px; padding: 14px 16px; border-radius: 14px; background: var(--secondary);
      scroll-margin-top: 24px;
    }
    .block.user { background: var(--brand-color-soft); margin-left: auto; width: fit-content; max-width: min(440px, 100%); }
    .block .kicker { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
    .block h3 { margin: 0 0 6px; font-size: 15px; line-height: 22px; color: var(--ink); }
    .block p { margin: 0; color: var(--sub); font-size: 13px; line-height: 22px; }
    .block.qnav-flash { animation: qnav-flash 1s ease; }

    .notes {
      border-left: 1px solid var(--line); background: var(--card); overflow: auto; padding: 14px 14px 32px;
    }
    .notes h2 { margin: 0 0 8px; font-size: 14px; color: var(--ink); }
    .notes .note {
      margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--secondary);
      font-size: 12px; line-height: 18px; color: var(--sub);
    }
    .notes .note b { display: block; margin-bottom: 4px; color: var(--ink); font-size: 13px; }

    /* qnav — 只引用规范 token */
    .qnav { position: absolute; top: 0; right: 14px; bottom: 0; width: 28px; z-index: 6; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s; }
    .qnav.show { opacity: 1; visibility: visible; transition: opacity .2s ease; }
    .qnav-rail { position: absolute; top: 50%; right: 0; padding: 6px 0 6px 12px; transform: translateY(-50%); pointer-events: auto; cursor: pointer; transition: opacity .16s ease; }
    .qnav-view { width: 20px; overflow: hidden; }
    /* flex + gap：线高 2 + gap 8 = pitch 10 */
    .qnav-track { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; transition: transform .25s ease; }
    .qnav-rail i { display: block; width: 8px; height: 2px; margin: 0; flex: 0 0 2px; border-radius: 1px; background: var(--text-color-placeholder); transition: width .12s ease, background-color .2s ease; transform-origin: right center; }
    .qnav-rail i.is-current { width: 16px; background: var(--text-color-primary); }
    .qnav-rail i.is-new { animation: qnav-dash-in .32s cubic-bezier(.2, .8, .2, 1); }
    .qnav.dense-rail .qnav-rail { width: 22px; }
    @keyframes qnav-dash-in { from { width: 0; opacity: 0; } }
    .qnav.open .qnav-rail { opacity: 0; }
    .qnav.dense-rail.open .qnav-rail { opacity: 0; pointer-events: none; }
    .qnav-card {
      position: absolute; right: -13px; width: 280px; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
      padding: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card);
      pointer-events: none; opacity: 0; clip-path: inset(0 0 0 calc(100% - 24px) round 12px);
      transition: opacity .2s ease, clip-path .2s cubic-bezier(.2, .8, .2, 1);
    }
    .qnav-card::-webkit-scrollbar { display: none; }
    .qnav.open .qnav-card { pointer-events: auto; opacity: 1; clip-path: inset(0 round 12px); }
    .qnav-row {
      display: grid; grid-template-columns: minmax(0, 1fr) 16px; align-items: start; column-gap: 10px; width: 100%;
      padding: 5px 6px 5px 10px; border: 0; border-radius: 8px; background: transparent;
      color: var(--text-color-secondary); font: inherit; font-size: 12px; line-height: 20px; text-align: right; cursor: pointer;
      transition: background-color .16s ease, color .16s ease;
    }
    .qnav-row:hover, .qnav-row:focus-visible { color: var(--text-color-primary); outline: 0; }
    .qnav-row.is-peek { background: var(--secondary); text-align: left; }
    .qnav-row.is-current { color: var(--text-color-primary); font-weight: 600; }
    .qnav-text { min-width: 0; }
    .qnav-q { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .qnav-a-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .18s ease; }
    .qnav-row.is-peek .qnav-a-wrap { grid-template-rows: 1fr; }
    .qnav-a { min-height: 0; overflow: hidden; }
    .qnav-a span {
      display: -webkit-box; margin-top: 2px; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      color: var(--text-color-placeholder); font-weight: 400; opacity: 0; transform: translateY(4px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .qnav-row.is-peek .qnav-a span { opacity: 1; transform: none; }
    .qnav-dash { justify-self: end; width: 8px; height: 2px; margin-top: 9px; border-radius: 1px; background: var(--text-color-placeholder); transition: width .2s ease, background-color .2s ease; }
    .qnav-row.is-current .qnav-dash { width: 16px; background: var(--text-color-primary); }
    .qnav-row:hover .qnav-dash, .qnav-row.is-peek .qnav-dash { background: var(--text-color-primary); }
    .qnav.no-peek .qnav-q { white-space: normal; overflow: visible; text-overflow: clip; }
    @keyframes qnav-flash {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand-color) 0%, transparent); }
      25% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-color) 16%, transparent); }
    }
    @media (prefers-reduced-motion: reduce) {
      .qnav, .qnav-card, .qnav-track, .qnav-rail i, .qnav-a-wrap, .qnav-a span { transition: none; }
      .qnav-rail i.is-new, .block.qnav-flash { animation: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="entry" href="index.html">入口</a>
      <h1>对话目录</h1>
      <span class="ver" id="verLabel">—</span>
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="浅色或深色">
        <button type="button" data-theme-mode="light" aria-pressed="true">浅色</button>
        <button type="button" data-theme-mode="dark" aria-pressed="false">深色</button>
      </div>
      <div class="mode" role="group" aria-label="预览或说明">
        <button type="button" data-mode="preview" aria-pressed="true">预览</button>
        <button type="button" data-mode="notes" aria-pressed="false">说明</button>
      </div>
    </header>
    <div class="body" id="layout">
      <aside class="hist" aria-label="历史">
        <div class="label">历史对话</div>
        <div id="caseList"></div>
      </aside>
      <section class="main">
        <div class="hint" id="hint"></div>
        <div class="stage-row">
          <div class="scroll" id="scroller"></div>
          <aside class="fake-doc" id="fakeDoc" aria-label="模拟右侧文档台">
            <h4>模拟右侧文档台</h4>
            <p>打开后，对话列上的提问 / 消息目录应隐藏；右侧也不出文档目录（本期改云文档承接）。本 case 演示「隐藏提问目录」。</p>
          </aside>
        </div>
      </section>
      <aside class="notes" id="notes" aria-label="说明"></div>
    </div>
  </div>

  <script>
    const OUTLINE_MIN = 2, OUTLINE_MAX = 18, OUTLINE_PITCH = 10;
    const OUTLINE_CARD_MAX = 12, OUTLINE_ROW_H = 30; // 展开卡最多约 12 行，兼顾 1440 小屏
    const outlineReduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function createOutline(cfg) {
      const dense = !!cfg.denseRail;
      const ui = {
        items: [], open: false, peek: null, current: -1, pinned: null, sig: "", counts: {},
        peekTimer: 0, closeTimer: 0, openTimer: 0, raf: 0, panRaf: 0,
        panExtra: 0, edgeDir: 0, fisheyeY: null, baseOffset: 0, maxOffset: 0
      };
      const el = document.createElement("nav");
      el.className = "qnav" + (cfg.peek ? "" : " no-peek") + (dense ? " dense-rail" : "");
      el.id = cfg.id;
      el.setAttribute("aria-label", cfg.label);
      el.innerHTML = `<div class="qnav-rail" aria-hidden="true"><div class="qnav-view"><div class="qnav-track"></div></div></div><div class="qnav-card"></div>`;
      cfg.host.appendChild(el);
      const rail = el.querySelector(".qnav-rail");
      const view = el.querySelector(".qnav-view");
      const track = el.querySelector(".qnav-track");
      const card = el.querySelector(".qnav-card");
      const scroller = cfg.scroller;
      const keyOf = node => Number(node.dataset.qi);
      const markCurrent = () => el.querySelectorAll("[data-qi]").forEach(node => node.classList.toggle("is-current", keyOf(node) === ui.current));
      function metrics() {
        const n = ui.items.length;
        const room = Math.max(OUTLINE_PITCH, el.clientHeight - 48);
        const visible = Math.max(1, Math.min(n, OUTLINE_MAX, Math.floor(room / OUTLINE_PITCH)));
        const max = Math.max(0, (n - visible) * OUTLINE_PITCH);
        const at = Math.max(0, ui.items.findIndex(item => item.key === ui.current));
        const base = Math.max(0, Math.min(max, at * OUTLINE_PITCH - (visible * OUTLINE_PITCH) / 2 + OUTLINE_PITCH / 2));
        return { n, visible, max, base };
      }
      function applyFisheye() {
        const dashes = [...track.querySelectorAll("i")];
        // 鱼眼只加长横线，不改上下间距，避免 overflow 窗口里只剩两三根
        if (!dense || ui.fisheyeY == null || outlineReduced() || ui.open) {
          dashes.forEach(d => {
            d.style.width = "";
            d.style.marginTop = "";
            d.style.marginBottom = "";
          });
          return;
        }
        dashes.forEach(d => {
          const r = d.getBoundingClientRect();
          const cy = r.top + r.height / 2;
          const t = Math.max(0, 1 - Math.abs(cy - ui.fisheyeY) / 52);
          const current = d.classList.contains("is-current");
          d.style.width = ((current ? 16 : 8) + t * 12) + "px";
        });
      }
      function placeTrack() {
        const { visible, max, base } = metrics();
        // 整段轨始终垂直居中固定；窗口高度锁定满窗条数，头/尾只平移 track，不挪 rail
        const viewH = visible * OUTLINE_PITCH;
        view.style.height = viewH + "px";
        view.style.minHeight = viewH + "px";
        ui.baseOffset = base;
        ui.maxOffset = max;
        const offset = Math.max(0, Math.min(max, base + ui.panExtra));
        track.style.transform = `translateY(${-offset}px)`;
        applyFisheye();
      }
      function stopEdgePan() {
        ui.edgeDir = 0;
        if (ui.panRaf) { cancelAnimationFrame(ui.panRaf); ui.panRaf = 0; }
      }
      function tickEdgePan() {
        ui.panRaf = 0;
        if (!ui.edgeDir || ui.open) return;
        const { max, base } = metrics();
        const next = ui.panExtra + ui.edgeDir * 2.2;
        ui.panExtra = Math.max(-base, Math.min(max - base, next));
        placeTrack();
        ui.panRaf = requestAnimationFrame(tickEdgePan);
      }
      function updateEdgePan(clientY) {
        if (!dense || ui.open) { stopEdgePan(); return; }
        const box = view.getBoundingClientRect();
        const y = clientY - box.top;
        const zone = 24;
        let dir = 0;
        if (y < zone) dir = -1;
        else if (y > box.height - zone) dir = 1;
        if (dir === ui.edgeDir) return;
        ui.edgeDir = dir;
        if (!dir) { stopEdgePan(); return; }
        if (!ui.panRaf) ui.panRaf = requestAnimationFrame(tickEdgePan);
      }
      function centerRow(smooth) {
        const row = card.querySelector(".qnav-row.is-current");
        if (!row) return;
        const top = row.offsetTop - (card.clientHeight - row.offsetHeight) / 2;
        card.scrollTo({ top: Math.max(0, top), behavior: smooth && !outlineReduced() ? "smooth" : "auto" });
      }
      function setCurrent(key, opts = {}) {
        if (key === ui.current) {
          if (opts.resetPan) { ui.panExtra = 0; placeTrack(); }
          return;
        }
        ui.current = key;
        if (opts.resetPan !== false && !opts.keepPan) ui.panExtra = 0;
        markCurrent();
        placeTrack();
      }
      function sync() {
        if (!el.classList.contains("show")) return;
        if (ui.pinned != null && ui.items.some(item => item.key === ui.pinned)) { setCurrent(ui.pinned, { resetPan: true }); return; }
        const box = scroller.getBoundingClientRect();
        const atEnd = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 4;
        const line = atEnd ? box.bottom - 1 : box.top + cfg.line;
        let pick = ui.items[0]?.key ?? -1;
        ui.items.forEach(item => {
          const node = cfg.nodeFor(item.key);
          if (node && node.getBoundingClientRect().top <= line) pick = item.key;
        });
        setCurrent(pick, { resetPan: true });
      }
      function setPeek(key) {
        ui.peek = key;
        card.querySelectorAll(".qnav-row").forEach(row => row.classList.toggle("is-peek", keyOf(row) === key));
      }
      function open() {
        if (ui.open || !el.classList.contains("show")) return;
        stopEdgePan();
        ui.fisheyeY = null;
        applyFisheye();
        ui.open = true;
        const host = el.clientHeight;
        const r = rail.getBoundingClientRect();
        const center = r.top + r.height / 2 - el.getBoundingClientRect().top;
        const cap = OUTLINE_CARD_MAX * OUTLINE_ROW_H + 12;
        const height = Math.min(card.scrollHeight, host - 24, cap);
        const top = Math.max(12, Math.min(host - height - (cfg.peek ? 60 : 12), center - height / 2));
        card.style.top = top + "px";
        card.style.maxHeight = Math.min(host - top - 12, cap) + "px";
        el.classList.add("open");
        centerRow(false);
      }
      function close(now) {
        clearTimeout(ui.peekTimer);
        clearTimeout(ui.openTimer);
        stopEdgePan();
        ui.fisheyeY = null;
        applyFisheye();
        if (!ui.open && !now) return;
        ui.open = false;
        setPeek(null);
        el.classList.remove("open");
      }
      function jump(key) {
        const node = cfg.nodeFor(key);
        if (!node) return;
        ui.pinned = key;
        setCurrent(key, { resetPan: true });
        centerRow(true);
        const top = node.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - cfg.offset;
        scroller.scrollTo({ top: Math.max(0, top), behavior: outlineReduced() ? "auto" : "smooth" });
        node.classList.remove("qnav-flash");
        void node.offsetWidth;
        node.classList.add("qnav-flash");
        setTimeout(() => node.classList.remove("qnav-flash"), 1000);
      }
      function paint(items, show, countKey) {
        ui.items = items;
        const prev = countKey ? (ui.counts[countKey] ?? items.length) : items.length;
        if (countKey) ui.counts[countKey] = items.length;
        el.classList.toggle("show", show);
        if (!show) { close(true); return; }
        const sig = countKey + "\u0003" + items.map(item => `${item.key}\u0001${item.title}\u0001${item.answer || ""}`).join("\u0002");
        if (sig !== ui.sig) {
          ui.sig = sig;
          if (cfg.unpinOnChange) ui.pinned = null;
          ui.panExtra = 0;
          track.innerHTML = items.map((item, i) => `<i data-qi="${item.key}"${i >= prev ? ` class="is-new"` : ""}></i>`).join("");
          const keepScroll = card.scrollTop;
          card.innerHTML = items.map(item => `<button class="qnav-row${item.key === ui.peek ? " is-peek" : ""}" type="button" data-qi="${item.key}" aria-label="${esc(item.title)}"><span class="qnav-text"><span class="qnav-q">${esc(item.title)}</span>${cfg.peek && item.answer ? `<span class="qnav-a-wrap"><span class="qnav-a"><span>${esc(item.answer)}</span></span></span>` : ""}</span><i class="qnav-dash"></i></button>`).join("");
          card.scrollTop = keepScroll;
          ui.current = -1;
        }
        placeTrack();
        sync();
      }
      const enterRail = () => {
        clearTimeout(ui.closeTimer);
        clearTimeout(ui.openTimer);
        if (dense) ui.openTimer = setTimeout(open, 240);
        else open();
      };
      const enterCard = () => {
        clearTimeout(ui.closeTimer);
        clearTimeout(ui.openTimer);
        open();
      };
      const leave = () => {
        clearTimeout(ui.openTimer);
        stopEdgePan();
        ui.fisheyeY = null;
        applyFisheye();
        clearTimeout(ui.closeTimer);
        ui.closeTimer = setTimeout(close, 150);
      };
      rail.addEventListener("pointerenter", enterRail);
      rail.addEventListener("pointerleave", leave);
      card.addEventListener("pointerenter", enterCard);
      card.addEventListener("pointerleave", leave);
      card.addEventListener("focusin", enterCard);
      card.addEventListener("focusout", event => { if (!card.contains(event.relatedTarget)) leave(); });
      if (dense) {
        rail.addEventListener("pointermove", event => {
          ui.fisheyeY = event.clientY;
          updateEdgePan(event.clientY);
          applyFisheye();
        });
        rail.addEventListener("click", event => {
          const dash = event.target.closest("i[data-qi]");
          if (dash) jump(keyOf(dash));
        });
      }
      if (cfg.peek) {
        card.addEventListener("pointerover", event => {
          const row = event.target.closest(".qnav-row");
          if (!row || keyOf(row) === ui.peek) return;
          clearTimeout(ui.peekTimer);
          ui.peekTimer = setTimeout(() => setPeek(keyOf(row)), 80);
        });
        card.addEventListener("pointerleave", () => { clearTimeout(ui.peekTimer); setPeek(null); });
      }
      card.addEventListener("click", event => {
        const row = event.target.closest(".qnav-row");
        if (row) jump(keyOf(row));
      });
      const unpin = () => { ui.pinned = null; };
      ["wheel", "touchstart", "pointerdown"].forEach(type => scroller.addEventListener(type, unpin, { passive: true }));
      scroller.addEventListener("scroll", () => {
        if (ui.raf) return;
        ui.raf = requestAnimationFrame(() => { ui.raf = 0; sync(); });
      }, { passive: true });
      window.addEventListener("resize", () => { if (el.classList.contains("open")) open(); placeTrack(); });
      return { el, ui, paint, sync, close };
    }

    const CASES = [
      {
        id: "ask",
        title: "提问目录",
        hint: "悬停右侧短横线展开列表；悬停某一行可 peek AI 首句；点击跳转到对应提问。",
        peek: true,
        label: "提问目录",
        notes: [
          { t: "出现条件", b: "≥2 条用户消息；本 Demo 无右侧文档台，故始终显示。" },
          { t: "收起", b: "右缘短横线，一条提问一条；当前项更长更深；滚动时轨跟随居中。" },
          { t: "展开 / peek", b: "悬停展开 280 宽卡片；行悬停约 80ms 展开 AI 首句（灰字最多 2 行）。" },
          { t: "交互", b: "点击跳转并短暂高亮；离开约 150ms 收起；减弱动效时关闭动画。" }
        ],
        blocks: [
          { key: 0, kind: "user", title: "帮我写一篇课程论文：生成式 AI 会怎样改变初级程序员的代码评审", answer: "按推荐定下研究问题与材料范围，开始检索文献。" },
          { key: 1, kind: "ai", title: "首稿已写入文档台", body: "八节结构已齐：摘要、问题、相关工作、方法、分析、讨论、结论、参考文献。" },
          { key: 2, kind: "user", title: "再生成一版，结论写得太满了", answer: "结论与证据对不上，建议改成「可能改变注意力，但尚未被测量」。" },
          { key: 3, kind: "ai", title: "修订说明", body: "新开「课程论文 · 修订」页签；旧版保留，可直接对比。" },
          { key: 4, kind: "user", title: "对比「生成式 AI 与代码评审」和「课程论文 · 修订」", answer: "两版差异已整理好，只列出写得不一样的部分。" },
          { key: 5, kind: "ai", title: "对比结论", body: "讨论与结论两节改动最大；方法与参考文献沿用。" }
        ]
      },
      {
        id: "msg",
        title: "消息目录",
        hint: "长回复内多块锚点（导语 / 总判断 / 各报告）。悬停展开后点击跳转；本 case 开 peek 以展示块摘要。",
        peek: true,
        label: "消息目录",
        notes: [
          { t: "出现条件", b: "≥2 个可跳转块；业务侧用 data-sum-sec 等挂锚（见文档分析 PRD）。" },
          { t: "与提问目录关系", b: "同一控件；列表内容由业务填充 items，不改交互壳。" },
          { t: "右侧打开时", b: "正式产品中消息目录应隐藏或让位；本 Demo 单独演示故仍显示。" }
        ],
        blocks: [
          { key: 0, kind: "sec", title: "导语", body: "三份材料一起看：总判断先给，再按文件拆开。", answer: "导语：先总判断再分文件。" },
          { key: 1, kind: "sec", title: "总判断", body: "缺陷发现率提升约 18%，评审阅读时长下降约 11 分钟；适合初筛。", answer: "总判断：适合初筛，不能当合并依据。" },
          { key: 2, kind: "sec", title: "论文 A · 方法", body: "样本：86 个后端服务，2140 次合并请求。", answer: "方法：样本与对照设置。" },
          { key: 3, kind: "sec", title: "论文 B · 结果", body: "模型初审后人工复核，漏报集中在跨文件改动。", answer: "结果：跨文件改动易漏报。" },
          { key: 4, kind: "sec", title: "提示", body: "报告卡只展示有依据的模块；空模块不渲染。", answer: "提示：模块闸门，有数据才渲染。" }
        ]
      },
      {
        id: "doc",
        title: "文档目录（非本期）",
        hint: "仅演示控件在章节列表上的形态（无 peek）。产品本期不上右侧文档目录——改由云文档承接（见 PRD Q5）。",
        peek: false,
        label: "文档目录",
        notes: [
          { t: "本期范围", b: "本 case 只演示形态，不作为上线验收。Chat 右侧展示区打开时不出文档目录。" },
          { t: "原因", b: "即将上云文档；文档大纲在云文档侧做，避免与 Chat 右侧重复。" },
          { t: "形态参考", b: "同一控件；peek 关；标题可换行；滚动跟当前章。" }
        ],
        blocks: [
          { key: 0, kind: "h", title: "一、题目与摘要", body: "研究问题、材料范围与本文判断。" },
          { key: 1, kind: "h", title: "二、研究问题", body: "生成式 AI 是否已经改变初级程序员的代码评审。" },
          { key: 2, kind: "h", title: "三、相关工作", body: "评审制度研究与代码生成工具可用性调查对照阅读。" },
          { key: 3, kind: "h", title: "四、研究方法", body: "六篇公开论文对照表与三项归类。" },
          { key: 4, kind: "h", title: "五、分析", body: "评审对象、改动说明、初级程序员困难点。" },
          { key: 5, kind: "h", title: "六、讨论", body: "证据测量的是写代码，不是评审评论。" },
          { key: 6, kind: "h", title: "七、结论", body: "按研究问题给出有边界的答案。" },
          { key: 7, kind: "h", title: "八、参考文献", body: "正文引用的六篇文献列表。" }
        ]
      },
      {
        id: "mutex",
        title: "右侧打开时隐藏",
        hint: "默认显示提问目录；点「打开右侧」后轨应消失，关闭后淡入回来。",
        peek: true,
        label: "提问目录",
        filter: "user",
        mutex: true,
        notes: [
          { t: "本期互斥", b: "右侧展示区打开（doc / HTML 等）→ 对话列提问 / 消息目录隐藏；右侧也**不出**文档目录。" },
          { t: "原因", b: "云文档即将上线，文档大纲改云文档做；本期 Chat 只做「打开右侧时让位隐藏」。" },
          { t: "验收", b: "打开右侧 → 无短横线、右侧无文档目录；关闭右侧 → 短横线回来且仍可跳转。" }
        ],
        blocks: [
          { key: 0, kind: "user", title: "帮我写一篇课程论文", answer: "已按推荐定下方向并开始写入。" },
          { key: 1, kind: "ai", title: "写入中", body: "右侧打开时，对话列提问目录隐藏；右侧也不挂文档目录。" },
          { key: 2, kind: "user", title: "把讨论写得保守一点", answer: "已出修订页签，旧版保留。" },
          { key: 3, kind: "ai", title: "修订完成", body: "可关闭右侧后再用目录跳回提问。" }
        ]
      },
      {
        id: "few",
        title: "不足两条不显示",
        hint: "只有 1 条用户消息时右侧不应出现短横线；点「再加一条提问」后出现。",
        peek: true,
        label: "提问目录",
        filter: "user",
        grow: true,
        notes: [
          { t: "出现条件", b: "OUTLINE_MIN = 2；少于 2 条锚点时 paint(show=false)。" },
          { t: "验收", b: "初始无轨；加到 2 条用户消息后出现轨并可展开。" }
        ],
        blocks: [
          { key: 0, kind: "user", title: "帮我写一篇课程论文：生成式 AI 与代码评审", answer: "生成中…" },
          { key: 1, kind: "ai", title: "思考中", body: "此时还只有 1 条用户消息，目录不出现。" }
        ]
      },
      {
        id: "many",
        title: "很多条",
        hint: "40 条：短横线满窗约 18，整段轨垂直居中固定（不随滚动贴顶/贴底）；展开卡约 12 行。悬停鱼眼；边缘拨轨；停约 0.24s 开卡。",
        peek: true,
        label: "提问目录",
        filter: "user",
        many: true,
        denseRail: true,
        notes: [
          { t: "轨窗口", b: "可见条数 = min(总数, 18, 可用高度/10px)。整段轨固定在对话列垂直居中；头/尾只平移 track，rail 位置不变。" },
          { t: "展开卡高度", b: "最多约 12 行（行高按 30px 估），超出在卡内滚动，避免小屏顶满。" },
          { t: "边缘平移", b: "指针在轨上/下沿约 24px 热区时持续拨轨，把更早/更晚的横线送进窗口（对齐 Cursor）。" },
          { t: "悬停鱼眼", b: "指针附近横线只加长、不加大上下间距，避免滚到末项时只剩两三根；离开恢复。" },
          { t: "展开卡（方案 A）", b: "在轨上停留约 240ms 后仍展开标题卡 + peek；与鱼眼/拨轨不互斥。" },
          { t: "验收", b: "展开卡视觉上不超过约 12 行高；贴顶/底拨轨；卡内能滚到第 40 条。" }
        ],
        blocks: []
      }
    ];

    (function buildManyCase() {
      const many = CASES.find(c => c.id === "many");
      const blocks = [];
      for (let i = 0; i < 40; i++) {
        const n = i + 1;
        blocks.push({
          key: i * 2,
          kind: "user",
          title: n === 1
            ? "帮我写一篇课程论文：生成式 AI 会怎样改变初级程序员的代码评审"
            : `第 ${n} 轮追问：请再收紧一点讨论里的措辞（示例 ${n}/40）`,
          answer: n === 40 ? "这是最后一轮回复的首句，展开目录滚到底应能看到。" : `已处理第 ${n} 轮，文档仍保留在右侧。`
        });
        blocks.push({
          key: i * 2 + 1,
          kind: "ai",
          title: `回复 ${n}`,
          body: n % 10 === 0
            ? `里程碑：已累计 ${n} 轮对话。目录轨不应画出全部 ${n} 条横线铺满屏幕。`
            : `这是第 ${n} 轮的正文占位，用来把对话区撑长，便于滚动测试目录轨窗口。`
        });
      }
      many.blocks = blocks;
    })();

    const scroller = document.getElementById("scroller");
    const main = document.querySelector(".main");
    let outline = null;
    let activeId = CASES[0].id;
    let mode = "preview";
    let docOpen = false;
    let extraAsk = 0;

    function current() { return CASES.find(c => c.id === activeId) || CASES[0]; }

    function paintList() {
      document.getElementById("caseList").innerHTML = CASES.map(c =>
        `<button type="button" data-case="${c.id}" class="${c.id === activeId ? "on" : ""}">${esc(c.title)}</button>`
      ).join("");
    }

    function paintNotes() {
      const c = current();
      document.getElementById("notes").innerHTML =
        `<h2>${esc(c.title)}</h2>` +
        c.notes.map(n => `<div class="note"><b>${esc(n.t)}</b>${esc(n.b)}</div>`).join("");
    }

    function outlineItems(c) {
      let blocks = c.blocks.slice();
      if (c.grow && extraAsk > 0) {
        blocks = blocks.concat([
          { key: 10, kind: "user", title: "再生成一版，结论写保守一点", answer: "已记下，准备改讨论与结论。" },
          { key: 11, kind: "ai", title: "已接收", body: "第二条提问已出现，目录应显示。" }
        ]);
      }
      const filtered = c.filter === "user" || c.id === "ask"
        ? blocks.filter(b => b.kind === "user")
        : blocks;
      return {
        blocks,
        items: filtered.map(b => ({ key: b.key, title: b.title, answer: b.answer || "" }))
      };
    }

    function paintContent() {
      const c = current();
      if (c.id !== "mutex") docOpen = false;
      if (c.id !== "few") extraAsk = 0;
      main.classList.toggle("with-doc", !!(c.mutex && docOpen));

      const acts = [];
      if (c.mutex) {
        acts.push(`<button type="button" data-act="toggle-doc" class="${docOpen ? "on" : ""}">${docOpen ? "关闭右侧" : "打开右侧"}</button>`);
      }
      if (c.grow) {
        acts.push(`<button type="button" data-act="add-ask"${extraAsk ? " disabled" : ""}>${extraAsk ? "已有两条提问" : "再加一条提问"}</button>`);
      }
      document.getElementById("hint").innerHTML =
        `<span><b>${esc(c.title)}</b> · ${esc(c.hint)}</span>` +
        (acts.length ? `<span class="acts">${acts.join("")}</span>` : "");

      const { blocks, items } = outlineItems(c);
      scroller.innerHTML = blocks.map(b => {
        if (b.kind === "user") {
          return `<article class="block user" data-oid="${b.key}"><span class="kicker">用户</span><p>${esc(b.title)}</p></article>`;
        }
        if (b.kind === "ai") {
          return `<article class="block" data-oid="${b.key}"><span class="kicker">MoreAI</span><h3>${esc(b.title)}</h3><p>${esc(b.body)}</p></article>`;
        }
        return `<article class="block" data-oid="${b.key}"><span class="kicker">锚点</span><h3>${esc(b.title)}</h3><p>${esc(b.body || "")}</p></article>`;
      }).join("");
      scroller.scrollTop = 0;
      if (outline) { outline.el.remove(); outline = null; }
      outline = createOutline({
        id: "demoQnav",
        label: c.label,
        host: main,
        scroller,
        peek: c.peek,
        denseRail: !!c.denseRail,
        line: 48,
        offset: 24,
        unpinOnChange: c.id === "doc",
        nodeFor: key => scroller.querySelector(`[data-oid="${key}"]`)
      });
      const show = items.length >= OUTLINE_MIN && !(c.mutex && docOpen);
      outline.paint(items, show, c.id + ":" + extraAsk + ":" + (docOpen ? 1 : 0));
    }

    function setMode(next) {
      mode = next;
      document.querySelectorAll(".mode button").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.mode === mode)));
      document.getElementById("layout").classList.toggle("hide-notes", mode !== "notes");
    }

    document.getElementById("caseList").addEventListener("click", event => {
      const btn = event.target.closest("[data-case]");
      if (!btn) return;
      activeId = btn.dataset.case;
      paintList();
      paintNotes();
      paintContent();
    });
    document.getElementById("hint").addEventListener("click", event => {
      const btn = event.target.closest("[data-act]");
      if (!btn || btn.disabled) return;
      if (btn.dataset.act === "toggle-doc") {
        docOpen = !docOpen;
        paintContent();
      }
      if (btn.dataset.act === "add-ask") {
        extraAsk = 1;
        paintContent();
      }
    });
    document.querySelector(".mode").addEventListener("click", event => {
      const btn = event.target.closest("[data-mode]");
      if (btn) setMode(btn.dataset.mode);
    });

    const THEME_KEY = "chatdemo-outline-theme";
    function setTheme(dark) {
      document.documentElement.classList.toggle("theme-dark", dark);
      try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (_) {}
      document.querySelectorAll("[data-theme-mode]").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.themeMode === (dark ? "dark" : "light")));
      });
    }
    document.getElementById("themeSwitch").addEventListener("click", event => {
      const btn = event.target.closest("[data-theme-mode]");
      if (btn) setTheme(btn.dataset.themeMode === "dark");
    });
    try { setTheme(localStorage.getItem(THEME_KEY) === "dark"); } catch (_) { setTheme(false); }

    fetch("version.json").then(r => r.json()).then(v => {
      document.getElementById("verLabel").textContent = v.version || "";
    }).catch(() => {});

    paintList();
    paintNotes();
    setMode("preview");
    paintContent();
  </script>
</body>
</html>
