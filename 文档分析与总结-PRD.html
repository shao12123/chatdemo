# 文档分析与总结 PRD

| 项目 | 内容 |
|---|---|
| 文档状态 | 产品定稿 · 第 8 节问题已全部确认 |
| 版本 | v0.2 · 2026-11-24（PRD 只保留产品功能 / 逻辑 / 交互 / UI） |
| 交互 Demo | [大模型代码评审.html](大模型代码评审.html)：左侧 8 个 case；右上角「说明」 |
| 适用读者 | 产品、设计、开发、测试 |
| 本文写什么 | **功能、产品逻辑、交互、UI**。不写接口、前后端分工、埋点、实现任务拆分 |

> 开发依据：**Demo + 本文**。**内容与推荐逻辑不变**，本期只改呈现。流式本期不做，整条一次出现。第 8 节已确认按结论。

---

## 1. 背景与目标

### 1.1 现状
用户上传文档 / 图片 / 表格后问「这个里面讲了什么」「这些材料一起讲了什么」，线上回复多为长 Markdown：
- 多附件时要点揉在一段里，分不清「哪个文件说了什么」；
- 有事实数字、对照关系、台账表、规范条款、无结构速记等不同材料，却几乎同一套段落排版；
- 关键判断、指标、表格与原文摘录缺少统一闸门，容易空壳占位或层级过深。

### 1.2 目标
- **内容和结论不变**：只改 Chat 内呈现；不改模型总结策略与文案口径（Demo 文案对齐线上 case）。
- 一套「总结报告」组件族，按材料信号选壳，普适于「内容总结」宽场景（不绑死某一行业文档）。
- 模块闸门：有数据才渲染；多附件可拆多张「总结报告」外框，与导语同宽。
- 与全站规范一致：思考过程、操作栏、Tip Block、消息目录、颜色 token、悬停气泡。

### 1.3 成功标准
- 用户一眼能分清：总判断 / 按文件或按要点拆开的报告 / 提示。
- 无数据模块不出现空格子；一张交互卡最多两层。
- 台账类能看到表；无结构速记不出现指标格。
- 结构化失败时回退完整 Markdown（不空白、不报错页）。

---

## 2. 范围

### 2.1 本期做
1. 文档分析与总结场景的结构化输出与渲染（第一轮为主；见 4.2）。
2. 组件：思考过程、导语、总结报告卡（含壳族与模块）、提示块、操作栏、长回复消息目录。
3. **模块闸门**与 **壳族映射**（第 5 节）：`metric` / `points` / `material` / `spec` / `ledger` / `catalog` / `notes`。
4. 多附件：用户侧每文件独立 `file-chip`（图可带缩略图）；回复侧可按文件拆多张「总结报告」。
5. 表格模块、合作对照块、原文摘录（quotes）、章节 Tab（卡内全文）。
6. 深浅模式：颜色走全站 token（见全站规范 / 行程对比 PRD 5.6）。
7. 兜底：结构化失败回退 Markdown。
8. 异常与恢复：接入《生成异常与恢复》（非 PPT）。

### 2.2 本期不做
- 纯 Markdown 线上总结长文形态的视觉复刻（另议）。
- 改写 / 翻译 / 抽取待办等「总结以外」的二次任务入口（可后续加推荐操作）。
- 右侧强制打开原文（点文件入口可选打开；章节原文以卡内 Tab 为主）。
- 流式逐块出现（Demo 仅演示）。
- 用户在报告卡内编辑结论、拖拽重排模块。
- PPT 分页恢复逻辑（沿用标注修改 Demo）。

---

## 3. 场景

**要识别的场景是「内容总结」**：用户基于已上传或已引用的材料，要一份可读的总结 / 要点 / 对照（不是行程规划、不是论文对比写作）。

Demo / 验收里的 8 个 case **只是信号样例**，用来覆盖壳族与模块组合，**不是触发白名单**——只要属于内容总结且能交付结构化载荷，就走本需求。

| Case（Demo） | 材料信号 | 壳 `shell` | 关键呈现 |
|---|---|---|---|
| 大模型代码评审 | 可计数事实 + 对比指标 | `metric` | verdict + facts + metrics + conclusion + chapters |
| 骨架类型正确 | 规则 / 判断要点 | `points` | verdict + points + conclusion |
| AICode 合作提案 | 多页图材料 | `material` | 总判断 + 每页一张总结报告（缩略图 / 标签 / 对照 / 要点） |
| 家用机器人规范 | 规范条款 | `spec` | verdict + fields + 左边线 sections |
| 付费模版库 | 台账 / Excel | `ledger` | verdict + facts + **table 优先** + sections |
| 研究学习环境课件 | 分类目录 | `catalog` | verdict + facts + 分类 sections |
| 帮我总结下这些文件里讲了什么 | 多附件混合 | `material` | 每文件一张「总结报告」；图旁缩略图+标签+核心主题；合作对照；未读用表 |
| 杂乱会议笔记 | 无结构速记 | `notes` | 总判断 + **拆多张要点卡** + quotes；无指标格 |

---

## 4. 交互流程

### 4.1 第一轮
1. 用户发送 query（常预填「这个里面讲了什么」或「帮我总结下这些文件里讲了什么」），附件以文件卡展示。
2. **思考过程**：MoreAI 头像 + 名称；阶段流光 + 秒数；展开为步骤。默认展开，回复开始出现时收起「已完成 N 秒」，头像跳一下。最后一步固定写「按推荐组织报告卡。需要换看法时，写完后再说。」（与全站「少选择」一致）。
3. **回复**，整条一次出现（流式本期不做），自上而下固定顺序：
   1. 导语；
   2. 总结报告（单卡，或 `fileCards` / `split: points` 拆成多张外框）；
   3. 提示块（有 `tip` 才出）；
   4. 操作栏。
4. **操作栏**：复制、重新生成、赞、踩、分享 + 时间（悬停显示）。用户消息带文件时仅复制该消息。

### 4.2 第二轮起
- 触发：用户输入换看法 / 追问某一文件或某一段。
- 回复：思考过程 → 导语（可更短）→ 报告卡（可只含相关模块）→（tip）→ 操作栏。
- **不强制**重复首轮全部附件拆卡；按新问题裁剪载荷。

### 4.3 其他交互
| 交互 | 规则 |
|---|---|
| 文件入口 | 对话内 `file-chip` 整卡可点；可选打开右侧原文 |
| 章节 Tab | 仅 Chat 卡内切换全文，不因此强制打开右侧 |
| 消息目录 | ≥2 个可跳转块且右侧未开时显示：用户提问 / 导语 / 各总结报告（含总判断、按文件、按要点）/ 提示 |
| 赞 / 踩 | 互斥，再点取消；点踩不弹原因 |
| 编辑用户消息 | 原位编辑，发送后末尾新增并重新生成；生成中不可编辑 |
| 重新生成 | 与论文对比一致：新版本 + 版本切换；Demo 可为原位重跑 |

## 5. 组件与样式规范

### 5.1 组件清单
| 组件 | 出现条件 | 形态 | 依赖字段 |
|---|---|---|---|
| 思考过程 | 每轮 | 复用全站路线思考（绿勾 + `.exec` + `.exec-dot`） | `think[]` |
| 导语 | 每轮 | 正文，宽与报告卡一致（Demo：`min(560px, 100%)`） | `lead` |
| 总结报告卡 | 每轮 | 一层外框；内模块最多再一层 | 见 5.2、5.3 |
| 提示块 | `tip` 非空 | 全站 Tip Block | `tip` |
| 操作栏 | 每轮 | 复用全站 | — |
| 消息目录 | 长回复 | 复用全站 outline | `data-sum-sec` |
| 用户文件卡 | 有附件 | `file-chip`；多文件纵向叠放；图可缩略图 | `files[]` / `file` |

### 5.2 模块闸门（有数据才渲染）
每个模块入口先判空；无数据返回空，**禁止为空壳占位**。

| 模块 | 用途 | 槽位 |
|---|---|---|
| `verdict` | 总判断 | `tag` + `text` |
| `thumbs` | 可选缩略条（少用；材料卡优先用文件头缩略图） | `string[]` |
| `facts` | 事实格（可计数摘要） | `label` / `value` / `note` |
| `metrics` | 对比指标组 | `kicker` + `items[]`（同 facts 槽位） |
| `points` | 要点卡 | `tag` / `title` / `text` |
| `fields` | 键值说明条 | `label` / `text` |
| `quotes` | 原文摘录（保留语气） | `string[]` |
| `sections` | 章节块 + 列表 | `title` + `bullets[]` |
| `table` | 台账 / 样例表 | `kicker` / `headers` / `rows` |
| `conclusion` | 收束 | `label` / `text` / `note` |
| `chapters` | 卡内原文 Tab | `id` / `name` / `title` + 关联 `doc.sections` |
| `fileCards` | 按文件 / 按页的材料卡（触发多外框） | 见 5.4 |
| `tip` | 卡外提示 | 全站 Tip Block 结构 |

**单卡默认顺序**：`verdict` → `thumbs` → `facts` → `metrics` → `points` → `fields` → `quotes` → `kicker` → `sections` → `table` → `conclusion` → `chapters`。其后 `tip` → 操作栏。

**多外框**：
- 有 `fileCards`：可选先出一张含 `verdict`（+ facts/conclusion）的「总判断」卡，再按文件各出一张「总结报告」。
- `split: "points"`：可选总判断卡（含 `quotes`），再按每个 point 各出一张「总结报告」。

### 5.3 壳族（`card.shell`）
壳只调样式与推荐模块组合，**不改文案**。颜色仍只表层级；强调用字重。

| shell | 视觉要点 | 推荐模块组合 |
|---|---|---|
| `metric` | 事实格 + 指标组突出 | verdict + facts + metrics + conclusion（+ chapters） |
| `points` | 要点卡白底描边，略抬一层 | verdict + points + conclusion |
| `material` | 文件头缩略图 + 标签 + 核心主题；可含对照 | fileCards（+ 总判断） |
| `spec` | 章节左边品牌线；可配 fields | verdict + fields + sections |
| `ledger` | 事实格 + 表强调 | verdict + facts + table + sections |
| `catalog` | 分类章节圆点前缀 | verdict + facts + sections |
| `notes` | 外框虚线、偏速记；拆多张要点 | verdict + split points + quotes |

### 5.4 材料卡（`fileCards[]` 单项）
| 字段 | 说明 |
|---|---|
| `file` / `title` | 文件名与标题 |
| `kind` | `img` 时可出内联缩略图 |
| `thumb` / `thumbLabel` | 缩略标识 |
| `tags[]` | 标签胶囊 |
| `core` | 「核心主题：…」 |
| `compare` | 左右对照：`left` / `right`（`label` + `items[]`）+ `mid` |
| `bullets[]` | 要点列表 |
| `table` | 可选表（如未识别内容） |

### 5.5 信号 → 壳（普适映射）
实现与评测按信号选壳，勿写死 case 名：

| 信号 | 壳 |
|---|---|
| 可核对数字 / 实验对照 | `metric` |
| 规则、清单、离散判断点 | `points` |
| 多文件或多页图文材料 | `material` |
| 设计 / 交互 / 禁止项等规范 | `spec` |
| 表格台账、字段资产 | `ledger` |
| 技能 / 能力 / 目录分类 | `catalog` |
| 无标题层级的口语速记 | `notes` |

同一回复只选一个主壳；`fileCards` 与 `split` 可在主壳下拆多外框。

### 5.6 视觉约束（摘录）
- 最多两层卡；次要容器底 `#EEF0F3`（深色走 token）。
- 报告外框与导语同宽（Demo 560）。
- 表：圆角 12；Tip Block / 错误卡：圆角 14。
- 禁止 `.think-tag` 灰胶囊 + 扁 `think-list`；思考必须抄路线 `routeThinkHtml`。
- 悬停气泡、输入框、错误卡片：见 `docs/CHATDEMO-STANDARDS.md`。

## 6. 产品规则与边界

### 6.1 模块闸门
- 第 5 节各模块：**有数据才渲染**，去掉任一模块数据后界面不留空壳。
- 至少要有总判断、文件卡或要点之一，否则整段回退 Markdown。
- 壳（shell）按材料信号映射，不绑死某个 Demo case；非法壳按要点样式降级，不阻断呈现。
- 思考固定 3 步；最后一步含「按推荐组织报告卡…」。

### 6.2 多附件与壳
- 多附件：按文件（或按页）**各一张**「总结报告」外框；可先有总判断。
- 单文件：默认可单卡，不必强行拆文件卡。
- 报告卡与导语同宽。
- 用户侧附件展示文件名、体积类型等元信息；图片可有预览，Demo 可用色块占位。

### 6.3 消息目录锚点（产品）
长回复且右侧关闭时，消息目录可跳到：

| 块 | 目录标题 |
|---|---|
| 用户问 | 用户提问 |
| 导语 | 导语 |
| 单卡报告 | 总结报告 |
| 多文件总判断 | 总判断 |
| 各文件卡 | 文件 / 页标题 |
| 拆要点各卡 | 要点标题 |
| 提示块 | 提示 |

### 6.4 触发与互斥
- 用户消息含附件或可解析引用，且意图为内容总结 → 走本结构化回复。
- 与行程规划互斥：行程走行程对比场景。
- Tip、错误卡、异常恢复：全站公共，本 PRD 不重定义。

### 6.5 边界
| 情况 | 处理 |
|---|---|
| 无附件纯口头「总结一下刚才」 | 上下文有材料仍可走；否则普通 Markdown |
| 表格过大 | 只展示样例行 + 说明全量规模 |
| 图片无法预览 | 无缩略图，保留文件名与要点 |
| 结构化失败 | 整段 Markdown 回退 |
| 部分文件失败 | 成功文件照常总结；失败按异常规范提示，不画空报告卡 |
| 与异常叠加 | 完全遵循《生成异常与恢复》 |

## 7. 验收标准

### 7.1 功能

- [ ] 思考 3 步，最后一步含约定文案。
- [ ] 有 tip 才出提示块；在报告后、操作栏前。
- [ ] 长回复且右侧关闭时，消息目录可跳各报告块。
- [ ] 结构化失败回退 Markdown。

- [ ] 各壳可区分，不靠彩色字叠彩色底。
- [ ] 思考为路线绿勾时间线，非灰胶囊。
- [ ] 与 Demo 并排对比一致。

</script>
  <script>
    const source = document.getElementById("prdSource").textContent.replace(/^\n/, "");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function inline(text) {
      let s = esc(text);
      s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}"${/\.html$/.test(u) ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`);
      return s;
    }
    function slug(text, used) {
      let base = text.replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "") || "sec";
      let id = base, n = 2;
      while (used.has(id)) id = base + "-" + n++;
      used.add(id);
      return id;
    }
    function render(md) {
      const lines = md.split("\n");
      const out = [];
      const toc = [];
      const used = new Set();
      let i = 0;
      const isTableSep = l => /^\s*\|?\s*:?-{2,}/.test(l) && l.includes("|");
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,3})\s+(.*)$/);
        if (h) {
          const level = h[1].length;
          const id = slug(h[2], used);
          if (level > 1) toc.push({ level, id, text: h[2] });
          out.push(`<h${level} id="${id}">${inline(h[2])}</h${level}>`);
          i++;
          continue;
        }
        if (/^---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
        if (/^>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`);
          continue;
        }
        if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
          out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === "待确认" ? '<span class="st-wait">待确认</span>' : c === "已确认" ? '<span class="st-ok">已确认</span>' : inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const ordered = /^\s*\d+\./.test(line);
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            const raw = lines[i];
            const depth = raw.match(/^\s*/)[0].length;
            const text = raw.replace(/^\s*([-*]|\d+\.)\s+/, "");
            items.push({ depth, text, ordered: /^\s*\d+\./.test(raw) });
            i++;
          }
          let html = "";
          const stack = [];
          items.forEach(item => {
            const lvl = item.depth >= 3 ? 1 : 0;
            while (stack.length > lvl + 1) html += `</li></${stack.pop()}>`;
            if (stack.length < lvl + 1) { const tag = item.ordered ? "ol" : "ul"; stack.push(tag); html += `<${tag}>`; }
            else html += "</li>";
            const task = item.text.match(/^\[ \]\s+(.*)$/);
            html += task ? `<li class="task">${inline(task[1])}` : `<li>${inline(item.text)}`;
          });
          while (stack.length) html += `</li></${stack.pop()}>`;
          out.push(html);
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const buf = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|---\s*$|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }
      return { html: out.join("\n"), toc };
    }
    const { html, toc } = render(source);
    document.getElementById("doc").innerHTML = html;
    document.getElementById("toc").innerHTML = toc.map(t => `<a class="l${t.level}" href="#${t.id}">${esc(t.text)}</a>`).join("");
    const toast = document.getElementById("toast");
    let timer = 0;
    function notify(text) { toast.textContent = text; toast.classList.add("show"); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove("show"), 1600); }
    document.getElementById("copyMd").addEventListener("click", () => {
      const done = () => notify("已复制 Markdown，可直接发给 AGENT");
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = source;
        area.style.position = "fixed";
        area.style.left = "-999px";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { notify("复制失败，请用「下载 .md」"); }
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(source).then(done).catch(fallback);
      else fallback();
    });
    document.getElementById("downloadMd").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([source], { type: "text/markdown;charset=utf-8" }));
      link.download = "文档分析与总结-PRD.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    });
    const links = [...document.querySelectorAll("nav.toc a")];
    const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1)));
    window.addEventListener("scroll", () => {
      let on = 0;
      heads.forEach((h, k) => { if (h && h.getBoundingClientRect().top < 120) on = k; });
      links.forEach((a, k) => a.classList.toggle("on", k === on));
    }, { passive: true });
  </script>
